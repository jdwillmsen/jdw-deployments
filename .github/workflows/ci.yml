name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Every job here only reads the tree; nothing writes back to the repo.
# pull-requests: read is for smoke-test's paths-filter step -- the shallow
# checkout leaves it no local diff to compare against, so it falls back to
# the GitHub API to list changed files, which needs this scope or it 403s.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint charts
        run: |
          for chart in charts/*/; do
            echo "linting $chart..."
            helm lint "$chart"
          done

  template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Template charts with each environment values
        run: |
          # Every values-<env>.yaml, discovered rather than listed: a
          # hard-coded env list leaves any new overlay unrendered and reading
          # as passing.
          for chart in charts/*/; do
            name=$(basename "$chart")
            for values_file in "$chart"values-*.yaml; do
              [ -f "$values_file" ] || continue
              echo "Templating $name with $(basename "$values_file")..."
              helm template "$name" "$chart" -f "$chart/values.yaml" -f "$values_file" > /dev/null
            done
          done

  vendored-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # This repo commits charts/*/charts/ rather than gitignoring it, so the
      # failure to catch is a Chart.yaml bump merged without re-vendoring. Left
      # unchecked ArgoCD is the first to notice, and it reports a missing
      # dependency as a broken sync rather than as the stale lockfile it is.
      #
      # No network: helm reads the committed archives and compares them against
      # Chart.lock, so a repository that has gone away cannot turn this green
      # or red on its own.
      - name: Vendored dependencies match Chart.lock
        run: |
          exit_code=0
          for chart in charts/*/; do
            [ -f "$chart/Chart.lock" ] || continue
            echo "Checking $chart..."
            # Process substitution, not a pipe: a piped while-loop runs in a
            # subshell whose variable assignments are discarded, so a mismatch
            # would set exit_code in a scope that no longer exists by the time
            # it is read.
            while read -r name version _repo status; do
              [ -n "$name" ] || continue
              if [ "$status" = "ok" ]; then
                echo "  $name $version ok"
              else
                echo "  ERROR: $name $version is '$status' — run helm dependency update and commit charts/"
                exit_code=1
              fi
            done < <(helm dependency list "$chart" | tail -n +2)
          done
          exit $exit_code

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The ApplicationSet generates one Application per entry here, so a typo
      # in a chartPath or a valueFiles entry becomes a failed sync rather than
      # a parse error anyone sees at review time.
      - name: Validate ArgoCD config files
        run: |
          exit_code=0
          for config in argocd/*/config.yaml; do
            echo "Validating $config..."

            apps=$(yq '.apps | length' "$config")
            for i in $(seq 0 $(( apps - 1))); do
              name=$(yq ".apps[$i].name" "$config")
              ns=$(yq ".apps[$i].namespace" "$config")
              chart_path=$(yq ".apps[$i].chartPath" "$config")

              if [ "$name" = "null" ] || [ -z "$name" ]; then
                echo "  ERROR: apps[$i] missing 'name'"
                exit_code=1
              fi

              if [ "$ns" = "null" ] || [ -z "$ns" ]; then
                echo "  ERROR: apps[$i] ($name) missing 'namespace'"
                exit_code=1
              fi

              if [ "$chart_path" = "null" ] || [ -z "$chart_path" ]; then
                echo "  ERROR: apps[$i] ($name) missing 'chartPath'"
                exit_code=1
              elif [ ! -d "$chart_path" ]; then
                echo "  ERROR: apps[$i] ($name) chartPath '$chart_path' does not exist"
                exit_code=1
              fi

              value_files=$(yq ".apps[$i].valueFiles | length" "$config")
              for j in $(seq 0 $(( value_files - 1 ))); do
                vf=$(yq ".apps[$i].valueFiles[$j]" "$config")
                if [ ! -f "$chart_path/$vf" ]; then
                  echo "  ERROR: apps[$i] ($name) valueFile '$chart_path/$vf' does not exist"
                  exit_code=1
                fi
              done
            done

            echo "  $apps apps validated"
          done
          exit $exit_code

  # Runs unconditionally (the file-change check gates steps, not the job) so
  # this stays a satisfiable required check on every PR, not just ones that
  # touch the Bedrock tag -- a job skipped entirely via a job-level `if`
  # never reports back, and GitHub then blocks merge on a required check that
  # can never pass.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect Bedrock image change
        id: changed
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            bedrock:
              - 'charts/minecraft-fwb/values.yaml'

      - name: Extract image repository/tag
        if: steps.changed.outputs.bedrock == 'true'
        id: image
        run: |
          repo=$(yq '.["minecraft-bedrock"].image.repository' charts/minecraft-fwb/values.yaml)
          tag=$(yq '.["minecraft-bedrock"].image.tag' charts/minecraft-fwb/values.yaml)
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Boots the real image and waits for it to answer a Bedrock status
      # query -- lint/template only check that the manifest renders, not that
      # the tag Renovate wants to auto-merge actually starts. mc-monitor is
      # bundled in the image already (same tool the chart's own sidecar
      # runs), so this needs no extra image to pull.
      #
      # Confirmed live against 2026.8.2: cold pull to "Server started" took
      # ~6s and `mc-monitor status-bedrock -host 127.0.0.1 -port 19132`
      # exits 0 once up, 1 (FATAL, connection refused) while it isn't -- the
      # 3-minute budget below is generous margin over that, well inside the
      # chart's own 10-minute production startupProbe allowance.
      - name: Boot smoke test
        if: steps.changed.outputs.bedrock == 'true'
        run: |
          image="${{ steps.image.outputs.repo }}:${{ steps.image.outputs.tag }}"
          echo "Booting $image..."
          docker run -d --name smoke-test -e EULA=TRUE "$image"

          ready=false
          for _ in $(seq 1 90); do
            if docker exec smoke-test mc-monitor status-bedrock -host 127.0.0.1 -port 19132 -retry-limit 0 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done

          docker logs smoke-test
          docker rm -f smoke-test

          if [ "$ready" != "true" ]; then
            echo "::error::$image never reported ready via mc-monitor status-bedrock"
            exit 1
          fi

  tools-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      # Both suites drive a fake kubectl, so they need no cluster. The recovery
      # one extracts its subject from the rendered chart, which is why helm is
      # set up above.
      - name: Shellcheck the operator tools
        run: shellcheck -s bash tools/mc tools/tests/*.sh

      # Discovered rather than listed, so a suite added alongside a new tool
      # is run without a second edit here -- a listed set silently skips
      # whatever nobody remembered to add.
      - name: Operator tool tests
        run: |
          for suite in tools/tests/test-*.sh; do
            echo "== $suite"
            bash "$suite"
          done
