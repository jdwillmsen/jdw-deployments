name: Renovate

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Runs as a PAT (RENOVATE_TOKEN secret), not the default GITHUB_TOKEN:
      # PRs opened with the default token are deliberately excluded from
      # triggering other workflows, so ci.yml's `pull_request` trigger would
      # never fire on Renovate's own PRs -- the required smoke-test/lint
      # checks would never run, and the auto-merge in renovate.json would
      # hang forever waiting on checks that can't exist.
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.2
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
