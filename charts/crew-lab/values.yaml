minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    # Pinned rather than latest: the tag versions the container tooling, and a
    # silent change underneath a running world is a hazard even in a lab. The
    # server binary itself is chosen by minecraftServer.version below, so the
    # two move independently.
    tag: "2026.9.2"
    pullPolicy: IfNotPresent

  # A StatefulSet terminates its pod and waits for it to go before creating the
  # replacement, so two writers never share the world volume. That is not
  # what makes it safe to move; the single-node affinity below is.
  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # A lab with the crew units and one or two watching players. A fraction of what a
  # full survival server needs: the world is freshly generated and small, and
  # the view distance below is kept low so the chunk cache stays small too.
  #
  # The namespace quota is shared with the main server's workloads, and what
  # looks uncommitted in it is not free: the backup (1000m), volume-recovery
  # and version-check (500m each) CronJobs need limits.cpu headroom to create
  # their pods at all. At 1500m here, plus the lone crew unit, long-lived pods held 7650m
  # of the 8000m cap and every backup from 2026-10-17 failed FailedCreate.
  # The cap is now 12 cores. At 400m, with three crew units plus test bots on,
  # the server was throttled in 25% of CPU periods (2026-10-20). It fell below
  # 20 ticks a second, and the units' break, pickup and chest waits timed out.
  # 1000m keeps the namespace near 7.8 of 12 cores, well above the jobs' 2-core
  # headroom.
  #
  # With 20 units each sending an input every 50 ms and loading its own chunks,
  # the server gets 2000m (JDW-128). Limits then total 7100m - 1000m + 2000m +
  # 17 new units x 50m = 8950m of 12000m, which leaves 3050m for the 2000m of
  # jobs. Memory stays at 2Gi: 643Mi was in use with three units, and the
  # namespace's memory limits (see crew.resources) have only 3.3Gi to spare.
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

  # One node, not "any". The world is a ReadWriteOnce iSCSI volume, and moving
  # the pod drags the volume to another node. democratic-csi's unstage reports
  # success while the ext4 journal is still dirty, so the receiving node's
  # fsck recovers the journal and corrects errors, discarding inodes; on the
  # main server that has cost world files more than once. Single-node affinity
  # forfeits failover, but there is no failover to forfeit: one process owns
  # one world with no clustering.
  #
  # The lab world is disposable, so losing it would be acceptable, but a
  # rescheduling that corrupts it silently would show up as odd crew behaviour
  # and waste debugging time. Pinning avoids that for free.
  #
  # talos-lx0-6a4 was chosen on 2026-10-16 by headroom: allocatable 15500m cpu
  # and 64Gi memory, with requests at 48% cpu and 24% memory and `kubectl top`
  # at 3% cpu and 23% memory. The other schedulable workers were at 66-93%
  # memory, or (talos-4h8-zy6) already carrying 97% of their memory limits.
  # This node is the roomiest, so it is the least likely to be the one a
  # neighbour's burst starves; recheck with `kubectl top nodes` if it fills.
  #
  # Revisit when the world moves off democratic-csi to the official TrueNAS CSI
  # driver -- the migration hazard is that driver's, not Kubernetes'.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-lx0-6a4

  minecraftServer:
    eula: "TRUE"
    # LATEST: Bedrock clients only connect within a narrow protocol window of
    # their own build, and the image checks for the current server on every
    # container start, independently of image.tag above. Left unreviewed here
    # because the world is disposable.
    version: "LATEST"
    difficulty: normal
    gameMode: survival
    levelName: crew-lab
    serverName: crew-lab
    cheats: true
    # Players join to watch crew work, alongside the crew units and their cameras.
    maxPlayers: 30
    tickDistance: 4
    viewDistance: 16
    playerIdleTimeout: 0
    maxThreads: 4

    # Offline: the server does not verify clients against Xbox Live, so crew
    # joins with a bare display name and no account. It also means a player can
    # join under any name, and claim any XUID. That is accepted because the
    # world is disposable and has no allow list anyway, but it is why nobody is
    # an operator: permissions.json keys operators by XUID, which an offline
    # client can forge. Lab commands go through the server console instead.
    # Do not add ops while online mode is off.
    onlineMode: false
    defaultPermission: member

    # A NodePort, like the main server's, so players on the LAN (and through a
    # router forward, from outside it) can join. serverPort matches nodePort
    # because the subchart says clients show a ping time only when they are
    # equal. 31136 sits clear of the main server's 31132 and 31134, which are
    # allocated cluster-wide whatever the protocol.
    serviceType: NodePort
    serverPort: 31136
    nodePort: 31136

    # Bedrock answers unconnected pings only when LAN visibility is on, and the
    # chart's own probes are exactly such a ping, so they can never pass
    # without it. It does not list the lab in a client's Friends tab: the LAN
    # discovery broadcast never reaches the pod through the NodePort.
    enableLanVisibility: true

  # The subchart's own env only covers part of the server's configuration.
  extraEnv:
    # Open by design. The image's allow list defaults on, which would refuse
    # crew's unknown name and every player not on the list.
    ALLOW_LIST: "false"
    # Bedrock 1.26.51 and later default a new world to NetherNet, which opens
    # no RakNet listener. crew dials RakNet only, and so do the probes this
    # subchart renders, so the transport is pinned.
    TRANSPORT: raknet

  # Gear for the crew units, from the unit-kit ConfigMap (templates/). An
  # offline-mode player has no XUID, so the server cannot persist its
  # inventory across a reconnect and every crew restart would otherwise leave
  # the units bare-handed. The pack tops the gear up instead of relying on it
  # surviving.
  #
  # The init container installs the pack into the world on every start and
  # merges it into world_behavior_packs.json, keeping any pack already there.
  # It reuses the server image (keep its tag in step with image.tag) only for
  # its jq; the root filesystem is
  # read-only, so everything it writes goes to the data volume.
  #
  initContainers:
    - name: install-unit-kit
      image: "itzg/minecraft-bedrock-server:2026.9.2"
      # The pack is copied only at pod start and the server reads functions
      # only at startup, so a changed pack needs a restart: bump this with any
      # edit to templates/unit-kit-configmap.yaml. It is an env var and not a
      # pod annotation because Argo CD ignores StatefulSet template
      # annotations here. The restart disconnects players.
      env:
        - name: UNIT_KIT_REV
          value: "5"
      command:
        - sh
        - -ec
        - |
          world=/data/worlds/crew-lab
          pack=crew-unit-kit
          id=e26bfbb9-d810-487c-ab14-fbbd10499c84
          mkdir -p "$world/behavior_packs/$pack/functions/unit_kit"
          cp /kit/manifest.json "$world/behavior_packs/$pack/manifest.json"
          cp /kit/tick.json "$world/behavior_packs/$pack/functions/tick.json"
          for f in init tick equip restock; do
            cp "/kit/$f.mcfunction" "$world/behavior_packs/$pack/functions/unit_kit/$f.mcfunction"
          done
          mkdir -p "$world/behavior_packs/$pack/functions/kits" "$world/behavior_packs/$pack/structures"
          cp /kit/dota.mcfunction "$world/behavior_packs/$pack/functions/kits/dota.mcfunction"
          cp /kit/dota_kit.mcstructure "$world/behavior_packs/$pack/structures/dota_kit.mcstructure"
          list="$world/world_behavior_packs.json"
          [ -s "$list" ] || echo '[]' > "$list"
          jq --arg id "$id" 'map(select(.pack_id != $id)) + [{pack_id: $id, version: [1, 0, 0]}]' "$list" > "$list.new"
          mv "$list.new" "$list"
      # Below the server's own, so the pod's quota charge is unchanged: an
      # init container counts only where it exceeds the main containers.
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 64Mi
          cpu: 50m
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: datadir
          mountPath: /data
        - name: unit-kit
          mountPath: /kit
          readOnly: true

  extraVolumes:
    - volumes:
        - name: unit-kit
          configMap:
            name: crew-lab-unit-kit

  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60

  # Lab world only: no backup, so it is rebuilt from scratch if it is lost.
  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 2Gi
      accessModes:
        - ReadWriteOnce

crew:
  enabled: true

  # One Deployment, Service and PVC per unit, all named by `id`, so
  # `kubectl logs deploy/crew-01` works without knowing the release name. The
  # `id` is fixed for life: volumes, Secrets, logs and the task API's identity
  # use it. `name` is the in-game username (16 characters at most; offline
  # mode has no account behind it). Names follow one ordered list by number:
  # 04 Dusty, 05 Ember, 06 Flint, 07 Gravel, 08 Hazel, 09 Ingot, 10 Jasper,
  # 11 Kettle, 12 Loam, 13 Marble, 14 Nugget, 15 Onyx, 16 Pebble, 17 Quartz,
  # 18 Rusty, 19 Slate, 20 Tinder, 21 Umber, 22 Vein, 23 Wick, 24 Xeno,
  # 25 Yarrow, 26 Zinc. Append, never renumber or rename.
  #
  # A unit may set `replicas: 0` to stop alone without losing its volume.
  #
  # `role` gives a unit standing work in its own plot of the yards below
  # (miner, chopper, hauler or shaft; templates/_helpers.tpl). `sharedVolume`
  # puts a unit's files in its own directory on the one crew-shared claim; units
  # 01-03 predate it and keep their own claims, which cannot be merged without
  # losing the atlas they already built.
  units:
    - id: crew-01
      name: Agate
      role: miner
    - id: crew-02
      name: Basalt
      role: chopper
    - id: crew-03
      name: Cobble
      role: hauler
    - id: crew-04
      name: Dusty
      role: miner
      sharedVolume: true
    - id: crew-05
      name: Ember
      role: chopper
      sharedVolume: true
    - id: crew-06
      name: Flint
      role: hauler
      sharedVolume: true
    - id: crew-07
      name: Gravel
      role: shaft
      sharedVolume: true
    - id: crew-08
      name: Hazel
      role: miner
      sharedVolume: true
    - id: crew-09
      name: Ingot
      role: chopper
      sharedVolume: true
    - id: crew-10
      name: Jasper
      role: hauler
      sharedVolume: true
    - id: crew-11
      name: Kettle
      role: shaft
      sharedVolume: true
    - id: crew-12
      name: Loam
      role: miner
      sharedVolume: true
    - id: crew-13
      name: Marble
      role: chopper
      sharedVolume: true
    - id: crew-14
      name: Nugget
      role: hauler
      sharedVolume: true
    - id: crew-15
      name: Onyx
      role: shaft
      sharedVolume: true
    - id: crew-16
      name: Pebble
      role: miner
      sharedVolume: true
    - id: crew-17
      name: Quartz
      role: chopper
      sharedVolume: true
    - id: crew-18
      name: Rusty
      role: hauler
      sharedVolume: true
    - id: crew-19
      name: Slate
      role: miner
      sharedVolume: true
    - id: crew-20
      name: Tinder
      role: chopper
      sharedVolume: true

  # Default for every unit; a unit's own `replicas` wins. Set to 0 (not
  # `enabled: false`) to stop units without deleting their volumes. Explicit
  # rather than templated-default; Sprig's `default` coerces 0 back to 1.
  replicas: 1

  image:
    repository: ghcr.io/jdwillmsen/minecraft-crew
    tag: "1.30.2"
    pullPolicy: IfNotPresent

  # Lab only: skip Microsoft sign-in. The lab server runs offline, so a signed
  # in unit could not join it anyway.
  offline: true

  viewDistance: 8
  statusPort: 8080

  # A public, view-only console at this host, served by crew-control (below):
  # every unit's camera and state, with no sign-in. The lab is not FWB, so
  # showing where a unit is costs nothing.
  # The task API and metrics stay cluster-only (templates/crew-route.yaml).
  route:
    enabled: true
    host: crew.prd.jdwlabs.com

  camera:
    enabled: true
    maxViewers: 4
    # On the data volume below. The first start fetches Mojang's sample
    # resource pack from github.com (the namespace allows egress) and builds the
    # atlas from it. If the fetch fails the view stays flat-coloured and the
    # build is retried on the next session, so it is not fatal.
    atlasDir: /data/atlas

  # A chest units rearm from when they have no sword or food on the hotbar.
  # It sits in the spawn courtyard, beside where units respawn. Crew never
  # stocks it: the unit-kit pack keeps its last slot full of bread, and the
  # swords in it were placed by hand. Empty `chest` turns rearming off.
  kit:
    chest: "3,64,-403"
    food: 8

  # The token-guarded task API (`POST /v1/tasks`). The chart only references
  # the Secret: its value never passes through Git or Argo CD, and the owner
  # creates it by hand (README, "Tasks"). One Secret serves every unit, so a
  # new unit needs no new Secret.
  tasks:
    enabled: true
    secretName: crew-tasks
    timeoutSeconds: 900

  probes:
    periodSeconds: 10
    # Generous so a busy unit is not killed for one slow answer.
    livenessFailureThreshold: 6

  # Per unit. Steady state is a single UDP session and a small HTTP server
  # (2-4m CPU idle, 176-257Mi measured on 2026-10-20 with the camera on). The
  # memory limit leaves a third over the peak for building the atlas from the
  # extracted pack and for camera viewers' sub-chunk replay. Both limits count
  # against the namespace quota, and the 20 units together are what
  # decides what is left for the CronJobs:
  #   limits.cpu     7100m now - 1000m (server) + 2000m + 17 x 50m = 8950m of
  #                  12000m, so 3050m remain for the backup (1000m) beside the
  #                  version-check and volume-recovery jobs (500m each)
  #   limits.memory  15104Mi + 17 x 384Mi + 3 x (384 - 512)Mi = 21248Mi of
  #                  24576Mi, so 3328Mi remain for the jobs (about 1Gi at once)
  #   requests.cpu   2570m + 17 x 20m + 300m (server) = 3210m of 6000m
  #   requests.memory 6544Mi + 17 x 128Mi = 8720Mi of 12288Mi
  # Raise the quota before raising any of these.
  resources:
    requests:
      memory: 128Mi
      cpu: 20m
    limits:
      memory: 384Mi
      cpu: 50m

  # Where the units work (JDW-128): a grid of 32x32-block plots on the flat
  # square, east of the test grounds, one per unit number (crew-01 is the
  # north-west plot, filled west to east then north to south). Five columns by
  # four rows span x 300..459, z -500..-373. Each plot holds a quarry, a grove
  # and two chests, kept supplied by the unit-kit pack's restock function, so
  # a plot is only ever touched by its own unit. Everything is at ground level
  # y 64 on the grass at y 63.
  yards:
    originX: 300
    originZ: -500
    columns: 5
    pitch: 32

  # Seconds between one unit's first login and the next's, by unit number, so
  # a rollout of 20 units does not log them in on one second (crew-20 waits
  # 114 s).
  joinStaggerSeconds: 6

  # The public console. It serves the page and reverse-proxies an allow-list of
  # each unit's camera routes, so the route reaches this one Service instead of
  # a unit, and the task API and metrics are never exposed. The units list
  # above feeds it; a unit with `replicas: 0` is left out.
  control:
    enabled: true
    image:
      repository: ghcr.io/jdwillmsen/minecraft-crew-control
      tag: "1.3.0"
      pullPolicy: IfNotPresent
    port: 8080
    logLevel: info
    # Two people today. An id is fixed for life: it names the invite file, the
    # passkeys and the work each operator queues. Ids match
    # ^[a-z][a-z0-9-]{1,15}$. Rendered inline into the Deployment, never a
    # ConfigMap, so changing who may sign in rolls the pod.
    operators:
      - id: owner
        name: Jake
      - id: josh
        name: Josh
    # Secrets the chart only references (README, "Signing in"). crew-control
    # treats both as optional: with no invites nobody can enrol, with no work
    # token the work API is shut. The units need the work token to start.
    invitesSecretName: crew-control-invites
    workTokenSecretName: crew-work
    # Session key, passkeys and spent invites survive restarts here.
    persistence:
      storageClass: truenas-nfs
      size: 64Mi
    # Same Postgres and the same credentials source as the FWB agent. Without a
    # host crew-control answers the work routes 503.
    database:
      credentials:
        # Rendered ahead of its reader (sync-wave, and a flag of its own), as
        # the FWB agent does, so a credential that fails to sync fails alone.
        create: true
      enabled: true
      host: platform-postgresql-cluster-prd-rw.database.svc.cluster.local
      port: 5432
      name: jdwillmsen_prd
    # Sign-in and the work queue add a little load to what was a plain relay.
    resources:
      requests:
        memory: 32Mi
        cpu: 10m
      limits:
        memory: 128Mi
        cpu: 50m

  persistence:
    # File tier, not block: a few small token files plus the atlas cache.
    storageClass: truenas-nfs
    # About 313 MB for the extracted pack plus the atlas, with room to grow.
    size: 1Gi
    # The crew-shared claim holds one such directory for each unit that sets
    # `sharedVolume`: 17 x 313 MB, with room to grow.
    sharedSize: 8Gi

# Nightly rebuild of the lab's test fields (minecraft/crew/lab in gameops), so
# a test starts from a clean state. Off here; the prd overlay turns it on.
# The crew image supplies the plans and scripts, so crew.image.tag must be a
# release that ships /labcourses before this is enabled.
labRebuild:
  enabled: false

  # Fields to rebuild, in order. Each replaces everything in its box.
  fields:
    - grounds
    - courses
    - trees
    - works

  # Crew names come from crew.units in the CronJob template. These patterns
  # cover other automation that is safe to leave connected during a rebuild.
  nonHumanPlayerPatterns:
    - load-*

  # 08:15 UTC, 03:15 CDT. The chart sets no timeZone on any CronJob, so every
  # schedule in it compares in UTC. The slot is when nobody is expected in the
  # lab; the job skips anyway while a person is online. A run takes under
  # twenty minutes.
  schedule: "15 8 * * *"
  startingDeadlineSeconds: 600

  # Four fields are about 4000 commands at about twenty a second, plus chunk
  # loading. Past this the run is stuck, and it ends rather than holding
  # ticking areas open.
  activeDeadlineSeconds: 2400
  ttlSecondsAfterFinished: 86400
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  # kubectl and bash for the feed; the same image as the main server's jobs.
  image: alpine/k8s:1.37.1

  # The namespace quota's memory limits have about 3Gi left, so these are small.
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 100m
  initResources:
    requests:
      memory: 16Mi
      cpu: 10m
    limits:
      memory: 64Mi
      cpu: 50m
