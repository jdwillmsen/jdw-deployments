{{- if and .Values.crew.enabled .Values.crew.control.enabled .Values.crew.control.database.credentials.create }}
# The prd Postgres credentials for crew-control's work queue.
#
# Synced ahead of the Deployment that reads it (wave -1), because a secret
# wired into a workload before its source exists stops that workload from
# starting. CloudNativePG generates these credentials into the database
# namespace and the k8s-secret-store mirrors them rather than copying them into
# Vault, where they would go stale on rotation.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "crew.control.dbSecret.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # A minute, so a rotated app-role password is not held stale for an hour.
  refreshInterval: 1m
  secretStoreRef:
    name: k8s-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ include "crew.control.dbSecret.name" . }}
    creationPolicy: Owner
  data:
    - secretKey: PG_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: platform-postgresql-cluster-prd-app
        property: username
    - secretKey: PG_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: platform-postgresql-cluster-prd-app
        property: password
{{- end }}
