{{- if .Values.crew.enabled }}
{{- $shared := false }}
{{- range $unit := .Values.crew.units }}
{{- if $unit.sharedVolume }}
{{- $shared = true }}
{{- else }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $unit.id }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "crew.labels" $unit.id | nindent 4 }}
spec:
  # Plain files with none of the locking or mmap needs that put a world on the
  # block tier: the sign-in token cache, and the texture atlas cache. The atlas
  # is the bulk of it, because the resource pack it is built from is extracted
  # beside it and kept so a restart does not download it again.
  storageClassName: {{ $.Values.crew.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $.Values.crew.persistence.size }}
{{- end }}
{{- end }}
{{- if $shared }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crew-shared
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: crew
spec:
  # One claim for every unit marked `sharedVolume`, each in its own directory
  # (templates/crew-deployment.yaml). The namespace caps claims at 20 and one
  # claim per unit would pass that at 20 units beside the other workloads.
  # File tier, so many pods can mount it.
  storageClassName: {{ $.Values.crew.persistence.storageClass }}
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: {{ $.Values.crew.persistence.sharedSize }}
{{- end }}
{{- end }}
