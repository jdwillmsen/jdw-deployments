{{- if and .Values.crew.enabled .Values.crew.route.enabled }}
# View-only on purpose: the public hostname reaches crew-control, which serves
# the console and proxies only each unit's camera and state. The units' task
# API shares their port and must never be routed here, and neither are
# /metrics or the probes. Rules are allow-listed paths rather than a catch-all
# with exclusions, so a route crew-control adds later stays private until
# someone lists it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crew
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: crew
spec:
  parentRefs:
    - name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ .Values.crew.route.host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        # The app redirects this to /.
        - path:
            type: Exact
            value: /camera
        - path:
            type: PathPrefix
            value: /units
        - path:
            type: PathPrefix
            value: /v1/units
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: crew-control
          port: {{ .Values.crew.control.port }}
{{- end }}
