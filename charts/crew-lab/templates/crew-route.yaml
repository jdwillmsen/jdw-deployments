{{- if and .Values.crew.enabled .Values.crew.route.enabled }}
# Sign-in, the operator work API and jobs are the only writes, and crew-control
# authenticates both. View-only otherwise: the public hostname reaches
# crew-control, which serves the console and proxies only each unit's camera and state. The units' task
# API shares their port and must never be routed here, and neither are
# /metrics or the probes. Rules are allow-listed paths rather than a catch-all
# with exclusions, so a route crew-control adds later stays private until
# someone lists it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crew
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: crew
spec:
  parentRefs:
    - name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ .Values.crew.route.host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        # The app redirects this to /.
        - path:
            type: Exact
            value: /camera
        - path:
            type: PathPrefix
            value: /units
        # Exact, not a prefix: /v1/units/{id}/work and /events are for the
        # units and must stay unrouted.
        - path:
            type: Exact
            value: /v1/units/stream
        - path:
            type: Exact
            value: /signin
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /v1/work
        - path:
            type: PathPrefix
            value: /v1/jobs
        - path:
            type: PathPrefix
            value: /v1/places
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: crew-control
          port: {{ .Values.crew.control.port }}
{{- end }}
