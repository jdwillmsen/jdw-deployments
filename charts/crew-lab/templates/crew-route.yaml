{{- if and .Values.crew.enabled .Values.crew.route.enabled }}
# Sign-in, the operator work API and jobs are the only writes, and crew-control
# authenticates both. View-only otherwise: the public hostname reaches
# crew-control, which serves the console and proxies only each unit's camera and state. The units' task
# API shares their port and must never be routed here, and neither are
# /metrics or the probes. Rules are allow-listed paths rather than a catch-all
# with exclusions, so a route crew-control adds later stays private until
# someone lists it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: crew
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: crew
spec:
  parentRefs:
    - name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ .Values.crew.route.host | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
        # The app redirects this to /.
        - path:
            type: Exact
            value: /camera
        - path:
            type: PathPrefix
            value: /units
        # Exact, not a prefix: /v1/units/{id}/work and /events are for the
        # units and must stay unrouted.
        - path:
            type: Exact
            value: /v1/units/stream
        # The console's redacted squad snapshot. Exact: /v1/squads and each
        # squad's hello, status and orders are for the units and operators.
        - path:
            type: Exact
            value: /v1/squads/stream
        # Read-only analytics. Exact and anchored: /v1/units/{id}/work and
        # /events are for the units and must stay unrouted.
        - path:
            type: Exact
            value: /v1/insights
        - path:
            type: Exact
            value: /v1/capacity
        - path:
            type: RegularExpression
            value: /v1/units/[^/]+/explain$
        - path:
            type: RegularExpression
            value: /v1/units/[^/]+/inventory/changes$
        # Exact: POST /v1/events/prune is an operator write and stays unrouted.
        - path:
            type: Exact
            value: /v1/events
        - path:
            type: Exact
            value: /v1/replay/positions
        # Alerts are readable by anyone; ack and mute are gated by sign-in in
        # crew-control. Anchored so no other /v1/alerts path is exposed.
        - path:
            type: Exact
            value: /v1/alerts
        - path:
            type: Exact
            value: /v1/alerts/stream
        - path:
            type: RegularExpression
            value: /v1/alerts/[^/]+/(ack|mute)$
        # The explorer answers operators only (and rejects anyone else with
        # 401), so a prefix is safe.
        - path:
            type: PathPrefix
            value: /v1/explorer
        - path:
            type: Exact
            value: /signin
        - path:
            type: PathPrefix
            value: /auth
        - path:
            type: PathPrefix
            value: /v1/work
        - path:
            type: PathPrefix
            value: /v1/jobs
        - path:
            type: PathPrefix
            value: /v1/places
        # Exact: the density route is signed-in only inside crew-control.
        - path:
            type: Exact
            value: /v1/heatmap
        - path:
            type: PathPrefix
            value: /static
      backendRefs:
        - name: crew-control
          port: {{ .Values.crew.control.port }}
{{- end }}
