{{- if .Values.crew.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crew.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "crew.name" . }}
spec:
  # ClusterIP: the only outside path in is the view-only HTTPRoute, which never
  # reaches the task API or metrics on this same port.
  type: ClusterIP
  ports:
    - name: status
      port: {{ .Values.crew.statusPort }}
      targetPort: status
      protocol: TCP
  selector:
    app: {{ include "crew.name" . }}
{{- end }}
