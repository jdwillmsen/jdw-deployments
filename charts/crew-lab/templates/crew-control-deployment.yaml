{{- if and .Values.crew.enabled .Values.crew.control.enabled }}
{{- $units := list }}
{{- range .Values.crew.units }}
{{- /* Stopped units are left out so the console does not list cameras that cannot answer. */}}
{{- $reps := ternary .replicas $.Values.crew.replicas (hasKey . "replicas") }}
{{- if ne (int $reps) 0 }}
{{- $units = append $units (dict "id" .id "name" .name "url" (printf "http://%s:%v" .id $.Values.crew.statusPort)) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crew-control
  namespace: {{ .Release.Namespace }}
  labels:
    app: crew-control
    app.kubernetes.io/component: crew-control
spec:
  # Zero when every unit is stopped: crew-control refuses an empty roster and
  # would crash-loop, so it stops with them.
  replicas: {{ if $units }}1{{ else }}0{{ end }}
  revisionHistoryLimit: 0
  # Recreate: the data volume is ReadWriteOnce, so a rolling update would start
  # the new pod while the old one still holds it. The two would also race on
  # passkeys.json and the session key.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crew-control
  template:
    metadata:
      labels:
        app: crew-control
        app.kubernetes.io/component: crew-control
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crew-control
          image: "{{ .Values.crew.control.image.repository }}:{{ .Values.crew.control.image.tag }}"
          imagePullPolicy: {{ .Values.crew.control.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CREW_UNITS
              value: {{ $units | toJson | quote }}
            - name: LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.crew.control.port }}"
            - name: LOG_LEVEL
              value: {{ .Values.crew.control.logLevel | quote }}
            - name: PUBLIC_ORIGIN
              value: {{ printf "https://%s" .Values.crew.route.host | quote }}
            - name: CREW_OPERATORS
              value: {{ .Values.crew.control.operators | toJson | quote }}
            - name: CREW_PLACES
              value: {{ .Values.crew.control.places | toJson | quote }}
            - name: CREW_INVITES_DIR
              value: /invites
            - name: DATA_DIR
              value: /data
            - name: WORK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crew.control.workTokenSecretName }}
                  key: token
                  optional: true
            {{- with .Values.crew.control.database }}
            {{- if .enabled }}
            - name: PG_HOST
              value: {{ .host | quote }}
            - name: PG_PORT
              value: {{ .port | quote }}
            - name: PG_DATABASE
              value: {{ .name | quote }}
            # From the ExternalSecret, not values: a password in plain env
            # would sit in the Deployment object.
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "crew.control.dbSecret.name" $ }}
                  key: PG_USERNAME
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "crew.control.dbSecret.name" $ }}
                  key: PG_PASSWORD
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.crew.control.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: {{ .Values.crew.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: invites
              mountPath: /invites
              readOnly: true
          resources:
            {{- toYaml .Values.crew.control.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crew-control
        - name: invites
          secret:
            secretName: {{ .Values.crew.control.invitesSecretName }}
            optional: true
{{- end }}
