{{- /*
A behaviour pack that keeps every crew unit's gear topped up. It lives in this
chart, and not in the shared server chart, so it cannot be switched on for the
main server. The server pod mounts it by this fixed name (values.yaml,
minecraft-bedrock.extraVolumes).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: crew-lab-unit-kit
  namespace: {{ .Release.Namespace }}
data:
  manifest.json: |
    {
      "format_version": 2,
      "header": {
        "name": "Crew unit kit",
        "description": "Keeps the crew units equipped",
        "uuid": "e26bfbb9-d810-487c-ab14-fbbd10499c84",
        "version": [1, 0, 0],
        "min_engine_version": [1, 21, 0]
      },
      "modules": [
        {
          "type": "data",
          "uuid": "d83ae7f5-7887-400b-bc90-451510d633e6",
          "version": [1, 0, 0]
        },
        {
          "type": "script",
          "language": "javascript",
          "entry": "scripts/main.js",
          "uuid": "f362af6c-504e-46c4-b8d5-1171d31ef0a6",
          "version": [1, 0, 0]
        }
      ],
      "dependencies": [
        {
          "module_name": "@minecraft/server",
          "version": "2.0.0"
        }
      ]
    }
  # Two functions, so the objective's "already exists" failure never touches the
  # counter or the equipping.
  tick.json: |
    {
      "values": ["unit_kit/init", "unit_kit/tick"]
    }
  # Dotablaze's named, enchanted and trimmed kit, handed over from the console
  # with `execute as Dotablaze at @s run function kits/dota`. The items drop at
  # the player's feet, so they land straight in the inventory, and the script
  # below then wears the armour and arranges the hotbar.
  dota.mcfunction: |
    structure load dota_kit ~ ~ ~ 0_degrees none true false
    scriptevent kits:arrange Dota's
  # The Light King's kit, with his pets: the script spawns Cassy beside him,
  # tamed to him and armoured, unless one already exists, and keeps his cats
  # (see PETS below).
  lightking.mcfunction: |
    structure load lightking_kit ~ ~ ~ 0_degrees none true false
    scriptevent kits:arrange Light King's
    scriptevent kits:dog Cassy
    scriptevent kits:cats
  # Commands cannot move a named or trimmed item without rebuilding it bare, so
  # a script wears the kit's armour, puts its weapons and pickaxes in the hotbar
  # and its shield in the off hand, swapping out what was there. The message is
  # the kit owner's name prefix, as in the item names ("Dota's", "Legendary
  # Vanguard"). Bedrock has no command that sets a wolf's owner, so the script
  # tames the dog.
  # It also hands each listed player their kit once, on their first join after
  # this tag was set; change the tag to hand everyone theirs again. And it
  # deletes gear a catalog kit mob drops (tools/crew-lab-kits.py marks it).
  main.js: |
    import { world, system, EquipmentSlot } from "@minecraft/server";

    const KIT_ON_JOIN = { Dotablaze: "dota", LightKing0221: "lightking" };
    const KIT_ON_JOIN_TAG = "kit_on_join_1";
    const MOB_GEAR = "§r§8Mob gear";

    world.afterEvents.playerSpawn.subscribe(({ player, initialSpawn }) => {
      const kit = KIT_ON_JOIN[player.name];
      if (!initialSpawn || !kit || player.hasTag(KIT_ON_JOIN_TAG)) return;
      // A kit loaded before the chunks around a joining player are ticking
      // drops nothing, so it waits 10 s.
      system.runTimeout(() => {
        if (!player.isValid || player.hasTag(KIT_ON_JOIN_TAG)) return;
        // Tagged first, so a kit that half-ran is not handed out twice; a
        // command that could not run at all leaves the player eligible.
        player.addTag(KIT_ON_JOIN_TAG);
        try {
          player.runCommand(`function kits/${kit}`);
        } catch (e) {
          player.removeTag(KIT_ON_JOIN_TAG);
          throw e;
        }
      }, 200);
    });

    world.afterEvents.entitySpawn.subscribe(({ entity }) => {
      if (entity.typeId !== "minecraft:item") return;
      if (entity.getComponent("item")?.itemStack.getLore().includes(MOB_GEAR)) entity.remove();
    });

    const WORN = {
      helmet: EquipmentSlot.Head,
      chestplate: EquipmentSlot.Chest,
      leggings: EquipmentSlot.Legs,
      boots: EquipmentSlot.Feet,
    };
    // The first nine of these a kit has fill the hotbar, in this order.
    const HOTBAR = [
      "Sword", "Axe", "Mace", "Breaker Mace", "Spear", "Trident", "Riptide Trident", "Bow", "Crossbow",
      "Scatter Crossbow", "Fortune Pickaxe", "Silk Pickaxe", "Shovel", "Hoe", "Shears", "Fishing Rod",
    ];

    system.afterEvents.scriptEventReceive.subscribe(({ id, message, sourceEntity }) => {
      if (sourceEntity?.typeId !== "minecraft:player") return;
      // The dropped kit is picked up over the following ticks.
      if (id === "kits:arrange") system.runTimeout(() => arrange(sourceEntity, message.trim()), 40);
      if (id === "kits:dog") adopt(sourceEntity, message.trim());
      if (id === "kits:cats") keepCats(sourceEntity);
    });

    // A cat's coat and age are rolled by its spawn event and no command or event
    // picks them, so each cat is spawned again until the roll matches. Variant
    // 2 is the orange (red) coat, 9 the black one. A cat's growing up cannot be
    // undone, so a baby that has grown is replaced by a fresh one.
    const PETS_OWNER = "LightKing0221";
    const PETS = [
      { name: "Ollie", variant: 2, baby: false },
      { name: "Ellie", variant: 2, baby: false },
      { name: "Melly", variant: 9, baby: true },
    ];
    const MAX_ROLLS = 300;
    const rolling = new Set();

    function keepCats(player) {
      for (const pet of PETS) {
        const cats = player.dimension.getEntities({ type: "minecraft:cat", name: pet.name });
        const good = cats.filter((c) => !pet.baby || c.getComponent("minecraft:is_baby"));
        // A second cat of the same name is a leftover of an interrupted roll.
        for (const extra of cats.filter((c) => c !== good[0])) extra.remove();
        if (good.length === 0 && !rolling.has(pet.name)) {
          rolling.add(pet.name);
          roll(player, pet, MAX_ROLLS);
        }
      }
    }

    function roll(player, pet, left) {
      if (!player.isValid || left === 0) {
        rolling.delete(pet.name);
        return;
      }
      const cat = player.dimension.spawnEntity("minecraft:cat", player.location);
      // The spawn event's component groups apply a tick after the entity exists.
      system.runTimeout(() => {
        if (!cat.isValid) return roll(player, pet, left - 1);
        const variant = cat.getComponent("minecraft:variant")?.value;
        const baby = !!cat.getComponent("minecraft:is_baby");
        if (variant !== pet.variant || baby !== pet.baby) {
          cat.remove();
          return roll(player, pet, left - 1);
        }
        cat.nameTag = pet.name;
        const tame = cat.getComponent("tameable");
        if (tame && !tame.isTamed) tame.tame(player);
        rolling.delete(pet.name);
      }, 2);
    }

    // Cats and the dog are kept for their owner while he is on the lab, so a
    // cat that died, or a baby that grew up, is replaced within a minute.
    system.runInterval(() => {
      const owner = world.getPlayers({ name: PETS_OWNER })[0];
      if (!owner) return;
      keepCats(owner);
      adopt(owner, "Cassy");
    }, 1200);

    function adopt(player, name) {
      // The dog was once named Cassie; she is replaced, not renamed.
      for (const old of player.dimension.getEntities({ type: "minecraft:wolf", name: "Cassie" })) old.remove();
      let dog = player.dimension.getEntities({ type: "minecraft:wolf", name })[0];
      if (!dog) {
        dog = player.dimension.spawnEntity("minecraft:wolf", player.location);
        dog.nameTag = name;
        // The snowy pelt is the white one; its spawn event must run before the taming.
        dog.triggerEvent("minecraft:spawn_wild_snowy");
      }
      // Only a wild wolf carries the component; a tamed one has swapped it away.
      const tame = dog.getComponent("tameable");
      if (tame && !tame.isTamed) tame.tame(player);
      dog.runCommand("replaceitem entity @s slot.armor.body 0 wolf_armor 1");
    }

    function arrange(player, owner) {
      if (!player.isValid) return;
      const inv = player.getComponent("inventory").container;
      // Names are "<owner> <title>" once the colour codes and the "!!"
      // sparkle are gone.
      const find = (title) => {
        for (let i = 0; i < inv.size; i++) {
          const name = inv.getItem(i)?.nameTag?.replace(/§./g, "").replace(/!!/g, "").trim();
          if (name === `${owner} ${title}`) return i;
        }
        return -1;
      };
      for (let i = 0; i < inv.size; i++) {
        const item = inv.getItem(i);
        const piece = item?.typeId.split("_").pop();
        if (!WORN[piece] || !item.nameTag?.replace(/§./g, "").includes(`${owner} `)) continue;
        const worn = player.getComponent("equippable");
        const held = worn.getEquipment(WORN[piece]);
        worn.setEquipment(WORN[piece], item);
        inv.setItem(i, held);
      }
      let slot = 0;
      for (const title of HOTBAR) {
        const i = slot < 9 ? find(title) : -1;
        if (i < 0) continue;
        if (i !== slot) inv.swapItems(slot, i, inv);
        slot++;
      }
      const shield = find("Shield");
      if (shield >= 0) {
        const hands = player.getComponent("equippable");
        const held = hands.getEquipment(EquipmentSlot.Offhand);
        hands.setEquipment(EquipmentSlot.Offhand, inv.getItem(shield));
        inv.setItem(shield, held);
      }
    }
  init.mcfunction: |
    scoreboard objectives add unitkit dummy
    scoreboard objectives add kitroll dummy
    scoreboard objectives add kitwait dummy
  # 40 ticks is about 2 s: the gear check does not need to run every tick.
  # The lab world drops a dead unit's whole kit for anyone to take, so the
  # rule is turned on once; the marker keeps a later manual change in force.
  tick.mcfunction: |
    scoreboard players add kit unitkit 1
    execute if score kit unitkit matches 40.. run function unit_kit/equip
    execute if score kit unitkit matches 40.. run scoreboard players set kit unitkit 0
    scoreboard players add restock unitkit 1
    execute if score restock unitkit matches 1200.. run function unit_kit/restock
    execute if score restock unitkit matches 1200.. run scoreboard players set restock unitkit 0
    scoreboard players add rules unitkit 0
    execute if score rules unitkit matches 0 run gamerule keepinventory true
    scoreboard players set rules unitkit 1
  # Each line runs only for a unit missing that piece, so nothing is replaced
  # while it is held; `execute as` keeps a no-match from counting as a failure.
  # A unit given a catalog kit is tagged `kitted` and keeps that kit's gear
  # instead; its bread and cobblestone still come from here, but are given
  # rather than put in a slot, which could hold a piece of the kit.
  equip.mcfunction: |
    {{- range $unit := .Values.crew.units }}
    {{- $n := $unit.name | quote }}
    {{- if and (not $unit.hard) (ne $unit.role "warrior") }}
    execute as @a[name={{ $n }},hasitem={item=iron_sword,quantity=0},tag=!kitted] run replaceitem entity @s slot.hotbar 8 iron_sword 1
    execute as @a[name={{ $n }},hasitem={item=iron_helmet,location=slot.armor.head,quantity=0},tag=!kitted] run replaceitem entity @s slot.armor.head 0 iron_helmet 1
    execute as @a[name={{ $n }},hasitem={item=iron_chestplate,location=slot.armor.chest,quantity=0},tag=!kitted] run replaceitem entity @s slot.armor.chest 0 iron_chestplate 1
    execute as @a[name={{ $n }},hasitem={item=iron_leggings,location=slot.armor.legs,quantity=0},tag=!kitted] run replaceitem entity @s slot.armor.legs 0 iron_leggings 1
    execute as @a[name={{ $n }},hasitem={item=iron_boots,location=slot.armor.feet,quantity=0},tag=!kitted] run replaceitem entity @s slot.armor.feet 0 iron_boots 1
    {{- end }}
    {{- if eq $unit.role "warrior" }}
    {{- $kits := dict "vanguard" "vanguard" "striker" "duelist" "ranger" "ranger" }}
    {{- $kit := get $kits (default "" $unit.squadRole) }}
    {{- if not $kit }}
    {{- fail (printf "unit %s: squadRole %q must be vanguard, striker or ranger" $unit.id (toString $unit.squadRole)) }}
    {{- end }}
    {{- /* A warrior fights instead of working, so it gets a catalog kit and none
    of what the yard roles get: no plot tp, no work tools, no bread. Each
    hand-out starts a cooldown (kitwait, one step per 2 s tick) that covers
    the kit's pickup and the script that wears it about 2 s later, so a slow
    pickup never produces a second kit and a full inventory cannot loop. The
    kit is handed over whole only when there is no netherite chestplate worn
    or carried (a join, a death, a restart). A chestplate that is carried but
    not worn, as after a death inside that window, gets the wearing step
    again instead of another kit. The kits carry fewer golden apples than the
    plain kit did, so they are topped up outside the cooldown, by give because
    the kit's items own the hotbar. A top-up that did not land (a full
    inventory) starts the cooldown too, so it is retried every 16 s, not 2 s. */}}
    {{- $worn := "{item=netherite_chestplate,location=slot.armor.chest,quantity=0}" }}
    scoreboard players add @a[name={{ $n }}] kitwait 0
    scoreboard players remove @a[name={{ $n }},scores={kitwait=1..}] kitwait 1
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem=[{item=netherite_chestplate,quantity=0},{{ $worn }}]] at @s run function kits/{{ $kit }}/t5
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem=[{item=netherite_chestplate,quantity=0},{{ $worn }}]] run scoreboard players set @s kitwait 8
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem=[{item=netherite_chestplate,quantity=1..},{{ $worn }}]] run scriptevent kits:arrange Legendary {{ title $kit }}
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem=[{item=netherite_chestplate,quantity=1..},{{ $worn }}]] run scoreboard players set @s kitwait 4
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem={item=golden_apple,quantity=0}] run give @s golden_apple 16
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem={item=golden_apple,quantity=0}] run scoreboard players set @s kitwait 8
    {{- else if $unit.role }}
    {{- /* A unit with a role works in its own yard, far from the spawn it joins
    at (and respawns at), so anything still within the hub's reach is sent
    there. Its tool and bread are given too: an offline unit loses its
    inventory on every reconnect, and the kit chest is a long walk away. */}}
    {{- $p := include "crew.plot" (dict "id" $unit.id "yards" $.Values.crew.yards) | fromJson }}
    execute as @a[name={{ $n }},x=0,y=64,z=-400,r=200] run tp @s {{ add (int64 $p.x) 5 }} 64 {{ add (int64 $p.z) 6 }}
    {{- if not $unit.hard }}
    {{- if or (eq $unit.role "miner") (eq $unit.role "shaft") }}
    execute as @a[name={{ $n }},hasitem={item=iron_pickaxe,quantity=0},tag=!kitted] run replaceitem entity @s slot.hotbar 0 iron_pickaxe 1
    {{- if eq $unit.role "shaft" }}
    {{- /* Blocks to bridge a missing stair floor with. The deposit chest is no
    source: it sits in a chunk that is rarely loaded when the restock runs. */}}
    execute as @a[name={{ $n }},hasitem={item=cobblestone,quantity=0},tag=!kitted] run replaceitem entity @s slot.hotbar 6 cobblestone 32
    execute as @a[name={{ $n }},hasitem={item=cobblestone,quantity=0},tag=kitted] run give @s cobblestone 32
    {{- end }}
    {{- else if eq $unit.role "chopper" }}
    execute as @a[name={{ $n }},hasitem={item=iron_axe,quantity=0},tag=!kitted] run replaceitem entity @s slot.hotbar 0 iron_axe 1
    {{- end }}
    execute as @a[name={{ $n }},hasitem={item=bread,quantity=0},tag=!kitted] run replaceitem entity @s slot.hotbar 7 bread 16
    execute as @a[name={{ $n }},hasitem={item=bread,quantity=0},tag=kitted] run give @s bread 16
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.crew.kit.chest }}
    {{- /* The units take their food from the kit chest, which would otherwise
    run dry; the last slot is kept full of bread. */}}
    replaceitem block {{ splitList "," . | join " " }} slot.container 26 bread 64
    {{- end }}
  # Keeps every unit's work yard supplied, once a minute (tick.mcfunction), so
  # standing work never runs out: the yard is built the first time and put back
  # as units use it up. `keep` places only into air, so nothing standing is
  # replaced. A plot's offsets are the ones in the crew.workPlan helper
  # (_helpers.tpl); the commands fail quietly where no unit has loaded the
  # chunks. Chest slots 0-3 are cleared so a deposit always has room; a hauler's
  # chests keep a stack of cobblestone in slot 0 instead, which also replaces
  # what a restarted unit lost from its inventory mid-haul.
  # A quarry row is refilled only while its miner is not within a row of it:
  # a fill places stone into the air a unit stands in, which sealed miners into
  # their own tunnels ("no path to the chest").
  restock.mcfunction: |
    {{- range $unit := .Values.crew.units }}
    {{- /* A warrior has no yard to supply: it never walks a plot, so building
    and emptying chests there would be a structure nobody opens. */}}
    {{- if and $unit.role (ne $unit.role "warrior") }}
    {{- $p := include "crew.plot" (dict "id" $unit.id "yards" $.Values.crew.yards) | fromJson }}
    {{- $x := int64 $p.x }}
    {{- $z := int64 $p.z }}
    {{- $chests := list (list (add $x 3) (add $z 4)) (list (add $x 3) (add $z 8)) }}
    {{- range $c := $chests }}
    setblock {{ index $c 0 }} 64 {{ index $c 1 }} chest [] keep
    {{- range $s := until 4 }}
    {{- if and (eq $unit.role "hauler") (eq $s 0) }}
    replaceitem block {{ index $c 0 }} 64 {{ index $c 1 }} slot.container 0 cobblestone 64
    {{- else }}
    replaceitem block {{ index $c 0 }} 64 {{ index $c 1 }} slot.container {{ $s }} air
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if eq $unit.role "miner" }}
    {{- range $r := until 6 }}
    execute unless entity @a[name={{ $unit.name | quote }},x={{ add $x 10 }},y=64,z={{ add $z 2 $r }},dx=7,dy=2,dz=2] run fill {{ add $x 10 }} 64 {{ add $z 3 $r }} {{ add $x 17 }} 66 {{ add $z 3 $r }} stone keep
    {{- end }}
    {{- else if eq $unit.role "chopper" }}
    {{- range $dx := list 10 13 16 19 22 }}
    {{- range $dz := list 14 17 20 23 }}
    fill {{ add $x $dx }} 64 {{ add $z $dz }} {{ add $x $dx }} 65 {{ add $z $dz }} oak_log keep
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
binaryData:
  # Built by tools/crew-lab-dota-kit.py [path] [dota|lightking]; a structure is the only way Bedrock
  # loads named or trimmed items.
  dota_kit.mcstructure: {{ .Files.Get "files/dota_kit.mcstructure" | b64enc }}
  # The role and mob kit catalog (KITS.md), built by tools/crew-lab-kits.py:
  # over a hundred structures would not fit a ConfigMap unpacked.
  kits.tar.gz: {{ .Files.Get "files/kits.tar.gz" | b64enc }}
  lightking_kit.mcstructure: {{ .Files.Get "files/lightking_kit.mcstructure" | b64enc }}
  # Stage-0 custom mob add-on (gameops packs/lab-mods-stage0): a behaviour and
  # a resource pack, a few KB. Rebuild it from that directory with
  # `tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --format=gnu
  # -cf - behavior_pack resource_pack | gzip -9n`, so the bytes are stable.
  lab-mods-stage0.tar.gz: {{ .Files.Get "files/lab-mods-stage0.tar.gz" | b64enc }}
