{{- /*
A behaviour pack that keeps every crew unit's gear topped up. It lives in this
chart, and not in the shared server chart, so it cannot be switched on for the
main server. The server pod mounts it by this fixed name (values.yaml,
minecraft-bedrock.extraVolumes).
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: crew-lab-unit-kit
  namespace: {{ .Release.Namespace }}
data:
  manifest.json: |
    {
      "format_version": 2,
      "header": {
        "name": "Crew unit kit",
        "description": "Keeps the crew units equipped",
        "uuid": "e26bfbb9-d810-487c-ab14-fbbd10499c84",
        "version": [1, 0, 0],
        "min_engine_version": [1, 21, 0]
      },
      "modules": [
        {
          "type": "data",
          "uuid": "d83ae7f5-7887-400b-bc90-451510d633e6",
          "version": [1, 0, 0]
        },
        {
          "type": "script",
          "language": "javascript",
          "entry": "scripts/main.js",
          "uuid": "f362af6c-504e-46c4-b8d5-1171d31ef0a6",
          "version": [1, 0, 0]
        }
      ],
      "dependencies": [
        {
          "module_name": "@minecraft/server",
          "version": "2.0.0"
        }
      ]
    }
  # Two functions, so the objective's "already exists" failure never touches the
  # counter or the equipping.
  tick.json: |
    {
      "values": ["unit_kit/init", "unit_kit/tick"]
    }
  # Dotablaze's named, enchanted and trimmed kit, handed over from the console
  # with `execute as Dotablaze at @s run function kits/dota`. The items drop at
  # the player's feet, so they land straight in the inventory, and the script
  # below then wears the armour and arranges the hotbar.
  dota.mcfunction: |
    structure load dota_kit ~ ~ ~ 0_degrees none true false
    scriptevent kits:arrange Dota's
  # The Light King's kit, with his dog: the script spawns Cassie beside him,
  # tamed to him and armoured, unless one already exists.
  lightking.mcfunction: |
    structure load lightking_kit ~ ~ ~ 0_degrees none true false
    scriptevent kits:arrange Light King's
    scriptevent kits:dog Cassie
  # A squad warrior's enchanted kit, run by the equip tick for a warrior that
  # lost a piece. Clearing first stops the reload stacking onto what is left;
  # the script then wears the armour and sets the hotbar. The score holds the
  # equip check off for the next few runs (about 10 s) while the drop is
  # picked up.
  {{- range $role := list "vanguard" "striker" "ranger" }}
  warrior_{{ $role }}.mcfunction: |
    tag @s remove kitneed
    scoreboard players set @s kitwait 5
    clear @s
    structure load warrior_{{ $role }}_kit ~ ~ ~ 0_degrees none true false
    scriptevent kits:warrior
  {{- end }}
  # Commands cannot move a named or trimmed item without rebuilding it bare, so
  # a script wears the kit's armour, puts its weapons and pickaxes in the hotbar
  # and its shield in the off hand, swapping out what was there. The message is
  # the kit owner's name prefix, as in the item names. Bedrock has no command
  # that sets a wolf's owner, so the script tames the dog.
  # It also hands each listed player their kit once, on their first join after
  # this tag was set; change the tag to hand everyone theirs again.
  main.js: |
    import { world, system, EquipmentSlot } from "@minecraft/server";

    const KIT_ON_JOIN = { Dotablaze: "dota", LightKing0221: "lightking" };
    const KIT_ON_JOIN_TAG = "kit_on_join_1";

    world.afterEvents.playerSpawn.subscribe(({ player, initialSpawn }) => {
      const kit = KIT_ON_JOIN[player.name];
      if (!initialSpawn || !kit || player.hasTag(KIT_ON_JOIN_TAG)) return;
      // A kit loaded before the chunks around a joining player are ticking
      // drops nothing, so it waits 10 s.
      system.runTimeout(() => {
        if (!player.isValid || player.hasTag(KIT_ON_JOIN_TAG)) return;
        // Tagged first, so a kit that half-ran is not handed out twice; a
        // command that could not run at all leaves the player eligible.
        player.addTag(KIT_ON_JOIN_TAG);
        try {
          player.runCommand(`function kits/${kit}`);
        } catch (e) {
          player.removeTag(KIT_ON_JOIN_TAG);
          throw e;
        }
      }, 200);
    });

    const WORN = {
      helmet: EquipmentSlot.Head,
      chestplate: EquipmentSlot.Chest,
      leggings: EquipmentSlot.Legs,
      boots: EquipmentSlot.Feet,
    };
    const HOTBAR = ["Sword", "Axe", "Mace", "Spear", "Trident", "Bow", "Crossbow", "Fortune Pickaxe", "Silk Pickaxe"];

    system.afterEvents.scriptEventReceive.subscribe(({ id, message, sourceEntity }) => {
      if (sourceEntity?.typeId !== "minecraft:player") return;
      // The dropped kit is picked up over the following ticks.
      if (id === "kits:arrange") system.runTimeout(() => arrange(sourceEntity, message.trim()), 40);
      if (id === "kits:dog") adopt(sourceEntity, message.trim());
      if (id === "kits:warrior") system.runTimeout(() => equipWarrior(sourceEntity), 40);
    });

    const WARRIOR_WORN = {
      "minecraft:diamond_helmet": EquipmentSlot.Head,
      "minecraft:diamond_chestplate": EquipmentSlot.Chest,
      "minecraft:diamond_leggings": EquipmentSlot.Legs,
      "minecraft:diamond_boots": EquipmentSlot.Feet,
      "minecraft:shield": EquipmentSlot.Offhand,
      "minecraft:totem_of_undying": EquipmentSlot.Offhand,
    };
    // The yard kit's hotbar slots: 0 tool, 1 ammo, 7 food, 8 weapon.
    const WARRIOR_HOTBAR = { "minecraft:bow": 0, "minecraft:arrow": 1, "minecraft:golden_apple": 7, "minecraft:diamond_sword": 8 };

    function equipWarrior(player) {
      if (!player.isValid) return;
      const inv = player.getComponent("inventory").container;
      const worn = player.getComponent("equippable");
      for (let i = 0; i < inv.size; i++) {
        const item = inv.getItem(i);
        const slot = item && WARRIOR_WORN[item.typeId];
        if (!slot) continue;
        const held = worn.getEquipment(slot);
        // A piece already worn stays and the spare is dropped: the clear in
        // the kit function may not reach worn armour.
        if (held?.typeId !== item.typeId) worn.setEquipment(slot, item);
        inv.setItem(i, held?.typeId === item.typeId ? undefined : held);
      }
      for (const [typeId, slot] of Object.entries(WARRIOR_HOTBAR)) {
        for (let i = 0; i < inv.size; i++) {
          if (inv.getItem(i)?.typeId !== typeId) continue;
          if (i !== slot) inv.swapItems(slot, i, inv);
          break;
        }
      }
    }

    function adopt(player, name) {
      let dog = player.dimension.getEntities({ type: "minecraft:wolf", name })[0];
      if (!dog) {
        dog = player.dimension.spawnEntity("minecraft:wolf", player.location);
        dog.nameTag = name;
        // The snowy pelt is the white one; its spawn event must run before the taming.
        dog.triggerEvent("minecraft:spawn_wild_snowy");
      }
      // Only a wild wolf carries the component; a tamed one has swapped it away.
      const tame = dog.getComponent("tameable");
      if (tame && !tame.isTamed) tame.tame(player);
      dog.runCommand("replaceitem entity @s slot.armor.body 0 wolf_armor 1");
    }

    function arrange(player, owner) {
      if (!player.isValid) return;
      const inv = player.getComponent("inventory").container;
      // Names are "!! <owner> <title> !!" once the colour codes are gone.
      const find = (title) => {
        for (let i = 0; i < inv.size; i++) {
          const name = inv.getItem(i)?.nameTag?.replace(/§./g, "");
          if (name?.includes(`${owner} ${title} `)) return i;
        }
        return -1;
      };
      for (let i = 0; i < inv.size; i++) {
        const item = inv.getItem(i);
        const piece = item?.typeId.split("_").pop();
        if (!WORN[piece] || !item.nameTag?.replace(/§./g, "").includes(`${owner} `)) continue;
        const worn = player.getComponent("equippable");
        const held = worn.getEquipment(WORN[piece]);
        worn.setEquipment(WORN[piece], item);
        inv.setItem(i, held);
      }
      HOTBAR.forEach((title, slot) => {
        const i = find(title);
        if (i >= 0 && i !== slot) inv.swapItems(slot, i, inv);
      });
      const shield = find("Shield");
      if (shield >= 0) {
        const hands = player.getComponent("equippable");
        const held = hands.getEquipment(EquipmentSlot.Offhand);
        hands.setEquipment(EquipmentSlot.Offhand, inv.getItem(shield));
        inv.setItem(shield, held);
      }
    }
  init.mcfunction: |
    scoreboard objectives add unitkit dummy
    scoreboard objectives add kitwait dummy
  # 40 ticks is about 2 s: the gear check does not need to run every tick.
  tick.mcfunction: |
    scoreboard players add kit unitkit 1
    execute if score kit unitkit matches 40.. run function unit_kit/equip
    execute if score kit unitkit matches 40.. run scoreboard players set kit unitkit 0
    scoreboard players add restock unitkit 1
    execute if score restock unitkit matches 1200.. run function unit_kit/restock
    execute if score restock unitkit matches 1200.. run scoreboard players set restock unitkit 0
    scoreboard players add rules unitkit 0
    execute if score rules unitkit matches 0 run gamerule keepinventory true
    scoreboard players set rules unitkit 1
  # Each line runs only for a unit missing that piece, so nothing is replaced
  # while it is held; `execute as` keeps a no-match from counting as a failure.
  equip.mcfunction: |
    {{- range $unit := .Values.crew.units }}
    {{- $n := $unit.name | quote }}
    {{- if and (not $unit.hard) (ne $unit.role "warrior") }}
    execute as @a[name={{ $n }},hasitem={item=iron_sword,quantity=0}] run replaceitem entity @s slot.hotbar 8 iron_sword 1
    execute as @a[name={{ $n }},hasitem={item=iron_helmet,location=slot.armor.head,quantity=0}] run replaceitem entity @s slot.armor.head 0 iron_helmet 1
    execute as @a[name={{ $n }},hasitem={item=iron_chestplate,location=slot.armor.chest,quantity=0}] run replaceitem entity @s slot.armor.chest 0 iron_chestplate 1
    execute as @a[name={{ $n }},hasitem={item=iron_leggings,location=slot.armor.legs,quantity=0}] run replaceitem entity @s slot.armor.legs 0 iron_leggings 1
    execute as @a[name={{ $n }},hasitem={item=iron_boots,location=slot.armor.feet,quantity=0}] run replaceitem entity @s slot.armor.feet 0 iron_boots 1
    {{- end }}
    {{- if eq $unit.role "warrior" }}
    {{- /* A warrior fights instead of working, so the combat kit replaces
    everything the yard roles get here: no plot tp, no work tools, no bread.
    Each line tags the warrior when one piece is gone, with the same hasitem
    guards as the yard kit: an enchanted piece is still the same item, so it
    is never swapped for a plain one. A tagged warrior has its whole
    enchanted kit reloaded in one go (kits/warrior_<role>); a plain
    replaceitem cannot enchant. The kitwait score keeps the next check from
    firing while the dropped kit is still being picked up and worn. */}}
    {{- $role := required (printf "warrior %s has no squadRole" $unit.name) $unit.squadRole }}
    {{- if not (has $role (list "vanguard" "striker" "ranger")) }}{{ fail (printf "warrior %s has squadRole %q: want vanguard, striker or ranger" $unit.name $role) }}{{ end }}
    {{- $pieces := list "diamond_helmet,location=slot.armor.head" "diamond_chestplate,location=slot.armor.chest" "diamond_leggings,location=slot.armor.legs" "diamond_boots,location=slot.armor.feet" "diamond_sword" "golden_apple" }}
    {{- if eq $role "vanguard" }}
    {{- $pieces = append $pieces "shield,location=slot.weapon.offhand" }}
    {{- else }}
    {{- $pieces = append $pieces "totem_of_undying,location=slot.weapon.offhand" }}
    {{- end }}
    {{- if eq $role "ranger" }}
    {{- $pieces = concat $pieces (list "bow" "arrow") }}
    {{- end }}
    scoreboard players add @a[name={{ $n }}] kitwait 0
    scoreboard players remove @a[name={{ $n }},scores={kitwait=1..}] kitwait 1
    {{- range $pieces }}
    execute as @a[name={{ $n }},scores={kitwait=..0},hasitem={item={{ . }},quantity=0}] run tag @s add kitneed
    {{- end }}
    execute as @a[name={{ $n }},tag=kitneed] at @s run function kits/warrior_{{ $role }}
    {{- else if $unit.role }}
    {{- /* A unit with a role works in its own yard, far from the spawn it joins
    at (and respawns at), so anything still within the hub's reach is sent
    there. Its tool and bread are given too: an offline unit loses its
    inventory on every reconnect, and the kit chest is a long walk away. */}}
    {{- $p := include "crew.plot" (dict "id" $unit.id "yards" $.Values.crew.yards) | fromJson }}
    execute as @a[name={{ $n }},x=0,y=64,z=-400,r=200] run tp @s {{ add (int64 $p.x) 5 }} 64 {{ add (int64 $p.z) 6 }}
    {{- if not $unit.hard }}
    {{- if or (eq $unit.role "miner") (eq $unit.role "shaft") }}
    execute as @a[name={{ $n }},hasitem={item=iron_pickaxe,quantity=0}] run replaceitem entity @s slot.hotbar 0 iron_pickaxe 1
    {{- if eq $unit.role "shaft" }}
    {{- /* Blocks to bridge a missing stair floor with. The deposit chest is no
    source: it sits in a chunk that is rarely loaded when the restock runs. */}}
    execute as @a[name={{ $n }},hasitem={item=cobblestone,quantity=0}] run replaceitem entity @s slot.hotbar 6 cobblestone 32
    {{- end }}
    {{- else if eq $unit.role "chopper" }}
    execute as @a[name={{ $n }},hasitem={item=iron_axe,quantity=0}] run replaceitem entity @s slot.hotbar 0 iron_axe 1
    {{- end }}
    execute as @a[name={{ $n }},hasitem={item=bread,quantity=0}] run replaceitem entity @s slot.hotbar 7 bread 16
    {{- end }}
    {{- end }}
    {{- end }}
    {{- with .Values.crew.kit.chest }}
    {{- /* The units take their food from the kit chest, which would otherwise
    run dry; the last slot is kept full of bread. */}}
    replaceitem block {{ splitList "," . | join " " }} slot.container 26 bread 64
    {{- end }}
  # Keeps every unit's work yard supplied, once a minute (tick.mcfunction), so
  # standing work never runs out: the yard is built the first time and put back
  # as units use it up. `keep` places only into air, so nothing standing is
  # replaced. A plot's offsets are the ones in the crew.workPlan helper
  # (_helpers.tpl); the commands fail quietly where no unit has loaded the
  # chunks. Chest slots 0-3 are cleared so a deposit always has room; a hauler's
  # chests keep a stack of cobblestone in slot 0 instead, which also replaces
  # what a restarted unit lost from its inventory mid-haul.
  # A quarry row is refilled only while its miner is not within a row of it:
  # a fill places stone into the air a unit stands in, which sealed miners into
  # their own tunnels ("no path to the chest").
  restock.mcfunction: |
    {{- range $unit := .Values.crew.units }}
    {{- /* A warrior has no yard to supply: it never walks a plot, so building
    and emptying chests there would be a structure nobody opens. */}}
    {{- if and $unit.role (ne $unit.role "warrior") }}
    {{- $p := include "crew.plot" (dict "id" $unit.id "yards" $.Values.crew.yards) | fromJson }}
    {{- $x := int64 $p.x }}
    {{- $z := int64 $p.z }}
    {{- $chests := list (list (add $x 3) (add $z 4)) (list (add $x 3) (add $z 8)) }}
    {{- range $c := $chests }}
    setblock {{ index $c 0 }} 64 {{ index $c 1 }} chest [] keep
    {{- range $s := until 4 }}
    {{- if and (eq $unit.role "hauler") (eq $s 0) }}
    replaceitem block {{ index $c 0 }} 64 {{ index $c 1 }} slot.container 0 cobblestone 64
    {{- else }}
    replaceitem block {{ index $c 0 }} 64 {{ index $c 1 }} slot.container {{ $s }} air
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if eq $unit.role "miner" }}
    {{- range $r := until 6 }}
    execute unless entity @a[name={{ $unit.name | quote }},x={{ add $x 10 }},y=64,z={{ add $z 2 $r }},dx=7,dy=2,dz=2] run fill {{ add $x 10 }} 64 {{ add $z 3 $r }} {{ add $x 17 }} 66 {{ add $z 3 $r }} stone keep
    {{- end }}
    {{- else if eq $unit.role "chopper" }}
    {{- range $dx := list 10 13 16 19 22 }}
    {{- range $dz := list 14 17 20 23 }}
    fill {{ add $x $dx }} 64 {{ add $z $dz }} {{ add $x $dx }} 65 {{ add $z $dz }} oak_log keep
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- end }}
binaryData:
  # Built by tools/crew-lab-dota-kit.py [path] [dota|lightking]; a structure is the only way Bedrock
  # loads named or trimmed items.
  dota_kit.mcstructure: {{ .Files.Get "files/dota_kit.mcstructure" | b64enc }}
  lightking_kit.mcstructure: {{ .Files.Get "files/lightking_kit.mcstructure" | b64enc }}
  # The squad warriors' enchanted kits, built by tools/crew-lab-warrior-kit.py.
  {{- range $role := list "vanguard" "striker" "ranger" }}
  warrior_{{ $role }}_kit.mcstructure: {{ $.Files.Get (printf "files/warrior_%s_kit.mcstructure" $role) | b64enc }}
  {{- end }}
