{{- if .Values.crew.enabled }}
{{- range $unit := .Values.crew.units }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $unit.id }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "crew.labels" $unit.id | nindent 4 }}
spec:
  # hasKey, not `| default`: Sprig's `default` treats 0 as unset, which would
  # turn a deliberate scale-to-zero through git back into 1.
  replicas: {{ if hasKey $unit "replicas" }}{{ $unit.replicas }}{{ else }}{{ $.Values.crew.replicas }}{{ end }}
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, and two
  # pods joining under one name would kick each other off the server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $unit.id }}
  template:
    metadata:
      labels:
        {{- include "crew.labels" $unit.id | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        # The volume holds the camera's extracted texture pack, tens of
        # thousands of files on NFS. The default policy re-chowns every one on
        # each start, which took over ten minutes; checking the root is enough
        # because crew only ever writes files as this same group.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- if $unit.sharedVolume }}
      initContainers:
        # A ReadWriteMany volume gets no fsGroup ownership change from the
        # storage driver, so the claim's root stays root-owned and crew, which
        # runs as 1000, cannot make its directories there. Only the root
        # directory is changed, and only once.
        - name: share-owner
          image: {{ $.Values.crew.persistence.sharedInit.image }}
          command:
            - sh
            - -c
            - '[ "$(stat -c %u:%g /data)" = 1000:1000 ] || chown 1000:1000 /data'
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          resources:
            {{- toYaml $.Values.crew.persistence.sharedInit.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: crew
          image: "{{ $.Values.crew.image.repository }}:{{ $.Values.crew.image.tag }}"
          imagePullPolicy: {{ $.Values.crew.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "crew.serverHost" $ }}
            - name: MC_PORT
              value: {{ index $.Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: CREW_ID
              value: {{ $unit.id | quote }}
            - name: MC_USERNAME
              value: {{ $unit.name | quote }}
            - name: MC_OFFLINE
              value: {{ $.Values.crew.offline | quote }}
            - name: MC_VIEW_DISTANCE
              value: {{ $.Values.crew.viewDistance | quote }}
            - name: STATUS_ADDR
              value: "0.0.0.0:{{ $.Values.crew.statusPort }}"
            - name: CAMERA_ENABLED
              value: {{ $.Values.crew.camera.enabled | quote }}
            - name: CAMERA_MAX_VIEWERS
              value: {{ $.Values.crew.camera.maxViewers | quote }}
            # The atlas depends only on the server version, so units on the
            # shared claim use one directory and the first to need it builds
            # it for all; a per-unit directory would be a download each.
            - name: CAMERA_ATLAS_DIR
              value: {{ $.Values.crew.camera.atlasDir | quote }}
            {{- if $unit.sharedVolume }}
            # Sign-in tokens are per account, so each unit keeps its own.
            - name: AUTH_CACHE_DIR
              value: {{ printf "/data/%s/auth" $unit.id | quote }}
            {{- end }}
            {{- if $unit.role }}
            - name: WORK_PLAN
              value: {{ include "crew.workPlan" (dict "unit" $unit "yards" $.Values.crew.yards) | quote }}
            {{- end }}
            {{- with $.Values.crew.joinStaggerSeconds }}
            - name: JOIN_DELAY_S
              value: {{ mul (sub (atoi (trimPrefix "crew-" $unit.id)) 1) . | quote }}
            {{- end }}
            {{- with $.Values.crew.kit }}
            {{- if .chest }}
            - name: KIT_CHEST
              value: {{ .chest | quote }}
            - name: KIT_FOOD
              value: {{ .food | quote }}
            {{- end }}
            {{- end }}
            {{- if $.Values.crew.control.enabled }}
            # Both or neither: the unit refuses a control URL without a token
            # and exits, so the Secret is required rather than optional; a
            # missing one shows as a pod that cannot start, not a crash loop.
            - name: CONTROL_URL
              value: {{ printf "http://crew-control:%v" $.Values.crew.control.port | quote }}
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.crew.control.workTokenSecretName }}
                  key: token
            {{- end }}
            {{- with $.Values.crew.tasks }}
            {{- if .enabled }}
            # Optional so the unit still starts before the owner creates the
            # Secret; with no token crew registers no task routes at all.
            - name: TASKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: token
                  optional: true
            - name: TASK_TIMEOUT_S
              value: {{ .timeoutSeconds | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: status
              containerPort: {{ $.Values.crew.statusPort }}
              protocol: TCP
          # Liveness answers only "the process is serving"; readiness follows
          # the unit's state in the world and is false for long stretches
          # (dead, server restarting). Nothing may restart the pod on
          # readiness, and the liveness budget below outlasts a slow start.
          livenessProbe:
            httpGet:
              path: /healthz
              port: status
            periodSeconds: {{ $.Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: {{ $.Values.crew.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: status
            periodSeconds: {{ $.Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.crew.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ if $unit.sharedVolume }}crew-shared{{ else }}{{ $unit.id }}{{ end }}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
