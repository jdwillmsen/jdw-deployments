{{- if .Values.crew.enabled }}
{{- range $unit := .Values.crew.units }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $unit.id }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "crew.labels" $unit.id | nindent 4 }}
spec:
  # hasKey, not `| default`: Sprig's `default` treats 0 as unset, which would
  # turn a deliberate scale-to-zero through git back into 1.
  replicas: {{ if hasKey $unit "replicas" }}{{ $unit.replicas }}{{ else }}{{ $.Values.crew.replicas }}{{ end }}
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: the data volume is ReadWriteOnce, and two
  # pods joining under one name would kick each other off the server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $unit.id }}
  template:
    metadata:
      labels:
        {{- include "crew.labels" $unit.id | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        # The volume holds the camera's extracted texture pack, tens of
        # thousands of files on NFS. The default policy re-chowns every one on
        # each start, which took over ten minutes; checking the root is enough
        # because crew only ever writes files as this same group.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crew
          image: "{{ $.Values.crew.image.repository }}:{{ $.Values.crew.image.tag }}"
          imagePullPolicy: {{ $.Values.crew.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "crew.serverHost" $ }}
            - name: MC_PORT
              value: {{ index $.Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: CREW_ID
              value: {{ $unit.id | quote }}
            - name: MC_USERNAME
              value: {{ $unit.name | quote }}
            - name: MC_OFFLINE
              value: {{ $.Values.crew.offline | quote }}
            - name: MC_VIEW_DISTANCE
              value: {{ $.Values.crew.viewDistance | quote }}
            - name: STATUS_ADDR
              value: "0.0.0.0:{{ $.Values.crew.statusPort }}"
            - name: CAMERA_ENABLED
              value: {{ $.Values.crew.camera.enabled | quote }}
            - name: CAMERA_MAX_VIEWERS
              value: {{ $.Values.crew.camera.maxViewers | quote }}
            - name: CAMERA_ATLAS_DIR
              value: {{ $.Values.crew.camera.atlasDir | quote }}
            {{- with $.Values.crew.tasks }}
            {{- if .enabled }}
            # Optional so the unit still starts before the owner creates the
            # Secret; with no token crew registers no task routes at all.
            - name: TASKS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: token
                  optional: true
            - name: TASK_TIMEOUT_S
              value: {{ .timeoutSeconds | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: status
              containerPort: {{ $.Values.crew.statusPort }}
              protocol: TCP
          # Liveness answers only "the process is serving"; readiness follows
          # the unit's state in the world and is false for long stretches
          # (dead, server restarting). Nothing may restart the pod on
          # readiness, and the liveness budget below outlasts a slow start.
          livenessProbe:
            httpGet:
              path: /healthz
              port: status
            periodSeconds: {{ $.Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: {{ $.Values.crew.probes.livenessFailureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: status
            periodSeconds: {{ $.Values.crew.probes.periodSeconds }}
            timeoutSeconds: 3
          resources:
            {{- toYaml $.Values.crew.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $unit.id }}
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
