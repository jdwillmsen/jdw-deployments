minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    tag: "2026.10.2"
    pullPolicy: IfNotPresent

  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # Same sizing as proving-grounds. A running proving-grounds server uses about
  # 700Mi, so 512Mi would OOM here too. The shared namespace quota needs the
  # platform tenant-envelope raise of limits.memory to 26Gi to keep FWB's
  # census job (1Gi) and the 04:00 backup pods schedulable: merge that first.
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 750m

  # talos-lx0-6a4 (where proving-grounds and the lab run) is at its 110-pod
  # limit, and the small workers are at 99% memory requests, so the only node
  # with room is FWB's talos-4h8-zy6. This server is 1Gi and disposable;
  # NodePorts answer on every node, so the VM's NAT to 192.168.1.163 still
  # reaches the pod. Move it back to the lab node if pods are freed there.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-4h8-zy6

  minecraftServer:
    eula: "TRUE"
    # Same pin as FWB: LATEST runs ahead of the public client. No version-check
    # CronJob here, since with a pin it would restart the server every hour.
    version: "1.26.60.6"
    # Copied from FWB's level.dat. The seed only applies when the world is
    # first created; changing it later does nothing until the PVC is deleted.
    # The same seed gives the same terrain only on the same game version.
    levelSeed: "3021625704163385757"
    levelType: DEFAULT
    levelName: FWB-seed
    serverName: "FWB Seed Twin"
    difficulty: hard
    gameMode: survival
    cheats: false
    maxPlayers: 10
    # Minimal load: far below FWB's 12/64.
    tickDistance: 4
    viewDistance: 10
    playerIdleTimeout: 0
    maxThreads: 4

    # A NetherNet server turns unsigned players away anyway; online mode makes
    # XUIDs trustworthy for an allow list.
    onlineMode: true
    defaultPermission: member

    serviceType: NodePort
    serverPort: 31300
    nodePort: 31300

    enableLanVisibility: true

  extraEnv:
    ALLOW_LIST: "false"
    TRANSPORT: nethernet
    # address:external:internal. Public UDP 19200-19219 maps in order to the
    # NodePorts 31310-31329 through the HAProxy VM; the WAN address is not
    # static, so update it here if the ISP changes it.
    SERVER_UDP_PORTS: "104.53.12.62:19200-19219:31310-31329"

  # The subchart's probes run `mc-monitor status-bedrock` in `auto` mode, which
  # tries NetherNet first, so they pass on a NetherNet server and the pod is
  # Ready. Startup is off and liveness a year out because the NetherNet setup
  # shipped them off, not because they fail: the subchart hardcodes a 1s
  # timeout with 3 failures, so enabling them is a rollout to soak, not a
  # given. See charts/minecraft-fwb/README.md, "NetherNet transition".
  startupProbe:
    enabled: false
  livenessProbe:
    initialDelaySeconds: "31536000"

  # No backup, by the owner's decision: this server just runs.
  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 5Gi
      accessModes:
        - ReadWriteOnce

netherNet:
  enabled: true
  signalingPort: 31300
  signalingNodePort: 31301
  gameplayPorts:
    start: 31310
    end: 31329
