minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    tag: "2026.10.2"
    pullPolicy: IfNotPresent

  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # Smaller than proving-grounds on purpose. The shared namespace quota
  # (24Gi limits.memory, 12 cpu) had about 1.5Gi memory and 1.45 cpu free
  # before this server was counted. FWB's census job needs 1Gi of memory
  # headroom and the 04:00 backup, volume-recovery and watchdog pods need
  # about 900Mi and 1.4 cpu at once, so this server may take 512Mi and 500m and
  # no more; if it OOMs, raise the tenant quota first, then these.
  resources:
    requests:
      memory: 384Mi
      cpu: 150m
    limits:
      memory: 512Mi
      cpu: 500m

  # Not FWB's node (talos-4h8-zy6, which hung on 2026-11-05): a second world
  # must not share that failure, and the volume is RWO iSCSI so the pod stays
  # on one node. talos-lx0-6a4 is the node SERVER_UDP_PORTS' targets point at.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-lx0-6a4

  minecraftServer:
    eula: "TRUE"
    # Same pin as FWB: LATEST runs ahead of the public client. No version-check
    # CronJob here, since with a pin it would restart the server every hour.
    version: "1.26.60.6"
    # Copied from FWB's level.dat. The seed only applies when the world is
    # first created; changing it later does nothing until the PVC is deleted.
    # The same seed gives the same terrain only on the same game version.
    levelSeed: "3021625704163385757"
    levelType: DEFAULT
    levelName: FWB-seed
    serverName: "FWB Seed Twin"
    difficulty: hard
    gameMode: survival
    cheats: false
    maxPlayers: 10
    # Minimal load: far below FWB's 12/64.
    tickDistance: 4
    viewDistance: 10
    playerIdleTimeout: 0
    maxThreads: 4

    # A NetherNet server turns unsigned players away anyway; online mode makes
    # XUIDs trustworthy for an allow list.
    onlineMode: true
    defaultPermission: member

    serviceType: NodePort
    serverPort: 31300
    nodePort: 31300

    enableLanVisibility: true

  extraEnv:
    ALLOW_LIST: "false"
    TRANSPORT: nethernet
    # address:external:internal. Public UDP 19200-19219 maps in order to the
    # NodePorts 31310-31329 through the HAProxy VM; the WAN address is not
    # static, so update it here if the ISP changes it.
    SERVER_UDP_PORTS: "104.53.12.62:19200-19219:31310-31329"

  # The subchart's probes are RakNet pings a NetherNet server never answers:
  # startup off, liveness a year out, readiness fails and the NetherNet
  # Service publishes not-ready addresses.
  startupProbe:
    enabled: false
  livenessProbe:
    initialDelaySeconds: "31536000"

  # No backup, by the owner's decision: this server just runs.
  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 5Gi
      accessModes:
        - ReadWriteOnce

netherNet:
  enabled: true
  signalingPort: 31300
  signalingNodePort: 31301
  gameplayPorts:
    start: 31310
    end: 31329
