# Crosses into the minecraft-bedrock subchart, which sees nothing else from this
# file in its tpl-rendered sidecarContainers.
global:
  # On here so the sidecar soaks on a server where a regression costs nothing. The A/B
  # on this server (tools/world-guard/tps-ab.py, JDW-341) put the cost at -0.5% and -1.0%
  # of TPS under a write load far above the main server's, with the 95% bound on the loss
  # not excluding 3%, and showed more I/O pressure; it is not on the main server until a
  # longer soak says it is free.
  worldSync:
    enabled: true
    intervalSeconds: 2

minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    # Pinned, as in the other two Bedrock charts: the tag versions the
    # container tooling, the server binary is chosen by minecraftServer.version.
    tag: "2026.10.2"
    pullPolicy: IfNotPresent

  # A StatefulSet waits for the old pod to go before starting the new one, so
  # two writers never share the world volume.
  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # A test server with a handful of players, a flat world and no crew units.
  # The namespace quota is shared with the main server and the lab, and what
  # looks free in it is not. CPU: the backup (1000m), volume-recovery and
  # version-check (500m each) CronJobs need limits.cpu headroom to create their
  # pods at all (see crew-lab's values.yaml for the day that failed); 750m here
  # leaves 2200m of the 2950m that was free on 2026-10-30. Raise it only with a
  # quota change; training bots will need one.
  #
  # MEMORY, and a gate: the version check creates a Job and then a candidate
  # pod with limits of 1 CPU and 2Gi, so while it runs the namespace needs
  # about 2560Mi of limits.memory free, which is exactly what was free on
  # 2026-10-30 before this server existed. This server's 1Gi therefore makes
  # that check fail its pod creation. It is off today because the main server
  # and the lab are pinned. DO NOT re-enable versionCheck on either until the
  # tenant quota's limits.memory has been raised by at least this server's
  # limit, or this server is removed.
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 750m

  # One node, not "any", for the reason given in crew-lab's values.yaml: the
  # world is a ReadWriteOnce iSCSI volume and moving the pod drags it to a
  # node whose fsck can discard inodes. This world is disposable, but a silent
  # corruption would waste the debugging time. The same node as the lab is
  # chosen because SERVER_UDP_PORTS below advertises its address, and because
  # it was the roomiest worker (6% cpu, 27% memory in use on 2026-10-30).
  # Both servers on one node is accepted: the ports differ, and only gameplay
  # UDP (a few clients) is shared.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-lx0-6a4

  minecraftServer:
    eula: "TRUE"
    # Pinned because LATEST moved the server to 1.26.61.1 before the Windows
    # client had it (clients are still on 1.26.60), so no player could join.
    # Unpin once the public client catches up. The version-check CronJob that
    # restarts a server whose binary differs from LATEST is deliberately not in
    # this chart: with a pin it would restart the server every hour.
    version: "1.26.60.6"
    difficulty: normal
    gameMode: creative
    levelName: proving-grounds
    serverName: proving-grounds
    # A fresh, empty flat world: nothing to protect and fast to generate. It is
    # only read when the world is first created, so changing it later does
    # nothing until the PVC is deleted.
    levelType: FLAT
    cheats: true
    maxPlayers: 10
    tickDistance: 4
    viewDistance: 10
    playerIdleTimeout: 0
    maxThreads: 4

    # Online, unlike the lab: this server exists to try the signed-in join with
    # real accounts, and a NetherNet server turns an unsigned player away at
    # the transport anyway. Online mode also makes XUIDs trustworthy, so an
    # operator can be added by XUID through minecraftServer.ops if one is
    # needed; none is set.
    onlineMode: true
    defaultPermission: member

    serviceType: NodePort
    serverPort: 31200
    nodePort: 31200

    # The subchart's probes are an unconnected ping, which Bedrock answers only
    # with LAN visibility on. The `auto` mode tries NetherNet first, so they
    # pass on NetherNet too (see the probe note below).
    enableLanVisibility: true

  extraEnv:
    # Open to any signed-in account that can reach the port, which is LAN only:
    # there is no router or HAProxy forward for this server. The image's allow
    # list defaults on and would refuse the accounts being tried.
    ALLOW_LIST: "false"
    # The 1.26.60 Windows client dials NetherNet only: signaling over TCP on
    # the server port and no RakNet UDP at all.
    TRANSPORT: nethernet
    # Gameplay UDP is negotiated per client, so behind a NodePort the ports
    # are pinned and advertised as an address and external ports, or clients
    # are handed the pod's own 10.244.x IP. Format: address:external:internal.
    #
    # The address is the WAN one so players outside the LAN can join: the
    # router forwards UDP 19180-19199 to the HAProxy VM, which maps them to
    # NodePorts 31210-31229 (the range of netherNet.gameplayPorts); signaling
    # is TCP 19134 to 31201 on the same path. LAN and in-cluster clients
    # cannot reach the WAN address themselves, but ICE checks run both ways,
    # so the server reaches them. The WAN address is not static; update it
    # here if the ISP changes it.
    SERVER_UDP_PORTS: "104.53.12.62:19180-19199:31210-31229"
    # Lets the boot be checked for add-on errors (ContentLog files in /data/logs).
    CONTENT_LOG_FILE_ENABLED: "true"
    # Pack scripts log through console.warn, which the server drops unless the
    # content log is verbose and goes to stdout; without both, a pack's own
    # lines (gameops:event, gameops:wildlife script loaded) never reach
    # kubectl logs.
    CONTENT_LOG_LEVEL: "verbose"
    CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"

  # Installs the add-on packs in the lab-packs image (wildlife and the lab-tools
  # menus) with the same installer crew-lab runs. It reads each pack's uuid and version from its
  # manifest and merges them into the world's pack lists, so there is nothing
  # to keep in step here. A pack only reaches the world on a start after the
  # one that created it: the installer does nothing while the world folder is
  # missing, so the first start of a new volume needs one pod restart.
  #
  # The tag is a literal because the subchart renders initContainers with plain
  # toYaml. This server may run a newer tag than the lab, because it is where
  # a pack is tried first; it is bumped by hand (Renovate leaves the image alone); here a bump simply restarts this server, there is no unit-kit gate
  # because nobody depends on the world. Fail-closed like the lab: a missing
  # tag or a registry outage with no cached copy holds the pod in Init rather
  # than starting the world without its packs.
  #
  # Add-ons to be tried before they are in that image can be put on the volume
  # by hand under /data/worlds/proving-grounds/behavior_packs, and registered in
  # world_behavior_packs.json; the installer keeps entries it did not write.
  initContainers:
    # Checks the world's LevelDB before the server opens it, and holds the pod
    # in Init while a table the MANIFEST names is missing, empty or short. The
    # check is tools/world-guard/world_guard.py, embedded below by
    # tools/world-guard/embed.py (tools/tests/test-world-guard.sh fails the
    # build when the two differ). First on purpose: the server must not open
    # the db before it has been looked at, and the add-on installers below
    # write into the world.
    #
    # This server runs it in `enforce` so the hold is rehearsed here before
    # the main server ever runs it; GUARD_MODE: warn only reports. To let the
    # server open a world the guard holds anyway (it will repair the db and
    # drop what it cannot read):
    #   kubectl -n <ns> exec <pod> -c world-guard -- touch /data/.world-guard-accept
    # Restoring a good world is tools/world-restore; docs/world-guard.md
    # has both. It fails open on anything it cannot decide:
    # no world yet, a MANIFEST it cannot parse, a timeout.
    #
    # Same image as the CronJobs (already on every node); drop-all-capabilities,
    # read-only root, no Secret, one mount.
    - name: world-guard
      image: "alpine/k8s:1.37.1"
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -I
        - -c
      args:
        # BEGIN world-guard (generated by tools/world-guard/embed.py from world_guard.py; edit that, then --write)
        - |
          #!/usr/bin/env python3
          """World guard: refuse to let the Bedrock server open a LevelDB it can already tell is damaged.

          Two entry points, one file, standard library only (it also runs as `python3 -I -c "$(cat ...)"`
          inside an init container with a read-only root filesystem):

            world_guard.py check DB_DIR      print the report as JSON; exit 0 clean, 1 damaged, 2 inconclusive
            world_guard.py                   run the guard from the environment (init container)

          Why it exists: a host that loses power takes the guest page cache with it. The
          compaction output tables the MANIFEST already names can then be size-0 files, the
          inputs are already unlinked, and the server opens the db without complaint (tables
          are opened lazily) and only repairs, by dropping them, when something first reads one.
          Everything here is read-only against the db; it only ever writes two markers under
          DATA_DIR (the report and, on an accept, it removes the operator's accept file).

          Only a positive finding blocks. A parser surprise, an unreadable directory, a timeout or
          a missing world is reported and the guard exits 0: the guard's own bug must never be
          what keeps a world offline.

          Environment (guard mode):
            DATA_DIR            volume mount, default /data
            LEVEL_NAME          world directory under DATA_DIR/worlds, required
            GUARD_MODE          "enforce" holds the server; anything else only reports (default warn)
            RECHECK_SECONDS     seconds between checks while held, default 30
            CHECK_TIMEOUT       seconds before a check is abandoned as inconclusive, default 120
            WARN_LINGER_SECONDS seconds a warn-mode finding is repeated before the server starts, default 30
          """
          import json
          import os
          import signal
          import struct
          import sys
          import time

          TABLE_MAGIC = 0xDB4775248B80FB57
          BLOCK = 32768
          HEADER = 7
          TABLE_SUFFIXES = (".ldb", ".sst")
          MAX_LISTED = 5
          LINGER_STEP = 2
          MAX_MANIFEST_BYTES = 48 * 1024 * 1024


          class CheckTimeout(Exception):
              """Not an OSError: the per-table handlers catch OSError and must not swallow the alarm."""


          class ParseError(Exception):
              """The MANIFEST could not be decoded; the finding is inconclusive, not damage."""


          def _crc32c_table():
              table = []
              for i in range(256):
                  c = i
                  for _ in range(8):
                      c = (c >> 1) ^ 0x82F63B78 if c & 1 else c >> 1
                  table.append(c)
              return table


          _CRC = _crc32c_table()


          def crc32c(data, crc=0):
              crc ^= 0xFFFFFFFF
              for b in data:
                  crc = _CRC[(crc ^ b) & 0xFF] ^ (crc >> 8)
              return crc ^ 0xFFFFFFFF


          def masked_crc(typ, payload):
              c = crc32c(payload, crc32c(bytes([typ])))
              return (((c >> 15) | (c << 17)) + 0xA282EAD8) & 0xFFFFFFFF


          def read_varint(buf, i):
              result = shift = 0
              while True:
                  if i >= len(buf):
                      raise ParseError("varint runs off the end of a record")
                  c = buf[i]
                  i += 1
                  result |= (c & 0x7F) << shift
                  if not c & 0x80:
                      return result, i
                  shift += 7
                  if shift > 63:
                      raise ParseError("varint longer than 64 bits")


          def _scan(data, tail):
              """Walk the LevelDB log format, yielding (payload, crc_ok) per complete record.

              Streamed, so a large MANIFEST is decoded edit by edit instead of held as a list of
              payloads. `tail` is filled in as facts about how the file ends, which a power loss
              shapes: `truncated` (a record header or body runs off the end), `zero_bytes` (zero
              padding after the last record) and `pending_fragment`.
              """
              pos = 0
              frag = None
              frag_ok = True
              size = len(data)
              while pos < size:
                  left_in_block = BLOCK - (pos % BLOCK)
                  if left_in_block < HEADER:
                      pos += left_in_block
                      continue
                  if pos + HEADER > size:
                      tail["truncated"] = True
                      break
                  crc, length, typ = struct.unpack_from("<IHB", data, pos)
                  if typ == 0 and length == 0:
                      # LevelDB's reader skips a zero-type, zero-length header whatever its checksum
                      # (preallocated or zero-padded space) and goes on to the next block.
                      tail["zero_bytes"] += min(left_in_block, size - pos)
                      pos += left_in_block
                      continue
                  body_start = pos + HEADER
                  if body_start + length > size:
                      # A record that runs past the end of the file is the torn tail of a write that
                      # never finished; LevelDB treats it as end of file, and so must this, or the
                      # table check below would be skipped on exactly the db a power loss produced.
                      tail["truncated"] = True
                      break
                  if length > left_in_block - HEADER:
                      raise ParseError("record at %d crosses a block boundary" % pos)
                  payload = data[body_start:body_start + length]
                  ok = masked_crc(typ, payload) == crc
                  pos = body_start + length
                  if typ == 1:
                      yield payload, ok
                  elif typ == 2:
                      frag, frag_ok = bytearray(payload), ok
                  elif typ == 3:
                      if frag is None:
                          raise ParseError("middle fragment with no first fragment")
                      frag += payload
                      frag_ok = frag_ok and ok
                  elif typ == 4:
                      if frag is None:
                          raise ParseError("last fragment with no first fragment")
                      frag += payload
                      done, done_ok = bytes(frag), frag_ok and ok
                      frag, frag_ok = None, True
                      yield done, done_ok
                  else:
                      raise ParseError("unknown record type %d at %d" % (typ, pos))
              if frag is not None:
                  tail["pending_fragment"] = True


          def decode_edit(rec, live, state):
              """Apply one VersionEdit to the live-table map. Tags are LevelDB's version_edit.cc."""
              i = 0
              while i < len(rec):
                  tag, i = read_varint(rec, i)
                  if tag == 1:  # comparator name
                      n, i = read_varint(rec, i)
                      i += n
                  elif tag in (2, 9):  # log number, previous log number
                      _, i = read_varint(rec, i)
                  elif tag == 3:  # next file number
                      state["next_file"], i = read_varint(rec, i)
                  elif tag == 4:  # last sequence
                      _, i = read_varint(rec, i)
                  elif tag == 5:  # compact pointer: level, internal key
                      _, i = read_varint(rec, i)
                      n, i = read_varint(rec, i)
                      i += n
                  elif tag == 6:  # deleted file: level, number
                      _, i = read_varint(rec, i)
                      num, i = read_varint(rec, i)
                      live.pop(num, None)
                  elif tag == 7:  # new file: level, number, size, smallest, largest
                      lvl, i = read_varint(rec, i)
                      num, i = read_varint(rec, i)
                      size, i = read_varint(rec, i)
                      for _ in range(2):
                          n, i = read_varint(rec, i)
                          i += n
                      live[num] = (lvl, size)
                  else:
                      raise ParseError("unknown VersionEdit tag %d" % tag)
                  if i > len(rec):
                      raise ParseError("VersionEdit field runs off the end of its record")


          def read_manifest(path):
              """Return (live, state, tail, interior_bad). live maps table number to (level, size)."""
              with open(path, "rb") as f:
                  data = f.read()
              tail = {"truncated": False, "zero_bytes": 0, "pending_fragment": False}
              live = {}
              state = {"next_file": 0}
              crc_bad = []
              count = 0
              try:
                  for payload, ok in _scan(data, tail):
                      if ok:
                          decode_edit(payload, live, state)
                      else:
                          crc_bad.append(count)
                      count += 1
              except ParseError:
                  # A checksum failure already seen is a positive finding that a later parse problem
                  # must not hide; with none, the parse problem is the (inconclusive) answer.
                  if not crc_bad:
                      raise
                  tail["parse_stopped"] = True
              del data
              # LevelDB's recovery fails the open on a record whose checksum does not match,
              # wherever it sits, and the server answers that by repairing. So any bad record is
              # damage; the position is kept only so the report can say whether it was the last.
              tail["crc_bad_last"] = bool(crc_bad) and crc_bad[-1] == count - 1
              return live, state, tail, crc_bad


          def _table_name(num, db):
              for suffix in TABLE_SUFFIXES:
                  name = "%06d%s" % (num, suffix)
                  if os.path.lexists(os.path.join(db, name)):
                      return name
              return "%06d.ldb" % num


          def check_world(db):
              """Check one db directory. Returns a report dict with status clean, damaged, absent or inconclusive."""
              t0 = time.time()
              report = {"db": db, "status": "clean", "problems": [], "warnings": []}

              def done(status):
                  report["status"] = status
                  report["seconds"] = round(time.time() - t0, 3)
                  return report

              try:
                  names = os.listdir(db)
              except FileNotFoundError:
                  return done("absent")
              except OSError as e:
                  report["warnings"].append({"kind": "unreadable", "error": str(e)})
                  return done("inconclusive")

              def is_data(n):
                  if n.endswith(TABLE_SUFFIXES) or n.startswith("MANIFEST-"):
                      return True
                  return n.endswith(".log") and os.path.getsize(os.path.join(db, n)) > 0

              try:
                  has_data = any(is_data(n) for n in names)
              except OSError as e:
                  report["warnings"].append({"kind": "unreadable", "error": str(e)})
                  return done("inconclusive")
              if not has_data:
                  return done("absent")

              def problem(file, kind, **extra):
                  p = {"file": file, "kind": kind}
                  p.update(extra)
                  report["problems"].append(p)

              cur_path = os.path.join(db, "CURRENT")
              try:
                  with open(cur_path, "rb") as f:
                      cur = f.read()
              except FileNotFoundError:
                  problem("CURRENT", "current-missing")
                  return done("damaged")
              except OSError as e:
                  report["warnings"].append({"kind": "unreadable", "file": "CURRENT", "error": str(e)})
                  return done("inconclusive")
              if not cur.endswith(b"\n") or not cur.strip():
                  problem("CURRENT", "current-invalid", bytes=len(cur))
                  return done("damaged")
              manifest = cur.decode("utf-8", "replace").strip()
              report["manifest"] = manifest
              if "/" in manifest or not manifest.startswith("MANIFEST-"):
                  problem("CURRENT", "current-invalid", content=manifest[:40])
                  return done("damaged")
              mpath = os.path.join(db, manifest)
              try:
                  msize = os.path.getsize(mpath)
              except FileNotFoundError:
                  problem(manifest, "manifest-missing")
                  return done("damaged")
              if msize == 0:
                  problem(manifest, "manifest-empty")
                  return done("damaged")

              if msize > MAX_MANIFEST_BYTES:
                  # The whole file is read into memory, and the container has 256Mi: past this the
                  # kernel would kill it, which is not a fail-open exit. LevelDB only starts a new
                  # MANIFEST when the db is reopened, so a long-running server can get here.
                  report["warnings"].append({"kind": "manifest-too-large", "bytes": msize})
                  return done("inconclusive")
              try:
                  live, state, tail, interior_bad = read_manifest(mpath)
              except (ParseError, struct.error, OSError) as e:
                  report["warnings"].append({"kind": "manifest-unparsed", "error": str(e)})
                  return done("inconclusive")
              report["live_tables"] = len(live)
              if interior_bad:
                  problem(manifest, "manifest-checksum", records=interior_bad[:MAX_LISTED], last=tail["crc_bad_last"])
                  # What the rest of this MANIFEST says cannot be trusted, so stop here.
                  return done("damaged")
              if tail["truncated"] or tail["pending_fragment"]:
                  report["warnings"].append({"kind": "manifest-torn-tail"})
              if tail["zero_bytes"]:
                  report["warnings"].append({"kind": "manifest-zero-tail", "bytes": tail["zero_bytes"]})

              bad_bytes = 0
              unchecked = 0
              for num, (_lvl, want) in sorted(live.items()):
                  name = _table_name(num, db)
                  path = os.path.join(db, name)
                  try:
                      st = os.stat(path)
                  except FileNotFoundError:
                      problem(name, "missing", expected=want)
                      bad_bytes += want
                      continue
                  except OSError as e:
                      report["warnings"].append({"kind": "unreadable", "file": name, "error": str(e)})
                      unchecked += 1
                      continue
                  if st.st_size == 0:
                      problem(name, "zero-byte", expected=want, mtime=int(st.st_mtime))
                      bad_bytes += want
                  elif st.st_size != want:
                      problem(name, "size-mismatch", expected=want, actual=st.st_size, mtime=int(st.st_mtime))
                      bad_bytes += want
                  else:
                      try:
                          with open(path, "rb") as f:
                              f.seek(-8, 2)
                              magic = struct.unpack("<Q", f.read(8))[0]
                      except OSError as e:
                          report["warnings"].append({"kind": "unreadable", "file": name, "error": str(e)})
                          unchecked += 1
                          continue
                      if magic != TABLE_MAGIC:
                          problem(name, "bad-footer", expected=want, mtime=int(st.st_mtime))
                          bad_bytes += want

              orphans, orphan_zero = [], []
              for n in names:
                  if not n.endswith(TABLE_SUFFIXES):
                      continue
                  try:
                      num = int(n.split(".")[0])
                  except ValueError:
                      continue
                  if num in live:
                      continue
                  try:
                      sz = os.path.getsize(os.path.join(db, n))
                  except OSError:
                      continue
                  if sz == 0:
                      orphan_zero.append(n)
                  elif state["next_file"] and num >= state["next_file"]:
                      orphans.append(n)
              # An unreferenced table is something leveldb deletes when it opens the db, so
              # neither kind loses data on its own. They are the mark of a half-finished
              # compaction or a MANIFEST that lost its tail, which is why they are reported.
              if orphan_zero:
                  report["warnings"].append({"kind": "orphan-zero-byte", "count": len(orphan_zero), "files": sorted(orphan_zero)[:MAX_LISTED]})
              if orphans:
                  report["warnings"].append({"kind": "orphan-newer-than-manifest", "count": len(orphans), "files": sorted(orphans)[:MAX_LISTED]})
              if os.path.isdir(os.path.join(db, "lost")):
                  report["warnings"].append({"kind": "repair-evidence", "dir": "lost"})

              if report["problems"]:
                  report["bad_tables"] = len(report["problems"])
                  report["bad_bytes"] = bad_bytes
                  mt = [p["mtime"] for p in report["problems"] if "mtime" in p]
                  if mt:
                      report["bad_mtime_first"], report["bad_mtime_last"] = min(mt), max(mt)
                  return done("damaged")
              if unchecked:
                  # Not "clean": a table that could not be read has not been shown to be whole, and a
                  # hold must not be released on that. With no hold yet, inconclusive starts the server.
                  report["unchecked_tables"] = unchecked
                  return done("inconclusive")
              return done("clean")


          def _summary(report):
              """The report cut down to what one log line should carry."""
              out = {k: report[k] for k in ("status", "db", "manifest", "live_tables", "bad_tables", "bad_bytes", "seconds",
                                            "bad_mtime_first", "bad_mtime_last") if k in report}
              if report["problems"]:
                  out["problems"] = report["problems"][:MAX_LISTED]
                  kinds = {}
                  for p in report["problems"]:
                      kinds[p["kind"]] = kinds.get(p["kind"], 0) + 1
                  out["kinds"] = kinds
              if report["warnings"]:
                  out["warnings"] = report["warnings"][:MAX_LISTED]
              return out


          def emit(event, **fields):
              fields["event"] = event
              fields["ts"] = int(time.time())
              print("world-guard: " + json.dumps(fields, sort_keys=True), flush=True)


          def _timeout(_signum, _frame):
              raise CheckTimeout("check exceeded its time limit")


          def safe_check(db, limit):
              """check_world, but any failure of the guard itself is inconclusive rather than fatal."""
              if hasattr(signal, "SIGALRM"):
                  signal.signal(signal.SIGALRM, _timeout)
                  signal.alarm(limit)
              try:
                  return check_world(db)
              except Exception as e:  # noqa: BLE001 - the guard must not take the world down with it
                  return {"db": db, "status": "inconclusive", "problems": [],
                          "warnings": [{"kind": "guard-error", "error": "%s: %s" % (type(e).__name__, e)}]}
              finally:
                  if hasattr(signal, "SIGALRM"):
                      signal.alarm(0)


          def write_report(state_dir, report):
              try:
                  os.makedirs(state_dir, exist_ok=True)
                  tmp = os.path.join(state_dir, "report.json.new")
                  with open(tmp, "w") as f:
                      json.dump(report, f, indent=1, sort_keys=True)
                  os.replace(tmp, os.path.join(state_dir, "report.json"))
                  return True
              except OSError as e:
                  emit("report_write_failed", error=str(e))
                  return False


          def _accepted(path):
              """Only a regular file counts: a directory by that name would never be consumed."""
              return os.path.isfile(path)


          def _int(env, key, default):
              try:
                  return max(1, int(env.get(key, default)))
              except (TypeError, ValueError):
                  return default


          def guard(env, sleep=time.sleep, now=time.time):
              """The init-container loop. Returns the process exit code (always 0: see module doc)."""
              data = env.get("DATA_DIR", "/data")
              level = env.get("LEVEL_NAME", "")
              mode = "enforce" if env.get("GUARD_MODE") == "enforce" else "warn"
              recheck = _int(env, "RECHECK_SECONDS", 30)
              limit = _int(env, "CHECK_TIMEOUT", 120)
              # capped: warn mode must never hold the server, whatever the setting says
              linger = min(_int(env, "WARN_LINGER_SECONDS", 30), 120)
              if not level:
                  emit("inconclusive", mode=mode, reason="LEVEL_NAME is not set")
                  return 0
              db = os.path.join(data, "worlds", level, "db")
              state_dir = os.path.join(data, ".world-guard")
              accept = os.path.join(data, ".world-guard-accept")
              held_since = None
              while True:
                  report = safe_check(db, limit)
                  status = report["status"]
                  if status != "damaged" and held_since is not None and status != "clean":
                      # A positive finding is already on record, so an undecided recheck (a timeout, a
                      # transient read error) or a world that has gone missing mid-repair must not
                      # release the hold: only a clean check, or an operator's accept, ends it.
                      if _accepted(accept):
                          _remove(accept)
                          emit("accepted", mode=mode, reason="recheck was %s" % status, **_summary(report))
                          return 0
                      emit("held", mode=mode, held_seconds=int(now() - held_since), recheck_seconds=recheck,
                           reason="recheck was %s" % status, **_summary(report))
                      for _ in range(max(recheck, 1)):
                          if _accepted(accept):
                              break
                          sleep(1)
                      continue
                  if status != "damaged":
                      if os.path.lexists(accept):
                          # An accept is for the damage it was given for; leaving it would
                          # wave through the next, different one.
                          _remove(accept)
                          emit("accept_discarded", mode=mode, reason="world is not damaged")
                      event = {"clean": "clean", "absent": "absent"}.get(status, "inconclusive")
                      if held_since is not None:
                          emit("released", mode=mode, held_seconds=int(now() - held_since), **_summary(report))
                      else:
                          emit(event, mode=mode, **_summary(report))
                      return 0
                  report["mode"] = mode
                  report["checked_at"] = int(now())
                  write_report(state_dir, report)
                  if _accepted(accept):
                      _remove(accept)
                      emit("accepted", mode=mode, **_summary(report))
                      return 0
                  if mode != "enforce":
                      emit("would_hold", mode=mode, **_summary(report))
                      # The pod log is shipped by a tailer that starts at the END of a file it has just
                      # discovered (a scan every ~10 s), so a line printed in the first instant of a
                      # container that then exits is never shipped, and the page built on it would
                      # never fire. Say it again for a while; this only happens when damage is found.
                      for _ in range(linger // LINGER_STEP):
                          sleep(LINGER_STEP)
                          emit("would_hold", mode=mode, repeat=True, **_summary(report))
                      return 0
                  if held_since is None:
                      held_since = now()
                  emit("held", mode=mode, held_seconds=int(now() - held_since), recheck_seconds=recheck, **_summary(report))
                  for _ in range(max(recheck, 1)):
                      if _accepted(accept):
                          break
                      sleep(1)


          def _remove(path):
              try:
                  os.remove(path)
              except OSError as e:
                  emit("accept_remove_failed", error=str(e))


          def main(argv):
              if len(argv) >= 2 and argv[1] == "check":
                  if len(argv) != 3:
                      print("usage: world_guard.py check DB_DIR", file=sys.stderr)
                      return 64
                  report = check_world(argv[2])
                  print(json.dumps(report, indent=1, sort_keys=True))
                  return {"clean": 0, "absent": 0, "damaged": 1}.get(report["status"], 2)
              try:
                  return guard(os.environ)
              except BaseException as e:  # noqa: BLE001 - the guard failing must never be what holds the world
                  emit("inconclusive", reason="guard crashed: %s: %s" % (type(e).__name__, e))
                  return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
        # END world-guard
      env:
        - name: DATA_DIR
          value: /data
        # Must equal minecraftServer.levelName.
        - name: LEVEL_NAME
          value: proving-grounds
        - name: GUARD_MODE
          value: enforce
        - name: RECHECK_SECONDS
          value: "30"
      # 256Mi because the whole MANIFEST is read into memory (the guard declines one over
      # 48 MiB as inconclusive); an OOM kill is not a fail-open exit.
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 256Mi
          cpu: 200m
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: datadir
          mountPath: /data

    - name: install-lab-packs
      image: "ghcr.io/jdwillmsen/lab-packs:1.7.0"
      imagePullPolicy: IfNotPresent
      args:
        - /data/worlds/proving-grounds
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 64Mi
          cpu: 50m
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: datadir
          mountPath: /data

    # The stage-0 mobs (brute, werewolf, ground dragon) from the chart's own
    # ConfigMap. Replaced wholesale on every start, so the pack always matches
    # the tarball; uuids and versions come from its manifests. After
    # install-lab-packs: both only add or replace their own entries in the pack
    # lists. The server image is used for its tar and jq only.
    - name: install-lab-mods-stage0
      image: "itzg/minecraft-bedrock-server:2026.10.2"
      command:
        - sh
        - -ec
        - |
          world=/data/worlds/proving-grounds
          [ -d "$world" ] || { echo "world $world does not exist yet, nothing installed"; exit 0; }
          mods=/data/.lab-mods-stage0
          rm -rf "$mods" && mkdir -p "$mods"
          tar -xzf /stage0/lab-mods-stage0.tar.gz -C "$mods"
          mkdir -p "$world/behavior_packs" "$world/resource_packs"
          rm -rf "$world/behavior_packs/gameops-lab-mods-stage0" "$world/resource_packs/gameops-lab-mods-stage0"
          mv "$mods/behavior_pack" "$world/behavior_packs/gameops-lab-mods-stage0"
          mv "$mods/resource_pack" "$world/resource_packs/gameops-lab-mods-stage0"
          for kind in behavior resource; do
            list="$world/world_${kind}_packs.json"
            manifest="$world/${kind}_packs/gameops-lab-mods-stage0/manifest.json"
            [ -s "$list" ] || echo '[]' > "$list"
            jq --slurpfile m "$manifest" '($m[0].header) as $h | map(select(.pack_id != $h.uuid)) + [{pack_id: $h.uuid, version: $h.version}]' "$list" > "$list.new"
            mv "$list.new" "$list"
          done
          rm -rf "$mods"
          echo "installed gameops-lab-mods-stage0"
      resources:
        requests:
          memory: 16Mi
          cpu: 10m
        limits:
          memory: 64Mi
          cpu: 50m
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: datadir
          mountPath: /data
        - name: stage0
          mountPath: /stage0
          readOnly: true

  # Flushes the world volume's dirty pages every few seconds so a host that
  # dies has less dirty data to lose, a couple of seconds' worth instead of the kernel's 30 s (best effort: a sync can take longer than the interval, and it does not make a half-written compaction safe). Without it
  # ext4 holds a new file's data in the page cache until writeback while the
  # journal commits the file's existence within 5 s, which is how a power-off
  # left 30 size-0 tables that the MANIFEST already named (2026-11-06). It is
  # `sync -f` (syncfs) on the server's own volume, from the server's image, in
  # this pod only: no node setting changes. Off unless global.worldSync.enabled;
  # the interval is global.worldSync.intervalSeconds.
  #
  # sidecarContainers is tpl-rendered inside the subchart's scope, which sees
  # only `.Values.global`, which is why the switch lives there.
  sidecarContainers: |
    {{- if .Values.global.worldSync.enabled }}
    - name: world-sync
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command:
        - sh
        - -c
        # trap + wait: as PID 1, sh would otherwise ignore SIGTERM and every pod deletion
        # would wait out the whole grace period.
        - "trap 'exit 0' TERM; while :; do sync -f /data || echo 'world-sync: sync -f failed'; sleep {{ .Values.global.worldSync.intervalSeconds }} & wait $!; done"
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        # Read-only is enough: syncfs flushes the filesystem behind the
        # descriptor, not the mount that opened it.
        - name: datadir
          mountPath: /data
          readOnly: true
    {{- end }}

  extraVolumes:
    - volumes:
        - name: stage0
          configMap:
            name: jdwillmsen-proving-grounds-prd-lab-mods-stage0

  # The subchart's probes run `mc-monitor status-bedrock` in `auto` mode, which
  # tries NetherNet first, so they pass on a NetherNet server and the pod is
  # Ready. The startup probe is on so a server that never comes up is
  # restarted rather than left NotReady; the numbers equal the subchart
  # defaults and pin them (about 10.5 minutes before the kubelet gives up).
  # Liveness stays a year out because the subchart hardcodes a 1s timeout with
  # 3 failures, so enabling it is a rollout to soak, not a given. See
  # charts/minecraft-fwb/README.md, "NetherNet transition".
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60
  livenessProbe:
    initialDelaySeconds: "31536000"

  # No backup: the world is rebuilt from scratch if it is lost.
  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 5Gi
      accessModes:
        - ReadWriteOnce

# The way in for retail clients: signaling on TCP and gameplay on UDP.
# Players dial the node address and signalingNodePort (the LAN address
# 192.168.1.163:31201). The signaling nodePort differs from the server port
# because the apiserver rejects the 31200 the subchart's UDP Service holds.
# Cluster-wide taken ports at the time of writing were TCP 30180 30203 30543
# 31134 31137 and UDP 31132 31136 31140-31179; check `kubectl get svc -A`
# before moving these.
netherNet:
  enabled: true
  signalingPort: 31200
  signalingNodePort: 31201
  gameplayPorts:
    start: 31210
    end: 31229

# The scratch claim tools/world-restore stages a world on: a restore is copied
# here, verified by booting a copy on the server's own image, and only then
# swapped onto the live volume. Same shape as the main server's restore claim,
# named the same way so the tool finds it by release name.
restoreScratch:
  enabled: true
  storageClass: truenas-iscsi
  size: 5Gi

# Restarts a NetherNet server whose signaling port is not listening. See
# templates/listener-watchdog.yaml for the failure it exists for.
listenerWatchdog:
  enabled: true
  # Offset from the other servers' watchdogs and the :00 CronJobs, whose pods
  # share a tight namespace quota.
  schedule: "2-59/5 * * * *"
  # Longer than any restart in this chart, so it never acts on one in progress.
  minAgeSeconds: 360
  image: alpine/k8s:1.37.1
