# Wires the console bridge to the running server. NOT applied by default:
# the ArgoCD Application lists values.yaml and values-prd.yaml only, and this
# file is added to that list as a separate, revertible change.
#
# It is separate rather than a flag in values.yaml because of what the last
# line in this file does. `minecraft-bedrock.extraEnv` is rendered by plain
# toYaml inside the vendored subchart, never through tpl, so a secret
# reference placed in it cannot be made conditional — it binds the game
# server container's startup to that secret unconditionally, for every render.
# On 2026-09-06 the secret did not exist and the server stayed down for 40
# hours (docs/incidents/2026-09-06-fwb-console-bridge-secret.md). Keeping the
# binding in a file that is not applied by default is the only way to make it
# something you opt into, one commit at a time, with the server already up.
#
# Do not apply this file until the ExternalSecret it depends on is observed
# healthy. The procedure, and why that order is not optional, is in the README
# under "Enabling the console bridge".

# The single switch for the whole feature: the sidecar in the server pod, this
# chart's own console-bridge Service, and the agent Deployment's second gate
# all read it. Under `global:` because the sidecar list is tpl-rendered in the
# vendored subchart's own scope, which nothing but `.Values.global.*` reaches
# -- and this chart's own templates can read `global` too, so one flag serves
# both sides.
global:
  consoleBridge:
    enabled: true
  # Here rather than in values.yaml because presence needs the agent, and the
  # agent renders only with the bridge -- see values.yaml's global.presence.
  # Turned on only once the presence ExternalSecret reads SecretSynced and the
  # V8 presence tables exist.
  presence:
    enabled: true

minecraft-bedrock:
  # mc-server-runner (inside this image) reads these directly — no
  # bedrock-entry.sh involvement, so none of the read-only-rootfs/HOME failure
  # modes the remote-console (SSH) path would hit. Loopback-only address: the
  # console is reachable from inside this pod alone, through the console-bridge
  # sidecar, never from the pod network.
  #
  # The origin check is disabled rather than pointed at an allowed origin, and
  # no value of WEBSOCKET_ALLOWED_ORIGINS can replace that. This was the other
  # way round on first deploy and the bridge could not connect at all:
  # mc-server-runner answered every dial with 403 and logged `origin not
  # allowed`, because the bridge sends no Origin header at all.
  #
  # The obvious repair -- allow-list the empty origin -- is not available.
  # mc-server-runner admits a request only when the literal Origin header value
  # appears in the allow-list, and its flag parser splits that setting on commas
  # and then drops every blank field, so the empty string can never be an entry.
  # A client sending no Origin is therefore refused under every possible
  # allow-list, including an empty one. Measured against the runner's own code
  # at the version in this image: with the check on, a dial carrying no Origin
  # got 403 whether the allow-list named a real origin, was empty, or had a
  # leading comma; only a dial that did send a matching Origin got 101.
  #
  # So the check, once on, admits exactly the clients that send an Origin --
  # browsers -- and refuses the only client that exists here. Turning it on
  # cannot be done from this chart. It needs the bridge to send a fixed Origin
  # first, shipped as a new sidecar image; then this file names that same value
  # here and drops the line below.
  #
  # The comment this replaces argued a fixed origin "keeps the check
  # meaningful instead of turned off". It reads well and was never true: it
  # kept the check meaningful by making it reject the only client there is.
  #
  # Disabling it costs no exposure, and that rests entirely on the line above:
  # WEBSOCKET_ADDRESS binds the console to 127.0.0.1, so the only things that
  # can reach it are the containers sharing this pod's network namespace; there
  # is no browser and no other origin. Moving that bind off loopback is what
  # would turn this line into a real hole, which is why a test pins it.
  #
  # extraEnv is a map, so these keys merge into values.yaml's rather than
  # replacing anything. The secret name is a literal because nothing here is
  # templated: if global.consoleBridge.secret.name ever changes, this line must
  # be changed by hand.
  extraEnv:
    WEBSOCKET_CONSOLE: "true"
    WEBSOCKET_ADDRESS: "127.0.0.1:8765"
    # Origin checking on. mc-server-runner compares the request's Origin to
    # this list by exact string equality, and a client sending no Origin can
    # never match any entry -- which is why this could not be enabled until
    # the bridge sent one (0.2.0). The literal must match CONSOLE_ORIGIN on
    # the sidecar exactly.
    WEBSOCKET_ALLOWED_ORIGINS: "mc-console-bridge://sidecar"
    WEBSOCKET_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: minecraft-fwb-console-bridge
          key: console_websocket_password
