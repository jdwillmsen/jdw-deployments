# Helm merges `global:` into every subchart's own .Values automatically —
# this is the one value that genuinely needs to cross the boundary from this
# umbrella chart into the vendored minecraft-bedrock subchart's own template
# scope (minecraft-bedrock.sidecarContainers below, which is tpl-rendered in
# that subchart's context and cannot otherwise see this file's other
# top-level keys). Everything else lives in its own section as normal.
global:
  consoleBridge:
    # The one switch for the whole feature -- sidecar, Service and agent gate
    # all read it -- off by default and flipped only by
    # values-console-bridge.yaml.
    #
    # The ExternalSecret is the deliberate exception: it renders whether this
    # is on or off, so the secret can be made to exist and be *seen* to sync
    # before anything is wired to depend on it. See README, "Enabling the
    # console bridge".
    enabled: false

    secret:
      # Two properties under this one name — console_websocket_password and
      # console_bridge_token. See console-secret-externalsecret.yaml.
      #
      # These live in the Vault kv document `minecraft-fwb`. That document was
      # once described here as one "the bot LLM secret already uses", which was
      # wrong in the way that matters: bot-llm-externalsecret.yaml is gated off
      # and has never rendered, so nothing had ever proved the document exists.
      # It did not, and the server stayed down for 40 hours
      # (docs/incidents/2026-09-06-fwb-console-bridge-secret.md). Treat the
      # document as unproven until an ExternalSecret is observed Synced.
      name: minecraft-fwb-console-bridge

      # Renders the ExternalSecret on its own, without wiring anything to the
      # secret it produces. A failing ExternalSecret in this state is inert —
      # that is the whole point of being able to turn it on first.
      create: true

minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    # Pinned rather than latest. The VM this migrates from ran the image's
    # default rolling tag, which upgrades the server binary underneath a live
    # world; for a GitOps workload whose state is the whole point, that is a
    # silent-change hazard rather than a convenience.
    tag: "2026.9.0"
    pullPolicy: IfNotPresent

  # RollingUpdate never runs two writers: a StatefulSet terminates its pod and
  # waits for it to go before creating the replacement, unlike a Deployment
  # which would start the new one alongside.
  #
  # That is true of *writers* and was previously written here as though it made
  # RollingUpdate safe for the volume. It does not. Pod deletion is not volume
  # detach, and the replacement is scheduled freely, so a rolling update is
  # exactly how the world PVC migrates between nodes -- which on this CSI driver
  # loses data (docs/incidents/2026-08-30-fwb-world-data-loss.md). What makes
  # the strategy safe is the single-node affinity below, not the strategy
  # itself.
  #
  # OnDelete was the earlier choice and made every version bump a two-step
  # manual chore — merge, then remember to delete the pod. Rolling means a
  # version change in this file applies on the next sync by itself.
  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # Published guidance puts a light world with a handful of players at 1-2 GiB.
  # The VM's 4 GiB covered an entire guest OS as well, so it is not the right
  # reference. The namespace's quota tier (tenant.yaml) caps requests/limits
  # in total, and the backup CronJob has to be able to schedule alongside this.
  #
  # cpu bumped 1/2 -> 3/7 after raising tick-distance/view-distance for the mob
  # farm pushed the old 2-core limit into throttling (cgroup stats: ~34% of
  # periods throttled) — the quota tier moved standard -> large alongside this
  # to make room. That 7-core limit was never revisited against real usage,
  # and it silently starved the backup CronJob: steady-state limits.cpu usage
  # sat at 7350-7850m against the 8000m quota cap, so the backup's own 1000m
  # request always exceeded it. Confirmed live 2026-08-25 — every scheduled
  # backup for 3 straight days failed with FailedCreate/exceeded-quota, and
  # that day's job retried for 41 minutes straight before this fix landed.
  #
  # cpu dropped 3/7 -> 1500m/4000m against measured reality: `kubectl top`
  # showed 550m actual usage, and the highest this container has ever been
  # observed pegged at is the old 2000m limit (the throttling incident above,
  # before tick/view-distance were raised further). 4000m is 2x that observed
  # peak — real headroom, not a guess — and frees enough quota for the backup
  # (1000m) and volume-recovery (500m) CronJobs to schedule even if both land
  # at once alongside both AFK bots and the mc-monitor sidecar.
  # Memory no longer stays under 4Gi, and the shortfall is paid in chunk-load
  # stutter rather than in OOM kills. Measured in the container's own cgroup
  # 2026-09-11: memory.current 3.75Gi against a 4Gi max (87%), of which anon is
  # 2.88Gi -- the server's chunk cache, which scales with view-distance --
  # leaving 0.83Gi of page cache. The world is 509MB and would fit in cache
  # whole, so what is left is not enough to hold it and the kernel evicts
  # continuously. Every eviction sends the next read of that chunk back to an
  # iSCSI volume over the network, which is the stall players feel flying into
  # new terrain. 8Gi is sized to hold the world in cache alongside the heap
  # with room for the heap to grow, not to stop an OOM that was not happening.
  #
  # The request follows actual usage rather than the old guess: 2Gi was below
  # what the container has been consuming all along, so the scheduler has been
  # placing this pod against a figure that was never true.
  #
  # cpu is deliberately NOT raised with it. The limit looks like the obvious
  # companion change and is the one that bites: this namespace's quota caps
  # limits.cpu at 8000m, 4700m of which is already committed, and backup
  # (1000m) + volume-recovery (500m) + version-check (500m) can land together.
  # Taking this container to 6 would leave 1300m against a 2000m worst case and
  # re-run the August incident where three days of backups failed FailedCreate.
  # It is also the wrong lever: cgroup cpu.stat shows 8361 throttled periods out
  # of 839700 (1.0%), so CPU is real but secondary to the cache eviction above.
  # The request moves 1500m -> 2000m only, which spends requests.cpu quota
  # rather than limits.cpu, and matches the 1.6-1.75 cores actually observed.
  resources:
    requests:
      memory: 4Gi
      cpu: 2000m
    limits:
      memory: 8Gi
      cpu: "4"

  # Bedrock ticks on a single core and uses others for chunk loading, so nodes
  # are chosen for headroom rather than core count; most of the fleet is too
  # memory-tight to take a 2 GiB request at all.
  #
  # One node, not two. Permitting two let the scheduler move this pod on any
  # pod recreation, and moving it drags a ReadWriteOnce iSCSI volume with it.
  # democratic-csi's unstage reports success while the ext4 journal is still
  # dirty, so the receiving node's fsck recovers the journal and *corrects*
  # errors -- discarding inodes. That cost 11 .ldb files and ~29 MB of world on
  # 2026-08-30, and 5 more files on 08-25.
  #
  # Single-node affinity is normally an anti-pattern because it forfeits
  # failover. It does not here: this is one process owning one world with no
  # clustering, so there is no failover to forfeit. What the second node
  # actually bought was an automatic volume migration onto a driver that
  # corrupts during migration -- downtime traded for silent data loss, which is
  # the wrong way round.
  #
  # talos-4h8-zy6 because that is where the volume already is, so adopting this
  # costs no migration. It is also the node the scheduler prefers on its own:
  # measured 2026-08-31, LeastAllocated scores it 65.4 against talos-lx0-6a4's
  # 47.6, since lx0-6a4 sits at ~20% free CPU.
  #
  # Revisit when the world moves off democratic-csi to the official TrueNAS CSI
  # driver -- the migration hazard is that driver's, not Kubernetes'.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-4h8-zy6

  minecraftServer:
    eula: "TRUE"
    # LATEST rather than a reviewed pin: Bedrock clients only connect within a
    # narrow protocol window of their own build, so a version that goes stale
    # between reviews breaks connectivity outright -- worse than the one-way
    # world-upgrade risk a pin was guarding against. The image checks Mojang
    # for the current version and upgrades on every container start (README:
    # "the Bedrock server software is not bundled into this image... VERSION
    # default is LATEST"), independently of the image.tag above, which only
    # versions the container tooling (mc-monitor etc.), not the server binary.
    #
    # The nightly backup and the volume-recovery CronJob are what make this
    # safe to leave unreviewed: a bad Mojang release corrupting the world on
    # restart is restorable from the last backup rather than un-upgradable.
    version: "LATEST"
    difficulty: hard
    gameMode: survival
    levelName: FWB
    serverName: "FWB Server"
    allowCheats: false
    # 12 is the server's own hard ceiling (property range is 4-12) — needed for
    # the AFK bot's mob farm to tick reliably, not just render further.
    tickDistance: 12
    # 64 chunks: a common "safe max" most Bedrock platforms can actually
    # exercise (weaker mobile/console clients cap well below the ~96 ceiling
    # some high-end Windows clients can ask for), so it avoids reserving
    # chunk-cache memory for requests that will never come from those
    # devices. Costs client bandwidth/server chunk-cache memory, not
    # simulation — that's tickDistance's job.
    viewDistance: 64
    maxPlayers: 20
    playerIdleTimeout: 0

    # LAN-only. HAProxy terminates every frontend in TCP mode and cannot proxy
    # UDP, baseline Pod Security forbids hostPort, and no LoadBalancer provider
    # is deployed — so a NodePort is the only route in.
    #
    # serverPort matches nodePort deliberately: the chart's own guidance is
    # that they must be equal for clients to display a ping time.
    serviceType: NodePort
    serverPort: 31132
    nodePort: 31132

    # Bedrock answers unconnected pings only when LAN visibility is on, and the
    # chart defaults it off. That silences the very packet mc-monitor sends, so
    # the chart's own liveness and readiness probes can never pass — the server
    # runs correctly and reports itself unhealthy forever. It also belongs on
    # for its stated purpose here: this server is LAN-only, so appearing in the
    # client's LAN list is wanted rather than a leak.
    enableLanVisibility: true

    # Opts into Mojang's own usage telemetry for this server. No operational
    # benefit to us either way; on by deliberate choice, not a default.
    emitServerTelemetry: true

  # Every probe the vendored subchart renders is the same thing: an
  # `mc-monitor status-bedrock` RakNet ping at 127.0.0.1:serverPort. Only the
  # timings are values; the exec itself is hardcoded in that chart's
  # deployment.yaml and 2.9.0 is its newest published release, so there is no
  # NetherNet-aware version to move to.
  #
  # Under transport=nethernet the server opens no RakNet listener, so all
  # three fail forever. Left alone, the startupProbe burns its 60 attempts and
  # kills the container, and liveness then restarts it every ~60s -- an outage
  # of our own making on top of the one this transition is fixing.
  #
  # So: startup off, liveness pushed a year out so it never fires. Readiness
  # is deliberately left where it is. It fails, this pod reads NotReady, and
  # that is the honest signal -- nothing here is health-checking the server
  # any more. The NetherNet Service carries publishNotReadyAddresses so
  # players still route to a pod nobody is checking.
  #
  # This is a bridge with a specific exit: probes that do not assume a
  # transport, which needs the workload template vendored out of the subchart.
  # Until that lands, this workload is not observable and must not be read as
  # healthy. See README, "NetherNet transition".
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60


  # mc-monitor already ships in this image and already runs the probes above
  # in its one-shot `status-bedrock` mode. `export-for-prometheus` is the same
  # binary in long-running Prometheus-exporter mode — reusing the image means
  # no second image to pin or pull for player-count/reachability metrics.
  #
  # There is no `serve-bedrock` subcommand — that was a guess that shipped
  # without checking `mc-monitor help`, and it crash-looped the sidecar
  # (confirmed live: `mc-monitor` prints its usage banner and exits non-zero
  # on an unrecognized subcommand). `export-for-prometheus` is the real name.
  #
  # console-bridge is the second sidecar: the only thing with write access to
  # the server console (see mc-console-bridge's own README for the allowlist
  # it enforces). It dials the WEBSOCKET_CONSOLE endpoint below over
  # loopback, so it never needs a port of its own opened to the pod network —
  # only its own HTTP API port, which the agent-facing Service targets.
  sidecarContainers: |
    - name: mc-monitor
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command:
        - mc-monitor
        - export-for-prometheus
        - -bedrock-servers
        - 127.0.0.1:{{ .Values.minecraftServer.serverPort }}
        - -port
        - "8080"
      ports:
        - name: metrics
          containerPort: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    {{- if .Values.global.consoleBridge.enabled }}
    - name: console-bridge
      # sidecarContainers is tpl-rendered inside the minecraft-bedrock
      # subchart's own template scope, which cannot see this umbrella
      # chart's other top-level values — only `.Values.global.*` crosses
      # that boundary, which is exactly why the secret name lives under
      # `global:` at the top of this file rather than under `consoleBridge:`.
      # The image ref has no such value to reach for at all (this sidecar
      # has no separate image/tag value — see consoleBridge's own comment
      # below) and is a literal for that reason.
      image: "ghcr.io/jdwillmsen/mc-console-bridge:0.2.0"
      env:
        # CONSOLE_ADDR, not CONSOLE_ADDRESS: the bridge reads the former, and
        # the misspelling was inert -- it only ever worked because the value
        # here happens to equal the bridge's own default.
        - name: CONSOLE_ADDR
          value: "127.0.0.1:8765"
        # Sent as the Origin on the console handshake, and allow-listed by
        # WEBSOCKET_ALLOWED_ORIGINS on the server. The scheme is deliberately
        # not http(s): a browser only mints an origin for a scheme it can load
        # a page from, so this one cannot be forged by a website, which is what
        # leaves the server's origin check meaningful rather than merely
        # satisfied. Both halves must carry the same literal.
        - name: CONSOLE_ORIGIN
          value: "mc-console-bridge://sidecar"
        - name: CONSOLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.consoleBridge.secret.name }}
              key: console_websocket_password
        - name: BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.consoleBridge.secret.name }}
              key: console_bridge_token
        - name: DATA_DIR
          value: /data
        - name: HTTP_ADDR
          value: ":8766"
      ports:
        - name: bridge-http
          containerPort: 8766
      # Liveness only, and deliberately not readiness, though the bridge serves
      # /readyz and it is the more informative endpoint.
      #
      # This is a sidecar in the server's own pod, and five Services select
      # that pod -- minecraft-bedrock and nethernet on the game port,
      # join-probe-target, mc-monitor, console-bridge. Readiness is a property
      # of the whole pod, so a bridge that lost its console would take the game
      # server out of every one of them and disconnect everybody, to report a
      # fault in a sidecar nobody was playing through. The console path being
      # down is worth an alert, not an eviction.
      #
      # /healthz answers for the process rather than the console -- it stays
      # green while the console is down, because restarting cannot fix a server
      # that has not opened its console yet. That makes it exactly right for
      # liveness: it fires when the HTTP server itself has wedged, which a
      # restart does fix, and stays quiet for the outage shapes it would only
      # make worse.
      livenessProbe:
        httpGet:
          path: /healthz
          port: bridge-http
        # Generous: the bridge reconnects to the console with backoff, and a
        # restart during that is churn rather than repair.
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 4
      volumeMounts:
        # Read-only: the bridge only ever reads permissions.json/allowlist.json
        # from the world volume, never writes to it. It is the same PVC the
        # main container already mounts at /data — Kubernetes allows the same
        # volume mounted multiple times within one pod.
        - name: datadir
          mountPath: /data
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
    {{- end }}

  # The server's own websocket-console settings, including the secret its
  # password comes from, deliberately do NOT live here. They are in
  # values-console-bridge.yaml, which is not applied by default.
  #
  # extraEnv is rendered via plain toYaml in the subchart's deployment.yaml
  # (confirmed by reading it), never passed through tpl — so unlike
  # sidecarContainers above, nothing in it can be conditional, and a secret
  # reference placed in it binds the *game server* container's startup to that
  # secret existing. When the secret did not exist, the server would not start
  # at all: the bridge's dependency became the server's, and a sidecar feature
  # that was never load-bearing took the world offline for 40 hours
  # (docs/incidents/2026-09-06-fwb-console-bridge-secret.md). A separate values
  # file is the only way to keep that binding out of the default render, since
  # the value itself cannot carry a condition.
  #
  # This extraEnv, unlike that one, is safe to keep here: plain string values,
  # no secretKeyRef, so there is nothing in it that can fail to resolve and
  # take the server down. content-log-console-output-enabled surfaces
  # resource/behavior-pack errors (moot today — "Pack Stack - None" in the
  # live log — but harmless to leave on ahead of ever adding one).
  #
  # Not emit-server-telemetry here: the subchart already has a dedicated
  # minecraftServer.emitServerTelemetry field (see below) wired to this same
  # env var. Setting it again here would render EMIT_SERVER_TELEMETRY twice
  # in the container spec — technically valid Kubernetes (last one wins by
  # order) but confusing and fragile. Confirmed by rendering both
  # values-console-bridge.yaml and this file together and inspecting the
  # actual output, not assumed.
  extraEnv:
    CONTENT_LOG_CONSOLE_OUTPUT_ENABLED: "true"

  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 5Gi
      accessModes:
        - ReadWriteOnce

backup:
  enabled: true
  # Nightly. The world is small and the hold window is seconds, so frequency is
  # cheap; the constraint is retention space, not runtime.
  schedule: "0 4 * * *"
  # bitnami/kubectl was retired from Docker Hub and no longer pulls at all.
  # alpine/k8s carries kubectl plus the bash and coreutils this job needs.
  #
  # Tracks the cluster's minor version. kubectl supports one minor of skew
  # either side of the API server, and this job drives the server's save
  # protocol through exec and reads the manifest back off the pod log — if a
  # skewed client ever misbehaves it does so on the one path that protects the
  # world, and it does so silently.
  image: alpine/k8s:1.37.0
  # Archives live on the file tier, not the block class the world uses.
  storageClass: truenas-nfs
  size: 20Gi
  keep: 14
  # Floor for a plausible archive. The world is ~590 MB raw and compresses to
  # roughly 700 MB with the rest of the level, so anything under 100 MB means
  # the copy went wrong — which is the failure the VM's backup hid by writing
  # nothing at all and reporting success.
  minBytes: "104857600"

  # Publishes the platform's job-output freshness contract by reading the
  # archive directory, so "the job produced nothing" is a metric rather than
  # something a human has to go and look for.
  exporter:
    enabled: true
    # busybox for its httpd applet: the exporter serves one static file that a
    # shell loop rewrites, so nothing heavier earns its place here.
    image: busybox:1.38
    port: 9101
    interval: 60s
    refreshSeconds: 60
    # Two nights. The CronJob rules already page within about an hour of a run
    # that failed, so this is the slower backstop that catches the cases those
    # rules cannot see — a job that completes successfully having written
    # nothing, or one that is never scheduled at all. Set below 24h it would
    # simply restate the schedule and double-page every failure.
    maxAgeSeconds: 172800

versionCheck:
  # Bedrock clients only connect within a narrow protocol window of their own
  # build. minecraftServer.version above tracks LATEST, but that only gets
  # re-resolved when the container restarts -- nothing else forces a restart
  # on any particular cadence, so staleness was otherwise bounded only by
  # whatever next happens to restart the pod (an image.tag Renovate merge, a
  # crash), which could be weeks.
  #
  # Hourly, this boots a throwaway copy of the server to see what LATEST
  # currently resolves to, compares that against what production already
  # reports (via the mc-monitor sidecar's existing metrics), and only
  # restarts the real StatefulSet -- and only disconnects players/AFK bots --
  # when the two actually differ. Bounds staleness to at most the schedule
  # below, without paying an unconditional restart every run.
  enabled: true
  schedule: "0 * * * *"
  image: alpine/k8s:1.37.0
  # Generous against the CI smoke test's confirmed ~6s cold-pull-to-ready for
  # this same image, plus two 60s poll loops (candidate Running, then
  # mc-monitor reporting) the script itself allows, plus the 600s notice
  # below when a restart is actually due.
  #
  # Sized for the branch that announces and waits, which is why it is far
  # larger than the work itself.
  #
  # An earlier version of this comment claimed both poll loops were bounded at
  # 60s and that the deadline was therefore only a backstop. That was wrong:
  # the mc-monitor loop is 30 iterations of `timeout 15s` plus `sleep 2`, so
  # its worst case is ~510s, and the candidate-Running loop adds ~65s. Against
  # the 600s notice that is ~1175s of worst case under a 900s deadline -- a run
  # that stopped the server successfully could still be marked Failed. The loop
  # is bounded by wall clock below rather than by iteration count, which is
  # what makes this number hold.
  #
  # Budget counted per loop *ceiling*, not per deadline. A wall-clock deadline
  # is where a loop stops starting work, not where it stops: the last iteration
  # can begin a second before it and then costs a whole kubectl timeout plus a
  # whole sleep on top. Summing the deadlines is the same arithmetic that put
  # "both poll loops are bounded at 60s" in this file while the mc-monitor loop
  # could run 510s -- see the register in docs/incidents/README.md, which
  # records that one against this very value.
  #
  # Per candidate attempt, and there are two:
  #   gone wait    45 + 10 (get) + 2 (sleep) =  57
  #   create                       timeout   =  15
  #   ready wait   60 + 10 (get) + 2 (sleep) =  72
  #   version poll 60 + 15 (exec) + 10 (get) + 2 (sleep) = 87
  #   log read                     timeout   =  10
  #                                            ---
  #                                            241  -> 482 for both
  #
  # Then 695s of notice (590s of sleeps plus the six bounded exec calls that
  # carry it), 173s delivering the stop and confirming the restart (10 reading
  # state, 30 for the stop exec, 120 + 10 + 3 for the restart poll), and 20s
  # for the metrics read and the bot dispatch. 1370s of ceiling against 1500.
  #
  # 130s of margin, and it is smaller than it looks safe to leave only because
  # every term above is an independent worst case: reaching 1370 needs both
  # candidates to fail, a restart to be due, and every kubectl call in the run
  # to time out rather than answer. A real run that restarts production spends
  # about 620s of it on the notice ladder's sleeps.
  #
  # 1200 -> 1500 with the second attempt. The old number counted the notice as
  # its sleeps alone and ignored the exec timeouts around them, so it had less
  # margin than it claimed; a run that had already stopped the server could
  # still have been marked Failed. 1500s stays well inside the hourly schedule,
  # so a run that eats its whole budget still cannot collide with the next one
  # under concurrencyPolicy: Forbid.
  timeoutSeconds: 1500

  # How long a finished Job object outlives its run.
  #
  # KubeJobFailed alerts on the object, not on the run, so a failed Job pages
  # for as long as something removes it -- and failedJobsHistoryLimit is not
  # that something. It counts failed Jobs only, so the case this exists for, a
  # single bad hour among successful ones, never reaches the limit and is kept
  # indefinitely. The limit does evict, in about five hours, when every run is
  # failing: it clears the alert exactly when the alert is true and keeps it
  # exactly when it is stale. A TTL is the mechanism that acts on age.
  #
  # Six hours is chosen to still be there in the morning for an overnight
  # failure, which is the case where the pod log is the only account of what
  # happened. It bounds a one-off, and bounds nothing else: a fault that is
  # still present simply fails the next hourly run and alerts again, so this
  # shortens the noise from a fixed problem without quieting a live one.
  ttlSecondsAfterFinished: 21600

  notice:
    # Players get warned before they are disconnected. Only reached when the
    # versions actually differ, so the hourly no-op runs stay silent.
    #
    # Best-effort by design: a chat failure must never block the restart. A
    # server left on a stale protocol is one clients cannot join at all, which
    # is worse for players than an unannounced restart.
    # Marks at 10m, 5m, 2m30s, 1m, 30s, then a per-second countdown for the
    # last ten, totalling 600s. That ladder lives in the script rather than
    # here on purpose: the messages and the sleeps between them have to stay
    # in step, and a lead-time knob could not keep them so -- it would read as
    # authoritative while changing nothing. Adjusting the notice means editing
    # the sequence, and timeoutSeconds above with it.
    enabled: true

  bot:
    # The AFK bot's image bakes in protocol data for exactly one Bedrock
    # version (see bot.image's comment below), and the server no longer moves
    # on a reviewed, human-visible schedule -- it can now restart hourly via
    # this same CronJob. A GitHub-hosted runner has no route to this LAN-only
    # server to check for itself (NodePort only, no LoadBalancer -- see
    # minecraft-bedrock.minecraftServer.serviceType's comment), so this
    # cluster is the only place that can learn production's current version
    # and hand it off. It does exactly that and nothing more: every run,
    # regardless of whether production needed a restart, this dispatches the
    # bot repo's own workflow with that version as input. The bot repo -- not
    # this job -- decides whether that actually implies a protocol bump: it
    # has minecraft-data's protocol table and this alpine/k8s image does not,
    # and reusing that table instead of duplicating it here is the same
    # reasoning that puts LATEST-resolution behind the real image above
    # rather than a hand-maintained guess at Mojang's release feed.
    #
    # Best-effort: a failure here is logged, never fails the job. Production
    # staying current must not depend on this repo's GitHub API being
    # reachable, and there is nothing here worth retrying inside the same
    # run -- next hour's dispatch carries the same information again.
    enabled: true
    repository: jdwillmsen/minecraft-afk-bot
    workflowFile: protocol-check.yml
    # A fine-grained PAT scoped to the bot repo with Actions:write, created by
    # hand (`kubectl create secret generic mc-bot-dispatch-token
    # --from-literal=token=<PAT> -n <namespace>`) -- not something this chart
    # can generate for you.
    tokenSecretName: mc-bot-dispatch-token
    tokenSecretKey: token

# Warns players before a sync that might restart the server, as an ArgoCD
# PreSync hook so the warning is part of the deployment rather than something
# an operator has to remember and time by hand.
#
# Every restart on 2026-09-07/08 reached players either unannounced or with a
# warning that turned out to be wrong. Both failures were the same one: this
# Application auto-syncs, so a merge becomes a restart on Argo's schedule, not
# on anyone's. A hook is the only place a warning can sit and still be ahead of
# the change every time -- Argo runs PreSync to completion before it applies
# anything.
deployAnnounce:
  enabled: true

  # Held before every sync while anyone is connected. Two minutes is long
  # enough to reach somewhere safe and short enough that routine deployments
  # are not painful; it is the delay a player experiences, so it is the one
  # number here worth arguing about.
  leadSeconds: 120

  # Same image as the other in-cluster actors: it needs kubectl and python3,
  # both of which this one already carries.
  image: alpine/k8s:1.37.0

volumeRecovery:
  # The server's volume has twice remounted read-only underneath a running pod
  # after a transient error on the iSCSI path. Kubernetes cannot recover from
  # that on its own: the kubelet restarts the container, the entrypoint runs
  # again against the same mount, and it fails again -- so the pod sits in
  # CrashLoopBackOff indefinitely. Deleting the pod is what unpublishes and
  # republishes the volume, and nothing does that automatically.
  #
  # A liveness probe cannot substitute. Probes restart containers, which is
  # precisely the action that does not work here.
  #
  # The same actor also clears a second deadlock that only a pod delete can
  # break: a pod that never became Ready is never replaced by its StatefulSet,
  # so once the StatefulSet moves to a new revision the old pod holds the
  # server down until someone deletes it by hand. That branch is gated on the
  # revision mismatch alone -- see the comment on it -- and needs neither the
  # signature nor the restart threshold below.
  enabled: true

  # Five minutes bounds the outage without polling hard. The last occurrence
  # ran thirteen minutes and was noticed only by chance.
  schedule: "*/5 * * * *"
  image: alpine/k8s:1.37.0

  # Deletion is gated on this exact line rather than on "not ready", so a pod
  # failing for a reason deletion cannot fix is left in its crash loop where it
  # stays visible instead of being recreated forever.
  signature: "Read-only file system"

  # A slow first start is not a fault: the server downloads its binary and the
  # chart allows ten minutes for it. Requiring repeated restarts as well as the
  # signature keeps this from firing on a pod that is merely still starting.
  minRestarts: 2

  # Ceiling for a single run, which normally finishes in about three seconds.
  # Exists so a run that hangs fails visibly instead of suspending recovery:
  # concurrencyPolicy is Forbid, so one stuck job means no further attempts.
  #
  # 120 -> 240 after a live DeadlineExceeded (JDWLABS-411): the server pod was
  # healthy and the job never reached its delete logic, but two nodes
  # (kubelet not posting status, conditions Unknown) show the job's kubectl
  # calls can stall on transient cluster/API flakiness rather than the ~3s
  # happy path. 240s doubles the prior margin without approaching the
  # five-minute schedule below -- a run that ate the full budget still leaves
  # room before the next trigger, so one slow-but-real run cannot also cost
  # the following scheduled attempt under concurrencyPolicy: Forbid.
  timeoutSeconds: 240

restore:
  # On by default so the mechanism -- CronJob, RBAC, scratch PVC -- exists
  # alongside the workload rather than being something a human has to
  # remember to add when disaster strikes. It never runs on its own: the
  # CronJob's own manifest hardcodes suspend: true independent of this flag,
  # so nothing set here can make it fire on a schedule. Disabling it removes
  # the mechanism entirely, including the idle scratch PVC's NAS footprint.
  enabled: true

  # No default. A restore names which archive it wants back, and a
  # chart-supplied default would let `kubectl create job --from=cronjob`
  # silently restore whatever this file last said on some unrelated run. The
  # job refuses to start while this is empty.
  archiveName: ""

  # Same image family as the other two jobs in this chart, and the same
  # kubectl-skew reasoning the backup CronJob documents -- this job also
  # drives the server StatefulSet through the API.
  image: alpine/k8s:1.37.0

  # Refuses to overwrite an existing level directory on the scratch PVC
  # unless a human sets this for a second attempt. A restore that silently
  # clobbers a scratch copy someone was still comparing against is the same
  # failure shape as a backup that silently overwrites a good archive.
  overwriteScratch: false

  # Generous against extracting a ~700 MB archive plus up to five minutes
  # spent waiting for the server pod to terminate; a run that hangs past
  # this is wedged, not slow.
  timeoutSeconds: 1800

  scratchPVC:
    # Block, matching the world's own class. A restore that lands on a
    # different storage family cannot be promoted onto the world PVC by a
    # plain copy later -- that conversion has never been exercised, and nothing
    # here should be read as a claim that it would work.
    storageClass: truenas-iscsi
    size: 5Gi

bot:
  # Off until the account behind it exists. Enabling this before the one-time
  # device-code login has been completed gets a pod that cannot authenticate
  # and says so on a loop; the image tag below also has to have been published
  # first, or the pod simply fails to pull.
  #
  # Turning it on is the deliberate second half of a two-step bootstrap, not
  # something to flip alongside an unrelated change.
  enabled: true

  # Set to 0 (not `enabled: false`) to take the bot offline for a manual
  # account takeover without deleting its PVC/token cache — see README's
  # "Relocating a bot". Explicit rather than templated-default: Sprig's
  # `default` coerces 0 back to 1.
  replicas: 1

  image:
    repository: ghcr.io/jdwillmsen/minecraft-afk-bot
    # This image bakes in the protocol data for exactly one Bedrock version,
    # so it needs a deliberate re-bump whenever that data goes stale.
    #
    # minecraftServer.version above tracks LATEST and can move on any pod
    # restart -- there is no longer a single reviewed commit that bumps both
    # together, so this tag's protocol data can silently drift behind the
    # running server. Since 0.2.0 the bot rides out protocol-number-only
    # bumps on its own (it pings the server each attempt and announces the
    # advertised number -- the loop that took both bots down when 1.26.45
    # shipped as protocol 2169 over unchanged packets); a release that
    # actually changes the packet schema still needs this tag re-bumped,
    # surfacing as a protocol_spoofed log line followed by session failures.
    #
    # 1.26.51 was such a release: this bot spoofed the advertised protocol,
    # joined, and then died parsing a packet ("expected size was 393"), while
    # bot2 on 1.1.0 rode the same bump out. 0.3.1 was the last TypeScript
    # build; moving to 1.1.0 finishes the migration to the Go client both
    # other workloads already run.
    #
    # The Go client's token cache format is its own: the cache this bot's PVC
    # holds was written by the TypeScript build and cannot be reused, so the
    # first pod on this tag will sit unauthenticated until someone completes
    # the device-code login by hand. See README, "Relocating a bot".
    tag: "1.1.0"
    pullPolicy: IfNotPresent

  # Not the gamertag other players see — Xbox Live supplies that. This is the
  # key the token cache is filed under, so changing it orphans the cached
  # credentials and forces another interactive login.
  username: fwb-afk-bot

  # See bot2.gamertag for why this is recorded. Documentation only.
  gamertag: LightBlaz3

  # Live as of the 1.1.0 bump above. It was inert under the TypeScript build,
  # whose client library read the requested radius from `client.viewDistance`
  # while storing the given value at `client.options.viewDistance` -- so every
  # request fell back to the library's hardcoded 10 whatever was set here. The
  # Go client honours it, which makes this bot's first run on 1.1.0 a real
  # 10 -> 12 radius increase; `chunk_radius_granted` in its log is what the
  # server actually gave it.
  #
  # Kept at 12 so the two bots read the same.
  viewDistance: 12

  # A single idle UDP session and a JSON log line per chat message — 500m was
  # never load-driven, and it silently ate the CPU headroom the bedrock
  # resources comment above already reasoned through (7-core bedrock + the
  # exporter's 100m sliver = 7100m, meant to leave room for the 1-core backup
  # CronJob and the 500m volume-recovery CronJob alongside it). This bot was
  # added after that budget was set and nothing revisited it: steady-state
  # usage hit 7700m/8000m, leaving only 300m — not enough for volume-recovery
  # (500m) to ever schedule, and it failed every 5-minute run until this
  # fixed it (observed live 2026-08-21, JDWLABS-334).
  #
  # Tightened again 2026-08-25 against live usage rather than estimate: the
  # running bot measured 46m CPU / 89Mi memory (kubectl top). 100m/256Mi still
  # carries real margin over that. Freed room for a second bot (bot2 below)
  # without making the pre-existing backup/volume-recovery quota gap worse —
  # that gap (documented above as of the 150m tuning) is a quota-tier-or-
  # bedrock-limit problem, still not addressed here.
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

  persistence:
    # File tier, not block: the cache is a few small JSON files with none of
    # the locking semantics that put the world on iSCSI.
    storageClass: truenas-nfs
    size: 1Gi

  # Real Xbox Live gamertags of sibling bots on this server — NOT the
  # `username`/cache-key values above (same distinction as that field's own
  # comment). Read them off this bot's `joined` log line or the server's own
  # `Player connected: <name>, xuid:` output. Feeds MC_BOT_NAMES so this bot
  # can never answer a sibling bot's chat into a loop.
  # Populated 2026-09-08, having been empty since this field was introduced.
  # Empty meant the loop guard it feeds was inert: the only thing preventing a
  # bot-answering-a-bot loop was that bot2 has no answering wiring at all.
  #
  # JDWServerAgent is listed for the same reason and is the more pressing one.
  # The server agent now replies in chat, so without this the answering bot has
  # an interlocutor that talks back -- two automated speakers and a 6/minute
  # rate limit between them and a loop.
  # Chat answering moved to minecraft-server-agent on 2026-09-08, where it is
  # reached with @server. botNames, answer and llm all went with it: they
  # existed only so one answering bot would not answer another into a loop, and
  # with nothing here answering there is nothing left to guard.
  #
  # Removing the variables is what disables it. The bot image defaults every
  # one of them -- MC_ANSWER_ENABLED absent reads as false, the numerics fall
  # back in config.ts -- so absence is off, where a zero would have tripped the
  # positive-int validators and crash-looped the pod.
bot2:
  # Same two-step bootstrap as `bot`: off until the account exists and the
  # image tag is published, then flipped on for the device-code login.
  enabled: true

  # See bot.replicas above — same take-offline-without-losing-cache mechanism.
  #
  # Taking this to 0 is how its account (Dotablaze7321) gets signed in to by
  # hand so the character can be moved; done and restored on 2026-09-08. Do not
  # use `kubectl scale`: selfHeal reverted one within 24 seconds, faster than
  # the server registers the disconnect. Freeing the *account* also needs
  # `tools/mc run kick <gamertag>` -- the server holds the session open for a
  # while after the client is gone.
  replicas: 1

  image:
    repository: ghcr.io/jdwillmsen/minecraft-afk-bot
    # The Go implementation; bot above stays on TypeScript as a live control.
    #
    # This is a canary, not a migration. The two bots do the same job on the
    # same server under the same conditions, so the farm's own output is the
    # comparison -- and it is the only one that matters. A bot that connects
    # but subtly fails to hold chunks looks perfectly healthy from Kubernetes,
    # which is exactly the failure this pairing exists to catch.
    #
    # 1.1.0 restores protocol negotiation, which the Go rewrite dropped. The
    # server runs Mojang's LATEST and upgrades itself on restart, and a point
    # release that bumps only the protocol number gets a client kicked before
    # login -- how 1.26.45 took the whole fleet offline over unchanged
    # packets. Until this tag, the TypeScript bot was the only client on the
    # server that would have survived a repeat.
    #
    # Rolling back is this value. The TypeScript image is not going anywhere
    # until the farm says the Go one works.
    tag: "1.1.0"
    pullPolicy: IfNotPresent

  # Distinct from bot.username so the two token caches never collide.
  username: fwb-afk-bot-2

  # The gamertag this account actually appears as in game. Recorded because
  # nothing else in the system maps a Deployment to a player: `username` above
  # is only the token-cache key, the bot never logs its own identity, and the
  # gamertag lives inside an encoded JWT in the token cache. Working it out on
  # 2026-09-08 took correlating this pod's spawn timestamp against the server's
  # "Player connected" line three seconds earlier.
  #
  # Documentation only -- nothing reads it. It is here so the next person
  # asked to move a specific bot can answer "which one is that" in one grep.
  gamertag: Dotablaze7321

  # Matched to the server's tickDistance (12), which is Bedrock's maximum.
  #
  # This was 4, on the reasoning that the value only governs how many chunks
  # the server sends and that simulation is bounded by tickDistance anyway, so
  # a low value cost bandwidth and nothing else. That was wrong: measured on
  # 2026-09-08, requesting 4 was granted 5 and requesting 12 was granted 12,
  # so the server honours what the client asks for rather than extending to
  # tickDistance. The bot was holding roughly a fifth of the area it was
  # supposed to, and nothing showed it -- the farm produced either way.
  viewDistance: 12

  # Sized from bot's live-measured usage (46m CPU / 89Mi, see above) rather
  # than guessed — same workload shape, same numbers.
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 100m

  persistence:
    storageClass: truenas-nfs
    size: 1Gi

  # A second answering bot on the same server is a chat loop, not just a
  # duplicate: bot would answer bot2's answer, bot2 would answer that reply,
  # forever. This bot only holds a slot and mirrors chat — see bot.answer
  # above for the one that answers.
  # No answering here either; see bot's note above.

consoleBridge:
  # No `enabled` here on purpose. This chart's own console-bridge templates
  # read global.consoleBridge.enabled, the same flag the sidecar needs, so
  # there is exactly one switch for the whole feature. A second flag beside it
  # would only add a way to render half of this.
  service:
    port: 8766

# The chat-reading, tool-calling server agent (minecraft-server-agent).
#
# The bootstrap order below is the reverse of `bot`'s and of what this comment
# used to prescribe. It said to complete the device-code login before flipping
# this on, which cannot work: the login is driven by a `device_code_required`
# event that only the running agent emits, so the workload has to exist first.
# The agent idles harmlessly until the account is authenticated, which is what
# makes turning it on ahead of the login safe rather than premature.
agent:
  # Enabled 2026-09-08 once every prerequisite was checked rather than assumed:
  # the image pulls (verified by a throwaway pod on the target node), the
  # console-bridge it talks to holds a live console connection, and the Secret
  # behind both exists.
  #
  # A throwaway pod is still the check worth running, because it exercises
  # what the kubelet actually does. But the reason first recorded here --
  # that ghcr answers 404 anonymously for these packages -- was a misreading.
  # These images are single-arch OCI image manifests, not indexes, and ghcr
  # returns 404 unless the request's Accept header names that exact type:
  #
  #   Accept: application/vnd.oci.image.manifest.v1+json   -> 200
  #   Accept: application/vnd.oci.image.index.v1+json      -> 404
  #   Accept: application/vnd.docker.distribution.manifest.list.v2+json -> 404
  #
  # The packages are anonymously readable. Worth knowing, because reading that
  # 404 as "private" is how a real authentication failure later gets waved
  # through as normal.
  #
  # Turning this on does not restart the server: it adds a Deployment, a PVC
  # and a ServiceMonitor, and leaves the StatefulSet byte-identical. Confirmed
  # by rendering the chart both ways and hashing the StatefulSet.
  #
  # The agent still cannot join until its Microsoft account completes a
  # one-time device-code login and its gamertag is on the allowlist -- see
  # README steps 5 and 6. Until then it runs, logs device_code_required, and
  # does nothing else.
  enabled: true

  # Taking this to 0 is how a human signs in to the agent's account and moves
  # the character by hand: one Microsoft account holds one Minecraft session,
  # so the agent has to be off the server first. Done on 2026-09-08 to park it
  # somewhere safe -- it is a real player with no death or respawn handling, so
  # where it stands is the difference between a stable agent and one that dies
  # to a mob and goes quiet with nothing alerting.
  #
  # Use this value, not `kubectl scale`: the Application syncs with selfHeal
  # and reverted a direct scale within seconds (observed). Use `replicas`, not
  # `enabled: false`: disabling deletes the PVC holding the token cache and
  # forces another device-code login.
  # Restored 2026-09-08 after the character was moved back by hand. Taking
  # this to 0 is how that is done: one Microsoft account holds one Minecraft
  # session, so the agent has to be off the server first, and freeing the
  # account also needs `tools/mc run kick JDWServerAgent` because the server
  # holds the session open after the client goes. `kubectl scale` does not
  # work -- selfHeal reverts it within seconds.
  replicas: 1

  image:
    repository: ghcr.io/jdwillmsen/minecraft-server-agent
    # 0.7.0 carries three changes that had been merged but never released, so
    # this bump is larger than the version gap suggests:
    #
    #   - a generated skin, so the agent is a coloured figure rather than the
    #     black silhouette a headless client gets by default. Player-visible.
    #   - the pkg/ export the AFK bot copies its shared packages from.
    #   - protocol negotiation: the server runs Mojang's LATEST and upgrades
    #     itself on restart, and a point release that bumps only the protocol
    #     number gets a client kicked before login. That is how 1.26.45 took
    #     the fleet offline over unchanged packets, and until this tag the
    #     agent would not have survived a repeat.
    #
    # 0.8.0 makes the persistence added in 0.4.0 actually record anything.
    # plugin.Context.Profiles was declared and never assigned, so the welcome
    # plugin never called RecordJoin and no arrival was ever written; nothing
    # reported it, because the only branch that would log is the error path of
    # a call that was not being made. minecraft.players and minecraft.sessions
    # both held zero rows the entire time while the agent read as healthy.
    #
    # Needs the grants migration that landed alongside it: the runtime role had
    # no privileges on any table in the minecraft schema, so even a wired call
    # would have failed. Both halves are in as of this bump.
    #
    # On top of the skin, pkg/ export and protocol negotiation (0.7.0),
    # respawn-on-death and liveness-based readiness (0.5.0), profiles/playtime
    # (0.4.0), !online/!version/!backup (0.2.0) and @server answering (0.3.0).
    #
    # 0.9.0 is Stage 5: !kb (a curated fact store, open to read and
    # operator-only to write), !wp (per-player coordinates, whispered because
    # broadcasting where someone lives is a griefing vector), and a bounded
    # tool-calling loop that lets the model look both up before it answers an
    # @server question.
    #
    # Needs the V3 migration that landed alongside it, and this time that was
    # verified rather than assumed: minecraft.knowledge and minecraft.waypoints
    # exist, and the app role holds SELECT/INSERT/UPDATE/DELETE on both, so V2's
    # default privileges covered the new tables. Against a database without
    # them, !kb and !wp fail into a logged error the dispatcher never replies
    # to, which players read as the commands not existing.
    #
    # Answering also moved off the Bedrock packet read loop in this release. A
    # tool-calling exchange makes up to three sequential backend calls, and
    # doing that inline stopped the agent hearing anything -- joins, commands,
    # chat -- for the duration.
    #
    # 0.10.0 batches three merged changes into one release so the account
    # takes one login rather than three. The hold that took the agent down
    # on 2026-09-09 followed a dozen restarts in an afternoon; every restart
    # is a fresh Xbox Live authentication, so releases are batched on purpose.
    #
    #   - Announcements: !announce for operators, !inbox for players, and
    #     queued messages delivered on join. A message for an offline player
    #     waits for them, whispered, rather than being lost.
    #   - A durable command audit in minecraft.command_audit. It records who
    #     ran what at which permission and the outcome, and deliberately not
    #     the reply text, which can carry whispered coordinates.
    #   - Auth backoff: an Xbox Live account rejection now waits fifteen
    #     minutes between attempts instead of retrying on the five-minute
    #     ladder, which can extend the very hold it is waiting out. It still
    #     retries, because that is what recovered the agent unattended.
    #   - The play-test fixes: knowledge lookup matches phrasing players
    #     actually use, and !wp lists coordinates and accepts x= y= z=.
    #
    # Needs the V4 migration, which is already applied — and the app role was
    # verified able to write all three new tables against the live database
    # before this bump, rather than assumed from the V2 default privileges.
    #
    # 0.10.1 makes !ping measure the server rather than the agent: TPS read
    # off the game clock with `time query gametime` (already on the bridge
    # allowlist), plus the round trip over the agent's Bedrock connection.
    # It adds one console command a minute, and so one "Gametime is" line a
    # minute in the server log, which is the baseline every ping measures
    # against. No migration.
    #
    # 0.11.0 is what makes 0.10.1's measurement visible. The metrics package
    # that exports it was merged and then never tagged, so prod has been
    # scraping an agent that only ever published mc_agent_connected and
    # mc_agent_reconnects_total: !ping could answer a player in chat while
    # Prometheus held no TPS series at all. This bump adds nine, of which
    # mc_agent_server_tps and mc_agent_tps_last_success_timestamp_seconds are
    # the pair worth alerting on — the gauge is a vector with no labels so it
    # does not exist until something measures it, and the timestamp is a
    # plain gauge so a run of failures reads as stale rather than as a
    # crashed server reporting zero.
    #
    # Also raises the chat reply cap from 200 to 400 characters. The old cap
    # was justified in code as Bedrock's own line limit; measured against
    # this server, tellraw carried 2000 characters intact, so the limit was
    # ours and it was cutting real answers mid-word with no ellipsis. 400
    # stays inside the LLM_MAX_TOKENS=192 this chart already sets, so the cap
    # that shortens a reply is the one that cuts cleanly. No migration.
    #
    # 0.11.1 makes !wp help and !kb help answer with the command's own syntax.
    # Both fell through to their lookup branch and reported "You have no
    # waypoint called help" / "I don't know anything about help", so the word a
    # player reaches for when the syntax is not obvious was the one word that
    # could not tell them it. help is now reserved in both stores beside set
    # and del, since a name the switch intercepts could otherwise be stored and
    # never read back. Reported in game. No migration.
    #
    # 0.12.0 answers a whispered @server question privately. Commands already
    # behaved this way -- a reply goes back the way the command came in, which
    # is why !wp whispers coordinates -- but the mention path broadcast every
    # answer except one built from the asker's own waypoints. A player who
    # whispered a question therefore had it answered in front of everybody,
    # publishing the question they had chosen not to ask in public.
    #
    # Open chat still gets a broadcast, and deliberately: an answer only the
    # asker can see reads as no answer at all to everyone who watched them
    # ask. A whisper has no such audience. Only Bedrock's /tell counts as
    # private; a console tellraw arrives as a different text type and keeps
    # the broadcast. Minor rather than patch because it changes where an
    # existing reply goes. No migration.
    #
    # 0.13.0 answers an unknown or refused command instead of returning
    # silence, which a player cannot tell apart from the agent being offline.
    #
    # Unknown is answered only when whispered. Any message opening with "!"
    # parses as a command, so "!!!" and "!nice that was close" reach the same
    # branch, and answering all of them would have the agent talking over
    # ordinary chat -- which is why it was silent to begin with. A whisper has
    # no conversation to talk over.
    #
    # A refusal is answered either way, because it can only happen for a
    # command that actually exists; nothing conversational reaches it. That
    # names a command !help would have hidden, which is the deliberate trade:
    # silence after a correct guess is indistinguishable from a broken agent.
    # No migration.
    #
    # 0.14.0 was the Stage 6 batch: recorded leaves, announcements from
    # events and schedules and the HTTP API, a moderation audit behind
    # !modlog, and replies that carry no tool-call markup. Its migrations
    # (V5 schedules, V6 moderation) were applied and granted before that
    # bump.
    #
    # 0.15.0 needs no migration. It writes sessions.ended_reason
    # 'agent_restart', a value V1 already permits and nothing had used.
    #
    # - Players already online when the agent connects are no longer greeted
    #   again, nor their join counted. The server opens a session by naming
    #   this client alone and then again at the head of the full roster, and
    #   the agent used to read everyone behind that as a fresh arrival.
    #   Effective this restart: the new pod is the one classifying.
    # - A backlog queued for a joining player waits until their client can
    #   render chat, and stops if the connection carrying it ends, so no
    #   announcement is recorded against someone who never saw it.
    # - The agent now disconnects cleanly on shutdown instead of leaving the
    #   server to time its login out, which is about ten seconds of the
    #   half-minute a release used to cost. That applies from the *next*
    #   restart onward -- the pod leaving this time is 0.14.0 and does not
    #   have it.
    # - The warm-standby handover ships with it but stays inert here: the
    #   strategy below is still Recreate, so no standby ever overlaps the
    #   pod it replaces. The leader lock, its heartbeat and the standby
    #   readiness state are all live and idle, waiting on the rolling-update
    #   change that the token-cache volume still blocks.
    # - Its new tuning (LEADER_POLL_MS, LEADER_MAX_WAIT_MS,
    #   LEADER_HEARTBEAT_MS) is left at defaults and not set below.
    #
    # Playtime still counts only what the agent watched, so this restart
    # starts a fresh session for everyone online. From the next one it will
    # not: the departing agent closes what it was watching at the moment it
    # stops, and that time is credited.
    #
    # 0.16.0 carries ten merged commits, of which one is why this bump
    # happens now: the image gains a second binary, /census, which the census
    # CronJob below runs. Nothing in the agent process itself changes shape
    # because of it -- the binary only rides along in the image.
    #
    # The other nine are this cycle's fixes and are listed here because a tag
    # bump is the only place anybody reads what a restart is about to change:
    # announcements no longer report an unspoken send as delivered, nor
    # record one across a disconnect gap; a knowledge lookup that matched only
    # another compound's head word now hedges instead of answering flatly;
    # another player's waypoint question is answered in code rather than by
    # the model; an older Bedrock client is told it cannot join rather than
    # failing opaquely; the Xbox refresh token is cached in Postgres so a
    # standby can read it; a refusal the model wrote during a tool round is
    # now spoken; and the eval scores the delivered line for markup and
    # invented facts.
    #
    # 0.17.0 changes nothing about the agent process. It carries /census's
    # -metrics-file, which is what census.metrics above needs: the counts the
    # nightly scan already computes, written as a Prometheus payload instead
    # of only into a Job log that is evicted within three days.
    #
    # 0.18.0 carries /joinprobe for the Deployment below, and teaches the
    # agent SESSION_RECYCLE_MS -- the two halves of "can a client still start
    # a session", which nothing here asked before. The recycle is the one that
    # changes the agent's own behaviour: it drops its session on a schedule,
    # crediting everyone's playtime first, so the reconnect that follows is a
    # measurement rather than an outage.
    #
    # 0.19.0 retries the Postgres connect at startup instead of exiting on the
    # first failure. The Xbox token lives in Postgres and the token-cache
    # volume is gone, so an agent that could not reach its database had no
    # token either, and a single failed connect cost the pod: one crash-looped
    # for eleven minutes while its sibling on the same node reached the same
    # database in 112 ms. It now waits up to 90 seconds with /healthz
    # answering. It also moves gophertunnel to 1.62.0, and the census prints
    # a cluster's extent rather than only a centre that can be empty ground.
    tag: "0.19.0"
    pullPolicy: IfNotPresent

  # Drops and re-establishes the agent's own Bedrock session this often.
  #
  # The join probe below stops one step short of an account: it proves the
  # server will start a session, not that a real client can authenticate and
  # spawn. The agent holds an account, so recycling its session turns it into
  # the only thing that periodically proves the whole path -- and the 09-15
  # outage is exactly the case where a client already holding a session could
  # not have noticed, since every session that mattered predated the fault.
  #
  # Six hours: four proofs a day, against a failure measured in hours of nobody
  # being able to join, at the cost of the agent leaving chat for the length of
  # a reconnect four times a day -- the same gap a deployment already causes.
  #
  # It ran at one hour first, because one step was unverified: this server
  # holds a session open after a client leaves (playerIdleTimeout is 0, and
  # freeing an account has needed `tools/mc run kick` before), so a rejoin by
  # the same account might have been refused as already connected. It is not.
  # The first recycle, 2026-09-19 06:27:50 UTC, credited two players' open
  # sessions, dropped, and was spawned again 10.2 seconds later on the same
  # account.
  #
  # A recycle that does not come back raises
  # JdwillmsenMinecraftAgentSessionStale after two and a half cycles -- fifteen
  # hours at this cadence.
  sessionRecycleMs: 21600000

  # Same distinction as bot.username: the token-cache key, not the gamertag
  # other players see.
  username: fwb-server-agent

  # No viewDistance value here unlike the bots: the agent's Stage 1 config
  # has no MC_VIEW_DISTANCE wiring at all — it doesn't need to render or
  # track chunks, only read/send chat, so there is nothing yet for this
  # value to configure. Add it here only alongside real code that reads it.

  # Sized from bot's live-measured usage (46m CPU / 89Mi) as a starting
  # point — the agent does more per chat message (plugin dispatch, an HTTP
  # call to the bridge) but nothing CPU-heavy yet at this stage. Revisit
  # once Stage 4's LLM tool-calling loop lands.
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

  bridge:
    # CONSOLE_BRIDGE_TIMEOUT_MS: how long the agent waits on a single call to
    # the console-bridge's HTTP API before giving up. The bridge's own URL
    # isn't a value here — agent-deployment.yaml builds it directly from the
    # consoleBridge.host helper (_helpers.tpl) and consoleBridge.service.port
    # below, the same way bot-deployment.yaml builds MC_HOST from
    # bot.serverHost.
    timeoutMs: 5000

  metrics:
    port: 9090

  # Postgres, for the Stage 3 work: player profiles, playtime and the state
  # behind welcome variants. The database and its `minecraft` schema are
  # declared in jdwlabs/platform (tenants/platform/services/postgresql-cluster-prd).
  database:
    credentials:
      # On before anything reads it, on purpose. A credential object nothing
      # consumes is inert: if it cannot sync, it fails alone and visibly,
      # rather than taking a workload down with it -- which is exactly how the
      # 2026-09-06 outage happened, and why that order is now the house style.
      create: true

    # On as of 2026-09-08, in this order: the database and its minecraft schema
    # were created, the credentials were observed SecretSynced, the Flyway
    # migration ran and recorded V1 successfully, and only then was this
    # flipped. Each step was verified before the next assumed it -- the
    # opposite of the ordering that caused
    # docs/incidents/2026-09-06-fwb-console-bridge-secret.md.
    #
    # Turning this back off is safe at any time: the agent falls back to the
    # plain greeting it used before Stage 3 and keeps answering commands.
    enabled: true

    host: platform-postgresql-cluster-prd-rw.database.svc.cluster.local
    port: 5432
    name: jdwillmsen_prd
    schema: minecraft

  # @server chat answering. Off here rather than in the agent's own defaults so
  # that turning it on is a reviewable change to this file.
  #
  # The backend is the cluster's own vLLM, which the AFK bot has been answering
  # from since 2026-09-01 -- so this is a proven endpoint, not a new dependency.
  # Once this is verified in game, bot.answer can be removed: the duplication
  # between the two is the whole reason the bot strip-down was blocked.
  llm:
    enabled: true
    baseUrl: http://192.168.1.50:8000/v1
    model: qwen/qwen3-coder-30b-a3b
    # 96 was sized for a single chat line and cannot hold a tool call's
    # arguments plus an answer on top of it.
    maxTokens: 192
    # Per call. Each request the answering loop makes gets its own bound, so
    # one stalled request cannot consume the whole attempt.
    timeoutMs: 8000
    # The whole attempt, every tool round trip included. This must be at least
    # (MaxToolRounds + 1) x timeoutMs -- three calls at 8s, so 24s -- with
    # margin, or a model that uses both of its tool rounds is cancelled before
    # it ever answers and the player who asked simply gets silence. The agent
    # defaults to this same value; it is set here so the relationship between
    # the two is visible in one place rather than inferred from a default.
    totalTimeoutMs: 30000

    # Deliberately below the command limit (10/min). One answer costs an LLM
    # call; one command costs a console round trip.
    maxPerMinute: 4

  # Words whose use in public chat is recorded in the moderation audit and
  # answered with a whispered warning. Empty keeps that one rule off; the
  # flood and caps rules need no configuration and run regardless. Matching
  # is case-insensitive on word boundaries. Nothing is kicked, muted or
  # banned: the console bridge's allowlist permits none of that, and widening
  # it is a separate security decision.
  moderation:
    terms: []

  # POST /announcements for in-cluster systems such as deploy hooks. Off until
  # existingSecret names a Secret holding a bearer token under secretKey: with
  # no token the agent does not mount the endpoint at all, so a disabled API
  # answers exactly as an absent one does. The Secret is created by a human
  # outside any agent session, never by this chart, so the token never passes
  # through a transcript or a values file.
  announceApi:
    existingSecret: ""
    secretKey: token

# The route in for retail clients, and the UDP range the server hands them.
#
# Bedrock 1.26.51 made NetherNet the only transport retail clients will use.
# Signaling is HTTP over TCP on minecraft-bedrock.minecraftServer.serverPort;
# gameplay is UDP negotiated per client, which behind a NodePort has to be
# pinned and advertised or the server offers clients its own pod IP -- a
# 10.244.x address nothing on the LAN can route to.
#
# The pinning itself lives in server.properties on the world PVC, not here:
#
#   transport=nethernet
#   server-udp-ports=192.168.1.87:31160-31179:31160-31179
#
# The itzg image has no property mapping for either key (checked against
# /etc/bds-property-definitions.json in 2026.8.2), so the chart cannot set
# them and this block only opens the matching way in. The node literal is the
# one this server is pinned to by affinity above; it has to be the address
# clients dial, not the pod's.
#
# Count matches minecraftServer.maxPlayers: one UDP port per connected
# client. Widen both together.
netherNet:
  enabled: true

  # Where the server listens, which is minecraftServer.serverPort -- the
  # signaling socket replaces the RakNet one on the same number.
  signalingPort: 31132

  # What players dial, and deliberately not 31132. A nodePort is allocated
  # per number across the whole cluster, not per protocol: the subchart's UDP
  # Service already holds 31132, and asking for it again is rejected outright
  # ("provided port is already allocated", confirmed against the live
  # apiserver). The two cannot be the same number while both Services exist.
  signalingNodePort: 31134

  gameplayPorts:
    start: 31160
    end: 31179

  # The replacement health signal while the kubelet probes are off.
  #
  # Aimed at the node address and nodePort players dial, not at the pod: that
  # is the path being promised, and it fails for a dead server, a dead node
  # and a NodePort that stopped routing alike. The blackbox exporter and the
  # tcp_connect module it uses are already deployed in the monitoring
  # namespace; Prometheus selects Probes and PrometheusRules with empty
  # selectors, so both objects are picked up from this tenant namespace with
  # no change to the platform repo.
  # Off while the server speaks RakNet. This probe is a TCP connect against the
  # signaling port, and a RakNet server opens no TCP listener there -- left on
  # it reports probe_success 0 for a server that is serving fine, which is a
  # false alarm on the one alert that is supposed to mean "players are locked
  # out". RakNet has its own working check again: the kubelet probes and
  # mc-monitor's metric both came back the moment the transport did.
  #
  # The Service, the ports and this probe all stay in the chart rather than
  # being deleted: NetherNet is where Mojang is going, and the next attempt
  # should start from what was already learned here rather than from nothing.
  probe:
    enabled: false
    interval: 30s
    target: 192.168.1.87:31134
    blackboxHost: platform-blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115

# Asks whether a client can still start a session, which is the one question
# nothing else in this chart asks.
#
# Every check here passed for the whole of the 2026-09-15 outage while nobody
# could join: the RakNet ping answered, mc-monitor reported players online, and
# all three kubelet probes were green. The server was a version behind its
# clients and refuses a mismatched protocol before login begins -- a step past
# everything being checked -- and the only clients connected had joined before
# the fault and speak RakNet themselves.
joinProbe:
  # Needs an agent image carrying /joinprobe, which is 0.18.0 and later.
  enabled: true

  # A minute. The check is one ping and one handshake against a server on the
  # same node, so the cost is noise; what it buys is that an outage is noticed
  # in minutes rather than by the first player who tries.
  interval: 1m

  # 9101 is the backup exporter, 9102 the census exporter.
  port: 9103

  # The protocol number the handshake announces. Empty means "whatever the
  # server advertises", which asks whether the server is consistent with
  # itself. Setting a number asks whether a client built against *that*
  # version could join, which is the sharper question -- and the one the
  # September outage turned on -- but it has to be maintained by hand against
  # Mojang's releases, and a stale number here would page about a version
  # nobody runs any more.
  protocol: ""

  alert:
    enabled: true
    # Ten minutes. A server restart takes about a minute and the nightly
    # scheduled restart takes two with its countdown, so this clears both
    # without ever paging for them; the failure it does catch lasted hours.
    for: 10m

  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
      cpu: 100m

# Reads the world and reports which 9x9-chunk regions have hit Bedrock's mob
# spawn cap -- the question "why is nothing spawning near my base" turned into
# something reproducible. Takes a fresh snapshot through the server's own save
# protocol when it can, and falls back to the newest backup archive when it
# cannot.
census:
  # On as of agent 0.16.0, which is the first release whose image carries
  # /census. This is the second half of the two-step bootstrap the comment
  # here used to describe: the job shipped inert so the chart and the image
  # could be landed and reviewed separately.
  #
  # What switching this on starts doing nightly: an init container execs into
  # the server pod and drives `save hold` / `save query` / `save resume` to
  # copy the world consistently. The hold is seconds and the backup job has
  # run the same sequence against this server for months, but it is a real
  # touch of a live save path rather than a read of a file, and that is worth
  # knowing before the first 05:00 run rather than after it.
  #
  # If it misbehaves, setting this back to false stops it entirely: nothing
  # else in the chart depends on it, and the report it produces is read from
  # a job log rather than consumed by anything.
  enabled: true

  # 05:40 UTC, which is clear of both neighbours that drive this same server's
  # save protocol -- and 05:00 was clear of neither. The backup starts at 04:00
  # with an activeDeadlineSeconds of 3600, so a slow night has it still holding
  # at 05:00; the version check runs hourly with a timeoutSeconds of 1500, so
  # its own 05:00 run can be restarting the server until 05:25. A census that
  # starts at 05:00 meets the first head-on and the second by the clock.
  #
  # What the separation protects is the save protocol, not the volume: two jobs
  # holding the same server means whichever finishes first resumes it while the
  # other is still copying, and a world the server resumed writing mid-copy is
  # the one state nothing downstream can detect.
  #
  # Every time here is UTC, because nothing in this chart sets timeZone on any
  # CronJob -- which is what makes the three windows comparable at all.
  #
  # Daily rather than hourly because the counts this measures move over days: a
  # region does not approach its cap between breakfast and lunch. Daily is also
  # the slowest it can safely be, since the cluster-wide
  # CronJobHasNotSucceededRecently fires at 24h without a success.
  schedule: "40 5 * * *"

  # What stops the separation above from being undone by catch-up. See the
  # field's comment in census-cronjob.yaml.
  startingDeadlineSeconds: 600

  # Drives the save protocol through kubectl exec, exactly as the backup job
  # does, so it tracks the cluster's minor version for the same reason: a
  # skewed client misbehaves on the one path that touches a live world.
  image: alpine/k8s:1.37.0

  # The hold poll is 30 iterations of roughly 5s, and a scan of the 570MB
  # production world measured 270ms, so a run that reaches this is wedged
  # rather than slow.
  timeoutSeconds: 900

  # A failed Job with no TTL is kept until failedJobsHistoryLimit evicts it,
  # and KubeJobFailed reads the object rather than the run -- so one bad night
  # pages until then. Deleting on a timer bounds that to a day, while a fault
  # that is still real re-fires on the next schedule.
  ttlSecondsAfterFinished: 86400
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  # Publishes the counts as time series alongside the printed report.
  #
  # The report stays the better artefact for the spawn-cap and concentration
  # tables; what it cannot do is answer "is world load growing?", because the
  # Job log holding it is evicted by successfulJobsHistoryLimit within three
  # days. That question was load-bearing during the tick-decay investigation,
  # and answering it meant recovering three evicted runs out of Loki by hand
  # -- numbers this job had computed correctly every night and thrown away.
  metrics:
    # Needs an agent image carrying /census with -metrics-file, which is
    # 0.17.0 and later. Switching this off stops the sidecar and the exporter
    # and leaves the report exactly as it was.
    enabled: true

    exporter:
      # Same shape as the backup exporter and deliberately a separate pod:
      # Prometheus drops an entire scrape on one malformed line, so a shared
      # process would put the backup freshness contract and the census counts
      # behind each other's mistakes.
      image: busybox:1.38
      # 9101 is the backup exporter's.
      port: 9102
      # The payload changes once a night. A faster scrape buys nothing and a
      # slower one delays a run's numbers past the morning somebody reads
      # them.
      interval: 300s
      refreshSeconds: 60

    alert:
      enabled: true
      # Two nights. The cluster's CronJobHasNotSucceededRecently already pages
      # at 24h for a census that fails or is never scheduled, so anything under
      # a day here would only restate it and double-page. What this catches is
      # the case that rule cannot see: a census that succeeds while the
      # sidecar, the ConfigMap or the exporter has stopped carrying the result,
      # leaving a green scrape serving numbers that stopped moving.
      maxAgeSeconds: 172800

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      # The scan holds every entity in memory at once -- about 22,600 on the
      # production world, which is small. The ceiling is sized for the archive
      # extraction and the LevelDB read rather than the entity slice.
      memory: 1Gi
      # The namespace quota caps limits.cpu at 8000m, of which the server
      # holds 4000m and the backup, volume-recovery and version-check jobs can
      # claim 2000m between them if they land together. 500m for a job that
      # runs once a day, an hour after the backup has finished, fits without
      # reopening that fight.
      cpu: 500m

# Restarts the server nightly, because on Bedrock 1.26.51.1 tick rate decays
# with process age -- 20.00 TPS after a restart, about 3.5 TPS/day lost
# thereafter, reaching 12.5 by the second day. The same world on 1.26.45 held
# 20.00 across a 4.7-day process, so the world is not what changed.
#
# This is a mitigation and is written to be thrown away: the decay itself has
# no fix yet, and a restart is the only thing known to reverse it.
scheduledRestart:
  enabled: true

  # 09:40 UTC (04:40 CDT), chosen against every other schedule that touches
  # this server rather than picked for being quiet:
  #
  #   backup        04:00, activeDeadlineSeconds 3600 -- can hold the save
  #                 until 05:00
  #   census        05:40
  #   version-check hourly, timeoutSeconds 1500 -- its 09:00 run can be
  #                 restarting the server until 09:25
  #
  # 09:40 clears the worst of those by fifteen minutes, and it is the
  # emptiest point in this server's session history. Every time in this chart
  # is UTC, because no CronJob here sets timeZone -- which is what makes the
  # windows comparable at all.
  schedule: "40 9 * * *"

  # Ten minutes, for the same reason the census sets it: left unset, the
  # controller admits the most recent missed run of every CronJob at once
  # after an API outage, and the separation above is then worth nothing. A
  # night skipped outright is better than a restart landing on a save hold,
  # and a skipped night is not silent -- the cluster's
  # CronJobHasNotSucceededRecently fires at 24h without a success.
  startingDeadlineSeconds: 600

  # Same image as the other in-cluster actors. It needs kubectl and python3,
  # both of which this one already carries.
  image: alpine/k8s:1.37.0

  # What a player experiences, so it is the one number here worth arguing
  # about. Two minutes matches the deploy announcement's lead: long enough to
  # reach somewhere safe, short enough that a nightly event is not a nightly
  # interruption. It is skipped entirely when nobody is online, which at
  # 09:40 UTC is most nights.
  leadSeconds: 120

  # Counted per loop *ceiling* rather than per deadline, because a wall-clock
  # deadline is where work stops starting, not where it stops:
  #
  #   pod present / ready         10 + 10 =  20
  #   player count       15 (exec) + 2 (sleep) + 15 (logs) =  32
  #   countdown       leadSeconds + 6 announce timeouts   = 210
  #   stop                                  timeout       =  30
  #   restart poll   120 + 10 (get) + 3 (sleep)           = 133
  #
  # About 425s of worst case. 600 leaves margin without letting a wedged run
  # sit long enough to matter -- and with concurrencyPolicy Forbid, a run that
  # never ends would otherwise suspend every future restart silently.
  timeoutSeconds: 600

  # A failed Job with no TTL is kept until failedJobsHistoryLimit evicts it,
  # and KubeJobFailed reads the object rather than the run -- so one bad night
  # pages until then. Deleting on a timer bounds that to a day, while a fault
  # that is still real re-fires on the next schedule.
  ttlSecondsAfterFinished: 86400
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5

  # It execs into another pod and sleeps; the floor here is kubectl and one
  # python3 invocation, not the work being done.
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Alerts on a server that answers every reachability check while running at
# two thirds speed -- the state this server was in for two days before anyone
# noticed, with no check anywhere that asks how fast it is ticking.
tickRateAlert:
  # Reads mc_agent_server_tps, which the server agent publishes: with
  # agent.enabled false there is no series, and the second rule below is what
  # says so rather than leaving the first quietly unfirable.
  enabled: true

  # Below normal jitter and above the trouble: healthy days measured a p10 of
  # 19.5-20.0, while the onset day had already reached 15.9 by its end.
  #
  # Read this together with the `for` below rather than on its own -- the pair
  # is what decides when it fires. Sustained means *every* evaluation in the
  # window is under the threshold, so the single-sample dips this server takes
  # routinely (a save hold, a chunk load: 7.7 TPS for one reading three hours
  # into an otherwise clean cycle) cannot reach it.
  #
  # Replayed against the real decay in Prometheus at 1m steps, this pair first
  # fires 09-17 12:58 -- about 30 hours in, with the server at 13-16 TPS and a
  # day and a half before anyone noticed by hand. With the nightly restart
  # above in place the server never reaches that age, so what remains is the
  # alert for a restart that did not happen or did not help.
  #
  # The margin against a normal night is real but thin: on the heaviest day
  # measured, the busiest 24-hour cycle bottomed out at a sustained 17.31, so a
  # heavier one than anything on record would page while merely slow. That is
  # a true statement about the server when it happens, and the severity is
  # warning.
  threshold: 17

  # Thirty minutes of *average* tick rate, which is where the patience in this
  # rule lives. A backup's save hold, a census scan or a chunk-loading spike
  # all clear well inside it, and the failure being caught here takes days
  # rather than minutes to develop.
  #
  # An average rather than requiring every sample under the threshold, because
  # this server's tick rate oscillates. Measured over the twelve hours to
  # 2026-09-19 05:25, while it sat at 12-15 TPS: 171 minutes under 17, in 51
  # separate spans, longest 8 minutes. A rule needing 30 unbroken minutes saw
  # nothing at all. The same window averaged gives two spans over 30 minutes.
  window: 30m

  # Short on purpose: the averaging window above is the patience, and this only
  # stops a single evaluation at the boundary from paging.
  for: 5m

  # How recent a reading has to be to count. The agent samples the game clock
  # once a minute and Prometheus scrapes every 60s, so five minutes is several
  # missed cycles rather than a tight race -- the widest gap measured across
  # 50 hours, including a full server restart, was 158s. The metric holds its
  # last good value across a failed measurement by design, so without this
  # clause an agent that stopped measuring during a slow patch would page
  # forever about a number frozen in the past.
  #
  # Both rules read this one value: anything too stale to be compared is what
  # the second rule reports as unmeasured. Two separate numbers would leave a
  # band of staleness that suppresses the first rule without raising the
  # second, which is the failure this alerting exists to avoid.
  freshnessSeconds: 300
