minecraft-bedrock:
  image:
    repository: itzg/minecraft-bedrock-server
    # Pinned rather than latest. The VM this migrates from ran the image's
    # default rolling tag, which upgrades the server binary underneath a live
    # world; for a GitOps workload whose state is the whole point, that is a
    # silent-change hazard rather than a convenience.
    tag: "2026.8.1"
    pullPolicy: IfNotPresent

  # RollingUpdate is safe here despite the ReadWriteOnce volume: a StatefulSet
  # terminates its pod and waits for it to go before creating the replacement,
  # unlike a Deployment which would start the new one alongside. There is never
  # a moment with two writers on the world.
  #
  # OnDelete was the earlier choice and made every version bump a two-step
  # manual chore — merge, then remember to delete the pod. Rolling means a
  # version change in this file applies on the next sync by itself.
  workloadAsStatefulSet: true
  strategyType: RollingUpdate

  # Published guidance puts a light world with a handful of players at 1-2 GiB.
  # The VM's 4 GiB covered an entire guest OS as well, so it is not the right
  # reference. The namespace's quota tier (tenant.yaml) caps requests/limits
  # in total, and the backup CronJob has to be able to schedule alongside this.
  #
  # cpu bumped 1/2 -> 3/7 after raising tick-distance/view-distance for the mob
  # farm pushed the old 2-core limit into throttling (cgroup stats: ~34% of
  # periods throttled) — the quota tier moved standard -> large alongside this
  # to make room. Not the tier's full 4/8: the backup-exporter Deployment is
  # always-on and holds a sliver of the same quota (100m limit/10m request),
  # so asking for the full ceiling here leaves the pod permanently unschedulable
  # (hit exactly this — FailedCreate, quota exceeded by that same sliver).
  # Memory left as-is; usage stayed well under the old 4Gi limit.
  resources:
    requests:
      memory: 2Gi
      cpu: "3"
    limits:
      memory: 4Gi
      cpu: "7"

  # Bedrock ticks on a single core and uses others for chunk loading, so these
  # two nodes are chosen for headroom rather than core count; every other node
  # in the fleet is too memory-tight to take a 2 GiB request.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - talos-lx0-6a4
                  - talos-4h8-zy6

  minecraftServer:
    eula: "TRUE"
    # Pinned, and bumped deliberately rather than tracking LATEST. Bedrock
    # upgrades a world in place on first load and an older server cannot reopen
    # it afterwards, so every bump is a one-way door — which is exactly why it
    # should be a reviewed one-line change here rather than something that
    # happens on its own overnight. The nightly backup is the safety net.
    #
    # To update: change this value, merge, done. The rolling update strategy
    # above applies it on the next sync with no manual step.
    version: "1.26.43.1"
    difficulty: hard
    gameMode: survival
    levelName: FWB
    serverName: "FWB Server"
    allowCheats: false
    # 12 is the server's own hard ceiling (property range is 4-12) — needed for
    # the AFK bot's mob farm to tick reliably, not just render further.
    tickDistance: 12
    # 64 chunks: a common "safe max" most Bedrock platforms can actually
    # exercise (weaker mobile/console clients cap well below the ~96 ceiling
    # some high-end Windows clients can ask for), so it avoids reserving
    # chunk-cache memory for requests that will never come from those
    # devices. Costs client bandwidth/server chunk-cache memory, not
    # simulation — that's tickDistance's job.
    viewDistance: 64
    maxPlayers: 20
    playerIdleTimeout: 0

    # LAN-only. HAProxy terminates every frontend in TCP mode and cannot proxy
    # UDP, baseline Pod Security forbids hostPort, and no LoadBalancer provider
    # is deployed — so a NodePort is the only route in.
    #
    # serverPort matches nodePort deliberately: the chart's own guidance is
    # that they must be equal for clients to display a ping time.
    serviceType: NodePort
    serverPort: 31132
    nodePort: 31132

    # Bedrock answers unconnected pings only when LAN visibility is on, and the
    # chart defaults it off. That silences the very packet mc-monitor sends, so
    # the chart's own liveness and readiness probes can never pass — the server
    # runs correctly and reports itself unhealthy forever. It also belongs on
    # for its stated purpose here: this server is LAN-only, so appearing in the
    # client's LAN list is wanted rather than a leak.
    enableLanVisibility: true

  # The container downloads the pinned server binary on first start, so the
  # chart's default liveness probe — 30s delay, then three 10s failures —
  # kills it mid-download and the pod never gets far enough to persist the
  # binary. The chart ships a startupProbe for exactly this and leaves it off
  # by default; enabling it suspends liveness until the server answers, with a
  # 10 minute budget, after which the normal probes take over unchanged.
  startupProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 60

  # mc-monitor already ships in this image and already runs the probes above
  # in its one-shot `status-bedrock` mode. `export-for-prometheus` is the same
  # binary in long-running Prometheus-exporter mode — reusing the image means
  # no second image to pin or pull for player-count/reachability metrics.
  #
  # There is no `serve-bedrock` subcommand — that was a guess that shipped
  # without checking `mc-monitor help`, and it crash-looped the sidecar
  # (confirmed live: `mc-monitor` prints its usage banner and exits non-zero
  # on an unrecognized subcommand). `export-for-prometheus` is the real name.
  sidecarContainers: |
    - name: mc-monitor
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
      command:
        - mc-monitor
        - export-for-prometheus
        - -bedrock-servers
        - 127.0.0.1:{{ .Values.minecraftServer.serverPort }}
        - -port
        - "8080"
      ports:
        - name: metrics
          containerPort: 8080
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

  persistence:
    storageClass: truenas-iscsi
    dataDir:
      enabled: true
      Size: 5Gi
      accessModes:
        - ReadWriteOnce

backup:
  enabled: true
  # Nightly. The world is small and the hold window is seconds, so frequency is
  # cheap; the constraint is retention space, not runtime.
  schedule: "0 4 * * *"
  # bitnami/kubectl was retired from Docker Hub and no longer pulls at all.
  # alpine/k8s carries kubectl plus the bash and coreutils this job needs.
  #
  # Tracks the cluster's minor version. kubectl supports one minor of skew
  # either side of the API server, and this job drives the server's save
  # protocol through exec and reads the manifest back off the pod log — if a
  # skewed client ever misbehaves it does so on the one path that protects the
  # world, and it does so silently.
  image: alpine/k8s:1.36.2
  # Archives live on the file tier, not the block class the world uses.
  storageClass: truenas-nfs
  size: 20Gi
  keep: 14
  # Floor for a plausible archive. The world is ~590 MB raw and compresses to
  # roughly 700 MB with the rest of the level, so anything under 100 MB means
  # the copy went wrong — which is the failure the VM's backup hid by writing
  # nothing at all and reporting success.
  minBytes: "104857600"

  # Publishes the platform's job-output freshness contract by reading the
  # archive directory, so "the job produced nothing" is a metric rather than
  # something a human has to go and look for.
  exporter:
    enabled: true
    # busybox for its httpd applet: the exporter serves one static file that a
    # shell loop rewrites, so nothing heavier earns its place here.
    image: busybox:1.37
    port: 9101
    interval: 60s
    refreshSeconds: 60
    # Two nights. The CronJob rules already page within about an hour of a run
    # that failed, so this is the slower backstop that catches the cases those
    # rules cannot see — a job that completes successfully having written
    # nothing, or one that is never scheduled at all. Set below 24h it would
    # simply restate the schedule and double-page every failure.
    maxAgeSeconds: 172800

volumeRecovery:
  # The server's volume has twice remounted read-only underneath a running pod
  # after a transient error on the iSCSI path. Kubernetes cannot recover from
  # that on its own: the kubelet restarts the container, the entrypoint runs
  # again against the same mount, and it fails again -- so the pod sits in
  # CrashLoopBackOff indefinitely. Deleting the pod is what unpublishes and
  # republishes the volume, and nothing does that automatically.
  #
  # A liveness probe cannot substitute. Probes restart containers, which is
  # precisely the action that does not work here.
  enabled: true

  # Five minutes bounds the outage without polling hard. The last occurrence
  # ran thirteen minutes and was noticed only by chance.
  schedule: "*/5 * * * *"
  image: alpine/k8s:1.36.2

  # Deletion is gated on this exact line rather than on "not ready", so a pod
  # failing for a reason deletion cannot fix is left in its crash loop where it
  # stays visible instead of being recreated forever.
  signature: "Read-only file system"

  # A slow first start is not a fault: the server downloads its binary and the
  # chart allows ten minutes for it. Requiring repeated restarts as well as the
  # signature keeps this from firing on a pod that is merely still starting.
  minRestarts: 2

  # Ceiling for a single run, which normally finishes in about three seconds.
  # Exists so a run that hangs fails visibly instead of suspending recovery:
  # concurrencyPolicy is Forbid, so one stuck job means no further attempts.
  timeoutSeconds: 120

restore:
  # On by default so the mechanism -- CronJob, RBAC, scratch PVC -- exists
  # alongside the workload rather than being something a human has to
  # remember to add when disaster strikes. It never runs on its own: the
  # CronJob's own manifest hardcodes suspend: true independent of this flag,
  # so nothing set here can make it fire on a schedule. Disabling it removes
  # the mechanism entirely, including the idle scratch PVC's NAS footprint.
  enabled: true

  # No default. A restore names which archive it wants back, and a
  # chart-supplied default would let `kubectl create job --from=cronjob`
  # silently restore whatever this file last said on some unrelated run. The
  # job refuses to start while this is empty.
  archiveName: ""

  # Same image family as the other two jobs in this chart, and the same
  # kubectl-skew reasoning the backup CronJob documents -- this job also
  # drives the server StatefulSet through the API.
  image: alpine/k8s:1.36.2

  # Refuses to overwrite an existing level directory on the scratch PVC
  # unless a human sets this for a second attempt. A restore that silently
  # clobbers a scratch copy someone was still comparing against is the same
  # failure shape as a backup that silently overwrites a good archive.
  overwriteScratch: false

  # Generous against extracting a ~700 MB archive plus up to five minutes
  # spent waiting for the server pod to terminate; a run that hangs past
  # this is wedged, not slow.
  timeoutSeconds: 1800

  scratchPVC:
    # Block, matching the world's own class. A restore that lands on a
    # different storage family cannot be promoted onto the world PVC by a
    # plain copy later -- that conversion has never been exercised, and nothing
    # here should be read as a claim that it would work.
    storageClass: truenas-iscsi
    size: 5Gi

bot:
  # Off until the account behind it exists. Enabling this before the one-time
  # device-code login has been completed gets a pod that cannot authenticate
  # and says so on a loop; the image tag below also has to have been published
  # first, or the pod simply fails to pull.
  #
  # Turning it on is the deliberate second half of a two-step bootstrap, not
  # something to flip alongside an unrelated change.
  enabled: true

  image:
    repository: ghcr.io/jdwillmsen/minecraft-afk-bot
    # Pinned for the same reason the server version is: this image bakes in the
    # protocol data for exactly one Bedrock version, so the tag and the server
    # version move together rather than independently.
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # Not the gamertag other players see — Xbox Live supplies that. This is the
  # key the token cache is filed under, so changing it orphans the cached
  # credentials and forces another interactive login.
  username: fwb-afk-bot

  # Only governs how many chunks the server sends this client. Simulation is
  # bounded by the server's own tickDistance, so a small value costs bandwidth
  # and nothing else — it does not shrink the area the bot's presence keeps
  # ticking.
  viewDistance: 4

  # A single idle UDP session and a JSON log line per chat message — 500m was
  # never load-driven, and it silently ate the CPU headroom the bedrock
  # resources comment above already reasoned through (7-core bedrock + the
  # exporter's 100m sliver = 7100m, meant to leave room for the 1-core backup
  # CronJob and the 500m volume-recovery CronJob alongside it). This bot was
  # added after that budget was set and nothing revisited it: steady-state
  # usage hit 7700m/8000m, leaving only 300m — not enough for volume-recovery
  # (500m) to ever schedule, and it failed every 5-minute run until this
  # fixed it (observed live 2026-08-21, JDWLABS-334).
  #
  # 150m matches the bot's actual idle-client workload with real margin, and
  # restores ~600m of headroom at steady state. Does not fully cover the rare
  # case of the backup CronJob (1000m) and a volume-recovery tick (500m)
  # landing in the same few seconds — that residual gap needs either a
  # larger quota tier or shrinking bedrock's own limit, both bigger tradeoffs
  # than this ticket's scope.
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 150m

  persistence:
    # File tier, not block: the cache is a few small JSON files with none of
    # the locking semantics that put the world on iSCSI.
    storageClass: truenas-nfs
    size: 1Gi
