{{- if and .Values.map.enabled .Values.map.checks.secret.create }}
# What the browser checks exchange, on the map's internal port, for a session
# that can read the map and do nothing else.
#
# Generated in the cluster, like the map's internal token and for the same
# reason: both ends of it are in this chart and nobody ever needs to know its
# value. Nothing in this repository, in Vault or in anyone's shell history
# holds it, and there is no document for a person to create first.
#
# CreatedOnce, because the map reads it at startup: a periodic refresh would
# mint a new one under a running map, and every run of the checks would be
# refused until the map happened to restart.
#
# Rotated in git, by raising map.checks.secret.generation. The number is part
# of the Secret's name, so a new one is generated beside the old, the map and
# the job are pointed at it and restarted by the change to their pod
# templates, and the old ExternalSecret is pruned with the Secret it owns.
# Sessions are signed with a key derived from the secret, so that is also how
# the checks' access is taken back.
#
# One wave ahead of everything else, so that ArgoCD has seen the Secret
# exist before it rolls the map onto it. The map reads the Secret once, at
# start, and is told it is optional so that it can never wait on it: a map
# that started first would run with the exchange off until something
# restarted it.
#
# Rendered by its own switch and ahead of anything that reads it, so that it
# can be seen Synced first. A workload wired to a secret in the commit that
# first asks for it is how this chart got its 40-hour outage
# (docs/incidents/2026-09-06-fwb-console-bridge-secret.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "map.checks.secret.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # 48 characters of 62, which no rate of guessing finds. The exchange has
  # no lock for that reason: nothing has to be kept out by one.
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - {{ include "map.checks.secret.key" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "map.checks.secret.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "map.checks.secret.name" . }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "map.checks.secret.name" . }}
{{- end }}
