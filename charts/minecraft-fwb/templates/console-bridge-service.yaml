# The console-bridge sidecar lives in the server's own StatefulSet pod
# (minecraft-bedrock chart's sidecarContainers), so this selects that pod by
# its existing app label rather than one this chart owns — same pattern as
# server-metrics.yaml's mc-monitor Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "consoleBridge.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "consoleBridge.name" . }}
spec:
  selector:
    app: {{ include "backup.serverStatefulSet" . }}
  ports:
    - name: bridge-http
      port: {{ .Values.consoleBridge.service.port }}
      targetPort: bridge-http
