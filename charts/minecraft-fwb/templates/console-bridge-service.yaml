# The console-bridge sidecar lives in the server's own StatefulSet pod
# (minecraft-bedrock chart's sidecarContainers), so this selects that pod by
# its existing app label rather than one this chart owns — same pattern as
# server-metrics.yaml's mc-monitor Service.
#
# Gated with the sidecar rather than with the ExternalSecret: a Service whose
# selector matches a sidecar that is not rendered would resolve to a port
# nothing is listening on, which is a slower and more confusing failure than
# not existing.
#
# Reads the same `global` flag the sidecar does rather than a switch of its
# own. A second flag that merely has to agree with the first is a way to render
# half of this feature, which is the shape of failure this whole change exists
# to remove.
{{- if .Values.global.consoleBridge.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "consoleBridge.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "consoleBridge.name" . }}
spec:
  selector:
    app: {{ include "backup.serverStatefulSet" . }}
  ports:
    - name: bridge-http
      port: {{ .Values.consoleBridge.service.port }}
      targetPort: bridge-http
---
# The bridge's own counters, unscraped until it started pausing world saving
# for the map's snapshots: whether a snapshot's `save resume` was confirmed is
# only visible here, and the alert on it lives with the map.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "consoleBridge.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "consoleBridge.name" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "consoleBridge.name" . }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: bridge-http
      path: /metrics
      interval: 60s
{{- end }}
