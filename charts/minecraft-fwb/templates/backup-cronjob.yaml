{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # No retries. A failed backup must stay failed and visible: a retry that
      # eventually succeeds hides the fact that the world was unprotected in
      # between, which is precisely how the mechanism this replaces went
      # unnoticed for months.
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "backup.name" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          # Scheduling must not depend on the server being up. A *required*
          # podAffinity on the server pod reads as "run beside the server", but
          # it means "run only if a server pod exists" — with the StatefulSet
          # scaled to zero, or its pod crashlooping into Terminating, nothing
          # matches and the backup never leaves Pending. The world went
          # unprotected during the one incident it needed protecting from, and
          # the job could not even start to report why.
          #
          # So the hard constraint is the node set the world volume can attach
          # to, and co-location with the server is only a preference. Both
          # volumes are ReadWriteOnce: when the server is running its node
          # already holds the world, and the weight makes the scheduler pick
          # that node out of the two. If pressure pushes the job to the other
          # node anyway, the mount fails and the job fails loudly — which is a
          # far better outcome than never being scheduled at all.
          affinity:
            # Taken from the server's own values rather than restated, so the
            # two cannot drift apart into a job that is pinned away from the
            # only nodes its volume can attach to.
            nodeAffinity:
{{- toYaml (index .Values "minecraft-bedrock" "affinity" "nodeAffinity") | nindent 14 }}
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app: {{ .Release.Name }}-minecraft-bedrock
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: 128Mi
                  cpu: 100m
                limits:
                  memory: 512Mi
                  cpu: "1"
              env:
                - name: SERVER_POD
                  value: {{ include "backup.serverPod" . }}
                - name: LEVEL_NAME
                  value: {{ index .Values "minecraft-bedrock" "minecraftServer" "levelName" | quote }}
                - name: MIN_BYTES
                  value: {{ .Values.backup.minBytes | quote }}
                - name: KEEP
                  value: {{ .Values.backup.keep | quote }}
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
                  STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
                  STAGE="$(mktemp -d)"
                  ARCHIVE="/backup/fwb-${STAMP}.tar.gz"

                  # Quiescing the server is an optimisation, not a correctness
                  # requirement. Bedrock's LevelDB is crash-consistent: it
                  # replays its write-ahead log on open, which is the same
                  # recovery path a power cut would take. A copy taken without
                  # `save hold` is therefore restorable; it is merely a little
                  # further behind than a held one.
                  #
                  # A backup that is slightly less quiesced is worth vastly
                  # more than a backup that did not happen, so the server is
                  # asked to hold when it can and skipped when it cannot.
                  QUIESCED=0

                  # Always resume, even if the copy fails partway. Leaving the
                  # server held would silently stop it persisting anything.
                  resume() { kubectl exec -n "$NS" "$SERVER_POD" -- send-command save resume >/dev/null 2>&1 || true; }

                  server_ready() {
                    local phase ready
                    phase="$(kubectl get pod -n "$NS" "$SERVER_POD" -o jsonpath='{.status.phase}' 2>/dev/null)" || return 1
                    ready="$(kubectl get pod -n "$NS" "$SERVER_POD" \
                      -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" || return 1
                    [[ "$phase" == "Running" && "$ready" == "True" ]]
                  }

                  # Drives the server's own save protocol. Returns non-zero on
                  # any hitch so the caller can fall back rather than abort:
                  # every failure in here is a reason to take a colder copy,
                  # never a reason to produce no copy.
                  quiesced_copy() {
                    # RETURN covers every way this function gives up; EXIT
                    # covers the shell being killed while the server is still
                    # held, which would otherwise leave it unable to persist
                    # anything at all. resume is idempotent and swallows its
                    # own errors, so both firing is harmless.
                    trap resume RETURN
                    trap resume EXIT
                    echo "holding saves"
                    kubectl exec -n "$NS" "$SERVER_POD" -- send-command save hold || return 1

                    # save query reports "ready to be copied" followed by a
                    # comma-separated file:length manifest. Poll until it does.
                    local manifest="" entry f len count=0
                    for _ in $(seq 1 30); do
                      sleep 3
                      kubectl exec -n "$NS" "$SERVER_POD" -- send-command save query >/dev/null || return 1
                      sleep 2
                      manifest="$(kubectl logs -n "$NS" "$SERVER_POD" --tail=20 \
                        | grep -A1 'ready to be copied' | tail -1 | tr -d '\r')" || true
                      [[ "$manifest" == *":"* ]] && break
                      manifest=""
                    done
                    [[ -n "$manifest" ]] || return 1

                    # Each entry is path:length. The length is the number of
                    # bytes that are actually valid — LevelDB keeps appending,
                    # so a file on disk can be longer than its committed
                    # contents. Copying the whole file instead of truncating to
                    # this length is what produces a backup that fails to
                    # restore.
                    # Read from a process substitution rather than a pipe: a
                    # piped while-loop runs in a subshell, where a failed copy
                    # would be swallowed — producing a short archive that still
                    # looks like a success.
                    while read -r entry; do
                      entry="$(echo "$entry" | xargs)"
                      [[ -z "$entry" ]] && continue
                      f="${entry%%:*}"
                      len="${entry##*:}"
                      mkdir -p "$STAGE/$(dirname "$f")"
                      head -c "$len" "/data/worlds/$f" > "$STAGE/$f" || return 1
                      count=$((count + 1))
                    done < <(echo "$manifest" | tr ',' '\n')
                    echo "copied $count files under hold"
                    [[ "$count" -ge 3 ]]
                  }

                  # A cold copy reads the level directory straight off the
                  # volume with no server involved, so it works while the pod
                  # is absent, crashlooping, or wedged. Scoped to the active
                  # level so both paths produce the same archive layout and a
                  # restore does not care which one ran.
                  cold_copy() {
                    if [[ ! -d "/data/worlds/$LEVEL_NAME" ]]; then
                      echo "FATAL: /data/worlds/$LEVEL_NAME does not exist, there is nothing to archive" >&2
                      return 1
                    fi
                    cp -a "/data/worlds/$LEVEL_NAME" "$STAGE/"
                    local count
                    count="$(find "$STAGE/$LEVEL_NAME" -type f | wc -l)"
                    echo "copied $count files cold"
                    [[ "$count" -ge 3 ]]
                  }

                  if server_ready && quiesced_copy; then
                    QUIESCED=1
                  else
                    # Deliberate: degrade, do not abandon. This branch is the
                    # whole point of the job — it is reached exactly when the
                    # server is in trouble, which is when the world is most
                    # worth having a copy of. The degradation is published as a
                    # metric rather than swallowed, so a run of nights taken
                    # without a hold is visible instead of assumed.
                    echo "WARNING: server unavailable or hold protocol failed, falling back to a cold copy" >&2
                    rm -rf "${STAGE:?}/"* 2>/dev/null || true
                    cold_copy
                  fi
                  # The server is no longer held either way past this point.
                  trap - EXIT

                  # save query lists world files only, so a backup built purely
                  # from it restores the world with a DEFAULT allowlist — every
                  # permitted player silently gone. For a server reachable
                  # beyond the LAN that is an access-control failure, not an
                  # inconvenience, so the player-facing config is copied too.
                  # server.properties is deliberately excluded: the chart owns
                  # it through env vars, and restoring a stale copy would fight
                  # GitOps on every setting.
                  for f in allowlist.json permissions.json; do
                    if [[ -f "/data/$f" ]]; then
                      cp "/data/$f" "$STAGE/$f"
                      echo "included $f ($(stat -c %s "/data/$f") bytes)"
                    else
                      echo "WARNING: /data/$f absent, not in this archive" >&2
                    fi
                  done

                  tar czf "$ARCHIVE" -C "$STAGE" .
                  rm -rf "$STAGE"

                  SIZE="$(stat -c %s "$ARCHIVE")"
                  echo "archive $ARCHIVE is $SIZE bytes (quiesced=$QUIESCED)"

                  # An archive that exists but is empty or absurdly small is the
                  # failure mode that went unnoticed on the VM for months. Treat
                  # it as a failure rather than a success with a small file.
                  if [[ "$SIZE" -lt "$MIN_BYTES" ]]; then
                    echo "FATAL: archive is $SIZE bytes, below the $MIN_BYTES floor" >&2
                    rm -f "$ARCHIVE"
                    exit 1
                  fi

                  # Written only after the size check, so the sidecar file
                  # exists if and only if the archive beside it passed
                  # verification. The exporter reads it to publish whether the
                  # newest archive was taken with the server held.
                  echo "quiesced=$QUIESCED" > "${ARCHIVE}.meta"

                  # Both globs match the scheduled naming only —
                  # fwb-<8 digits>T<6 digits>Z — never fwb-emergency-*. Manual
                  # rescue archives must survive retention, and must not count
                  # towards freshness either: a hand-made copy from weeks ago
                  # sitting in this directory would otherwise make a dead
                  # CronJob look like a healthy one.
                  # shopt -s nullglob so an empty backup dir does not make the
                  # glob expand to a literal and trip set -e on the first run.
                  shopt -s nullglob
                  ARCHIVES=(/backup/fwb-????????T??????Z.tar.gz)
                  if [[ ${#ARCHIVES[@]} -gt $KEEP ]]; then
                    ls -1t /backup/fwb-????????T??????Z.tar.gz | tail -n +$((KEEP + 1)) | while read -r old; do
                      rm -f "$old" "${old}.meta"
                    done
                  fi
                  echo "backup complete, ${#ARCHIVES[@]} archives on disk before trim"
              volumeMounts:
                - name: world
                  mountPath: /data
                - name: backup
                  mountPath: /backup
          volumes:
            - name: world
              persistentVolumeClaim:
                claimName: datadir-{{ .Release.Name }}-minecraft-bedrock-0
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "backup.name" . }}
{{- end }}
