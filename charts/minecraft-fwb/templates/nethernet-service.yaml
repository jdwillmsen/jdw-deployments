{{- if .Values.netherNet.enabled }}
# The route in for NetherNet, alongside (not instead of) the subchart's UDP
# Service. Bedrock 1.26.51 made NetherNet the only transport retail clients
# will use; RakNet still serves library clients and the server-list ping, so
# the subchart's Service keeps its job and this one carries players.
#
# Two protocols, two shapes:
#
#   - signaling is HTTP over TCP on the server's own server-port, published on
#     a different nodePort than it listens on. A nodePort is allocated per
#     number for the whole cluster and not per protocol, so it cannot reuse
#     the 31132 the subchart's UDP Service already holds -- the apiserver
#     rejects that outright.
#   - gameplay is UDP, negotiated per client from the range pinned by
#     server-udp-ports in server.properties. Every port in that range needs
#     its own Service entry, because a Service port is a single number --
#     there is no range form.
#
# publishNotReadyAddresses stays on although the pod is Ready today (the
# subchart's `mc-monitor status-bedrock` probes run in `auto` mode and pass on
# NetherNet). Readiness here is a single 1s exec with 3 failures, so one slow
# tick would otherwise empty the endpoints and black-hole every player, which
# is a worse outcome than routing to a pod for a few seconds too long. See
# README, "NetherNet transition".
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netherNet.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "backup.serverStatefulSet" . }}
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector:
    app: {{ include "backup.serverStatefulSet" . }}
  ports:
    - name: signaling
      port: {{ .Values.netherNet.signalingPort }}
      targetPort: {{ .Values.netherNet.signalingPort }}
      nodePort: {{ .Values.netherNet.signalingNodePort }}
      protocol: TCP
{{- range untilStep (int .Values.netherNet.gameplayPorts.start) (int (add1 .Values.netherNet.gameplayPorts.end)) 1 }}
    - name: gameplay-{{ . }}
      port: {{ . }}
      targetPort: {{ . }}
      nodePort: {{ . }}
      protocol: UDP
{{- end }}
{{- end }}
