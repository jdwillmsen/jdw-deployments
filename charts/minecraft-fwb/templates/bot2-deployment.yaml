{{- if .Values.bot2.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bot2.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "bot2.name" . }}
spec:
  # Overridable so scaling to 0 for a manual account takeover — see README's
  # "Relocating a bot" — goes through git rather than a raw `kubectl scale`,
  # which selfHeal would revert on its next resync. Only this Deployment is
  # gated on replicas; the PVC stays gated on `enabled` alone so the token
  # cache survives a scale-to-0.
  #
  # No `| default 1` here deliberately: Sprig's `default` treats 0 as unset
  # and would silently coerce a real 0 back to 1, defeating the override it
  # exists for. values.yaml sets replicas: 1 explicitly instead.
  replicas: {{ .Values.bot2.replicas }}
  # No rollback history worth keeping for a single-container bot image — the
  # chart pins the tag anyway, so a prior ReplicaSet buys nothing.
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: the token cache is ReadWriteOnce, and two
  # bots signed in as the same account would fight over both the volume and
  # the server session.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "bot2.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "bot2.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        # bot2, not bot: the Loki pipeline ships no pod label, so the
        # container name is the only stream label separating the two bots'
        # otherwise-identical chat logs — with both named "bot" every chat
        # line appears twice in any log query and nothing can tell them apart.
        - name: bot2
          image: "{{ .Values.bot2.image.repository }}:{{ .Values.bot2.image.tag }}"
          imagePullPolicy: {{ .Values.bot2.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "bot.serverHost" . }}
            # The in-cluster Service publishes the server on its own port
            # rather than 19132, and the chart keeps serverPort and nodePort
            # equal so clients display a ping time.
            - name: MC_PORT
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: MC_USERNAME
              value: {{ .Values.bot2.username | quote }}
            - name: MC_VIEW_DISTANCE
              value: {{ .Values.bot2.viewDistance | quote }}
            {{- if .Values.bot2.answer.enabled }}
            {{ fail "bot2.answer.enabled must stay false: bot2 has none of bot's MC_LLM_*/MC_BOT_NAMES wiring, so enabling it here would answer bot's replies with no loop guard (see values.yaml's bot2.answer comment). A second answering bot needs its own real llm/botNames block, not this flag." }}
            {{- end }}
            # See values.yaml's bot2.answer comment — this bot never answers,
            # so it needs no MC_LLM_* / MC_BOT_NAMES wiring at all. The guard
            # above makes that a template-render failure, not just a default.
            - name: MC_ANSWER_ENABLED
              value: {{ .Values.bot2.answer.enabled | quote }}
          resources:
            {{- toYaml .Values.bot2.resources | nindent 12 }}
          volumeMounts:
            - name: auth
              mountPath: /data
            # The root filesystem is read-only, and node writes to a temp dir
            # on paths that are not obvious from the source.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: {{ include "bot2.name" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
