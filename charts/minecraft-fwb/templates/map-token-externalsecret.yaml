{{- if .Values.map.enabled }}
# The credential the agent presents to the map's internal API when it reports
# who typed a login code. Whoever holds it can log in to the map as any
# player, so it is a secret of its own, held by the map and the agent and by
# nothing else.
#
# Generated in the cluster and not read from Vault: both ends of it are in
# this chart, nobody ever needs to know its value, and so there is no
# document for a person to create first.
#
# CreatedOnce, because a periodic refresh would mint a new token under two
# running pods that read it at startup, and they would stop agreeing until
# both restarted. To rotate, delete the Secret and restart the map and the
# agent together.
#
# Rendered whenever the map is, including before anything reads it, so that
# it can be seen Synced first. A workload wired to a secret in the commit
# that first asks for it is how this chart got its 40-hour outage
# (docs/incidents/2026-09-06-fwb-console-bridge-secret.md).
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "map.token.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - {{ include "map.token.key" . }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "map.token.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ include "map.token.name" . }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "map.token.name" . }}
{{- end }}
