{{- if .Values.census.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "census.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.census.schedule | quote }}
  concurrencyPolicy: Forbid
  # The schedule keeps this clear of both neighbours that drive the same
  # server's save protocol -- the backup, which may still be running an hour
  # after its 04:00 start, and the version check, which can be restarting the
  # server until 05:25. That separation only holds while runs start on time.
  #
  # Left unset, the controller starts the most recent missed run of *each*
  # CronJob as soon as it can reach the API again: an outage spanning
  # 03:50-06:00 has the backup's 04:00 run and this one admitted in the same
  # reconcile. Both issue save hold, and whichever finishes first fires its own
  # resume trap while the other is still copying -- a world the server was
  # writing mid-copy, which is the one state nothing downstream can detect and
  # the whole reason this job holds at all. concurrencyPolicy is per-CronJob
  # and cannot see the backup.
  #
  # Ten minutes is longer than any scheduling delay this controller has shown
  # and far shorter than the gap to either neighbour, so a run later than that
  # is skipped outright. A skipped night is not silent: the cluster's
  # CronJobHasNotSucceededRecently fires at 24h without a success.
  startingDeadlineSeconds: {{ .Values.census.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.census.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.census.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ .Values.census.ttlSecondsAfterFinished }}
      activeDeadlineSeconds: {{ .Values.census.timeoutSeconds }}
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "census.name" . }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          # Same reasoning as the backup job: a *required* podAffinity on the
          # server reads as "run beside the server" but means "run only if a
          # server pod exists", and the census is most worth reading when the
          # server is unhealthy. The hard constraint is the node set the world
          # volume can attach to; co-location is a preference.
          affinity:
            nodeAffinity:
{{- toYaml (index .Values "minecraft-bedrock" "affinity" "nodeAffinity") | nindent 14 }}
            # A preference, for the reason above. It is also what keeps the
            # ReadWriteOnce world claim attachable if the server's node set is
            # ever widened: RWO admits many pods on one node and none across
            # two, and the node set above admitting exactly one node today is a
            # property of someone else's values block.
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app: {{ .Release.Name }}-minecraft-bedrock
          initContainers:
            - name: snapshot
              image: {{ .Values.census.image }}
              # version-check-cronjob.yaml runs kubectl under exactly this
              # securityContext, which is the evidence that an in-cluster
              # client needs no writable root here. If a first run does
              # complain about a cache directory, the fix is an emptyDir at
              # /tmp with HOME pointing at it -- not dropping this flag.
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SERVER_POD
                  value: {{ include "backup.serverPod" . }}
                # The server pod runs three containers -- the game server,
                # mc-monitor and the console bridge -- and kubectl silently
                # takes containers[0] when none is named. That ordering is a
                # property of the vendored subchart plus this chart's sidecar
                # list, asserted nowhere, and getting it wrong is not loud: the
                # manifest poll would simply never match, every night, while
                # the run still exits 0 through the archive fallback.
                #
                # The subchart names the container after the workload, so this
                # is the same string as the StatefulSet -- version-check-cronjob.yaml
                # names its own server container from the same helper.
                - name: SERVER_CONTAINER
                  value: {{ include "backup.serverStatefulSet" . }}
              command: ["/bin/bash", "/script/snapshot.sh"]
              resources:
{{- toYaml .Values.census.resources | nindent 16 }}
              volumeMounts:
                - name: world
                  mountPath: /data
                  # The census reads worlds; it must never be able to write
                  # one. The hold protocol only ever reads from here.
                  readOnly: true
                - name: snapshot
                  mountPath: /snapshot
                - name: script
                  mountPath: /script
{{- if .Values.census.metrics.enabled }}
            # Publishes the census's counts where something other than a job
            # log can read them.
            #
            # A sidecar rather than a step, because there is nowhere to put a
            # step: the census image is distroless, so it has no shell and no
            # kubectl, and a Job has no "after the container exits" hook. This
            # runs beside it, watches the file the census writes at the end of
            # a successful run, and publishes it.
            #
            # restartPolicy Always makes this a native sidecar: it starts
            # before the census container and the kubelet terminates it once
            # that container exits, so it cannot hold the Job open. The trap
            # below is what makes that termination safe -- SIGTERM arrives
            # right after the census finishes, which is exactly when the file
            # it wrote may not have been picked up yet.
            - name: metrics-publish
              image: {{ .Values.census.image }}
              restartPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 128Mi
                  cpu: 100m
              env:
                - name: METRICS_CM
                  value: {{ include "census.metricsConfigMap" . }}
                - name: METRICS_FILE
                  value: /tmp/metrics.txt
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -uo pipefail
                  NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

                  emit() { echo "{\"event\":\"$1\",\"detail\":\"${2:-}\"}"; }

                  # Idempotent, and the only thing this container does. A
                  # republish of an identical payload is a no-op apply, which
                  # is why both the watch loop and the shutdown path can call
                  # it without coordinating.
                  publish() {
                    [[ -s "$METRICS_FILE" ]] || return 1
                    kubectl create configmap "$METRICS_CM" -n "$NS" \
                      --from-file=metrics.txt="$METRICS_FILE" \
                      --dry-run=client -o yaml | kubectl apply -n "$NS" -f - >/dev/null
                  }

                  # The census writes its payload immediately before exiting,
                  # and the kubelet terminates this container as soon as it
                  # does. Without a last attempt on the way out, a run whose
                  # file lands inside the final poll interval would publish
                  # nothing -- and the failure would look exactly like a census
                  # that never produced one.
                  shutting_down=""
                  on_term() {
                    shutting_down="yes"
                    if publish; then
                      emit published "on shutdown"
                    else
                      emit skipped "no payload to publish; the census did not complete"
                    fi
                    exit 0
                  }
                  trap on_term TERM INT

                  while [[ -z "$shutting_down" ]]; do
                    if publish; then
                      emit published "$(wc -c <"$METRICS_FILE") bytes"
                      # Nothing more will be written this run: the census
                      # writes the payload once, at the end. Waiting for
                      # SIGTERM from here costs nothing and keeps the publish
                      # path to exactly one shape.
                      while true; do sleep 5; done
                    fi
                    sleep 2
                  done
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
{{- end }}
          containers:
            - name: census
              image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # Both paths every run. The init container writes a snapshot
              # when it could take one and nothing when it could not, so the
              # binary picks: a fresh world if there is one, last night's
              # archive otherwise, and it says which on the report's own
              # provenance line.
              command: ["/census"]
              args:
                - "-world-dir"
                - "/snapshot"
                - "-backup-dir"
                - "/backup"
{{- if .Values.census.metrics.enabled }}
                # Written at the end of a run that produced a report, and only
                # then: a payload from a world the census refused to report
                # would put a fabricated dip on the graph. The sidecar above
                # publishes whatever lands here.
                - "-metrics-file"
                - "/tmp/metrics.txt"
{{- end }}
              resources:
{{- toYaml .Values.census.resources | nindent 16 }}
              volumeMounts:
                # Writable, despite this container only wanting to read the
                # world. LevelDB takes a lock on open and creates the LOCK
                # file to do it, even when the database is opened read-only,
                # so a read-only mount fails the scan outright:
                #   open /snapshot/FWB/db/LOCK: read-only file system
                # Confirmed on the first scheduled run. The unit tests missed
                # it because they build their snapshot in t.TempDir(), which
                # is writable -- the mount is the only place this surfaces.
                #
                # It costs nothing: the volume is an emptyDir shared with the
                # init container that filled it, and it dies with the pod.
                - name: snapshot
                  mountPath: /snapshot
                # The archive is the nightly backup on a shared PVC, and this
                # container has no business writing to it. Extraction happens
                # under /tmp, which has its own writable volume.
                - name: backup
                  mountPath: /backup
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: world
              persistentVolumeClaim:
                claimName: datadir-{{ .Release.Name }}-minecraft-bedrock-0
            - name: backup
              persistentVolumeClaim:
                claimName: {{ include "backup.name" . }}
            - name: snapshot
              emptyDir:
                sizeLimit: 2Gi
            - name: script
              configMap:
                name: {{ include "census.name" . }}-snapshot
                defaultMode: 0555
            - name: tmp
              emptyDir:
                # The archive fallback extracts a ~570MB world with os.MkdirTemp,
                # which lands in /tmp. The root filesystem is read-only, so without
                # this the fallback fails with permission denied on the one run where
                # it is needed: the server being down is both why the snapshot was
                # missed and why somebody is reading the report.
                sizeLimit: 2Gi
{{- end }}
