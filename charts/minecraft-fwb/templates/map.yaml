{{- if and .Values.map.enabled .Values.global.consoleBridge.enabled }}
# Both flags: the map's only source of world data is the console bridge's
# snapshot endpoint, so rendering it against a chart with no bridge would
# produce a pod that can only fail.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # Everything on it can be rebuilt from the server, so it is not backed up.
  # It is a volume because the rebuild is a full world copy and a full render,
  # and without one every pod restart would pay for both.
  storageClassName: {{ .Values.map.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.map.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.name" . }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # The claim is ReadWriteOnce, so a replacement cannot start until the old
  # pod has let go of it. The map being absent for a restart costs nothing.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "map.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "map.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: map
          image: "{{ .Values.map.image.repository }}:{{ .Values.map.image.tag }}"
          imagePullPolicy: {{ .Values.map.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.map.port }}"
            - name: INTERNAL_ADDR
              value: ":{{ .Values.map.internalPort }}"
            # What the agent presents when it reports a login; see
            # map-token-externalsecret.yaml.
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "map.token.name" . }}
                  key: {{ include "map.token.key" . }}
            - name: BRIDGE_URL
              value: "http://{{ include "consoleBridge.host" . }}:{{ .Values.consoleBridge.service.port }}"
            - name: BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.consoleBridge.secret.name }}
                  key: console_bridge_token
            - name: LEVEL_NAME
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "levelName" | quote }}
            - name: REFRESH_INTERVAL
              value: {{ .Values.map.refreshInterval | quote }}
            - name: QUIET_UTC
              value: {{ .Values.map.quietUTC | quote }}
            - name: RENDER_CHUNK_PROCESSORS
              value: {{ .Values.map.chunkProcessors | quote }}
            # The live layer. All five are always set, so that turning it off
            # is one value and what the pod runs with is never a default
            # nobody wrote down. None of them is an address: the stream is
            # served on the public listener behind the session, and its
            # metrics on the internal one.
            - name: LIVE_ENABLED
              value: {{ .Values.map.live.enabled | quote }}
            - name: LIVE_POLL_WAIT
              value: {{ .Values.map.live.pollWait | quote }}
            - name: LIVE_TTL
              value: {{ .Values.map.live.ttl | quote }}
            - name: LIVE_MAX_ENTITIES
              value: {{ .Values.map.live.maxEntities | quote }}
            - name: LIVE_KEEPALIVE
              value: {{ .Values.map.live.keepalive | quote }}
            - name: MARKERS_ENABLED
              value: {{ .Values.map.markers.enabled | quote }}
            {{- if and .Values.map.markers.waypoints .Values.agent.enabled .Values.global.consoleBridge.enabled }}
            # The agent serves its HTTP API on its metrics port, which is the
            # address the bots already reach it at for presence.
            - name: AGENT_URL
              value: "http://{{ include "agent.name" . }}-metrics.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.agent.metrics.port }}"
            {{- end }}
            - name: ICONS_ENABLED
              value: {{ .Values.map.icons.enabled | quote }}
            {{- with .Values.map.icons.ref }}
            - name: ICONS_REF
              value: {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.map.port }}
            - name: internal
              containerPort: {{ .Values.map.internalPort }}
          # Liveness only. The page is useful while a render is running or the
          # bridge is away -- it serves the last tiles it has -- so there is no
          # state in which taking it out of the Service would help.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            {{- toYaml .Values.map.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The renderer unpacks itself here on every start.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "map.name" . }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.name" . }}
spec:
  selector:
    app: {{ include "map.name" . }}
  ports:
    - name: http
      port: {{ .Values.map.port }}
      targetPort: http
    - name: internal
      port: {{ .Values.map.internalPort }}
      targetPort: internal
---
# The only thing in this chart reachable from the internet. It attaches to
# the platform gateway, which terminates TLS with the wildcard certificate,
# and sends everything to the map's public port. The internal port is never
# a backend here: tools/tests/test-map.sh fails if it becomes one.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.name" . }}
spec:
  parentRefs:
    - name: platform-gateway
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - {{ .Values.map.host | quote }}
  rules:
    - backendRefs:
        - name: {{ include "map.name" . }}
          port: {{ .Values.map.port }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.name" . }}
spec:
  selector:
    matchLabels:
      app: {{ include "map.name" . }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: internal
      path: /metrics
      interval: 60s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "map.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: minecraft-fwb-map
      rules:
        - alert: JdwillmsenMinecraftMapStale
          # The overworld stands in for all three dimensions: they render in
          # one cycle from one snapshot, so they go stale together, and one
          # alert per dimension would be the same page three times.
          expr: |
            (time() - mcmap_render_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}", dimension="overworld"})
              > {{ include "map.staleSeconds" . }}
          for: 10m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map has stopped refreshing
            description: >-
              The map has not finished rendering the overworld for more than
              {{ .Values.map.alert.staleAfter }}. It still serves the tiles it
              has, so the page looks fine and only its "updated" time gives it
              away. mcmap_snapshots_total by result says whether the bridge is
              refusing (busy), the copy is failing (failed), or the cycle is
              not running at all.
        - alert: JdwillmsenMinecraftMapNeverRendered
          # A gauge that was never set is absent rather than old, so the
          # staleness expression above has nothing to compare and stays quiet
          # through exactly the case of a map that never worked.
          expr: |
            absent(mcmap_render_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}", dimension="overworld"})
          for: {{ .Values.map.alert.staleAfter }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map has never rendered
            description: >-
              No overworld render has succeeded since the map pod started, or
              the pod is not being scraped. A first render on a fresh volume
              takes minutes, not {{ .Values.map.alert.staleAfter }}.
        - alert: JdwillmsenMinecraftSaveResumeOwed
          # Critical because of what it leaves behind, not how often it is
          # expected: a world whose saving stayed paused keeps every change in
          # memory until the next restart, and loses them if the pod dies
          # first.
          #
          # The gauge is 1 for the length of every snapshot, which is seconds
          # and at most the bridge's five-minute cap, so it is the minimum
          # over a window twice that long that has to be 1: owed at every
          # scrape, not owed at some scrape. No `for`, because the window is
          # already in the expression.
          expr: |
            min_over_time(mc_console_bridge_snapshot_resume_owed{namespace="{{ .Release.Namespace }}"}[10m]) == 1
          labels:
            severity: critical
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: Minecraft FWB may have world saving paused
            description: >-
              The console bridge paused saving for a map snapshot and the
              server has not confirmed the resume for ten minutes. The bridge
              keeps retrying and refuses new snapshots meanwhile. Check the
              server log for "Changes to the world are resumed"; if it is
              missing, run `save resume` from the console. The nightly backup
              also resumes saving when it finishes.
{{- if .Values.map.live.enabled }}
        - alert: JdwillmsenMinecraftMapLiveStale
          # No gate on players being online: the pack prints a heartbeat with
          # every sample, so the newest record is seconds old on an empty
          # server and silence only ever means the path broke.
          #
          # No `for`, because the age of the newest record already is a
          # duration. "Older than two minutes, for thirteen" and "older than
          # fifteen" are the same statement, and the second cannot be reset
          # by a single evaluation that found nothing to read.
          #
          # The newest time over a window, not the current sample. A map pod
          # that has just started exports zero until its first record, and
          # `time() - 0` is decades. The pod it replaced saw a record seconds
          # before it went, and max_over_time carries that across the
          # restart. `> 0` drops a series that has only ever said zero: that
          # is a layer with no record at all, which is the next rule's to
          # report, in words that fit it.
          #
          # max by (namespace) is what keeps the alert's labels off whichever
          # pod happened to report, so one outage is one alert across a map
          # restart rather than a resolve and a new page.
          expr: |
            (
              time() - max by (namespace) (
                max_over_time(mcmap_live_last_frame_timestamp_seconds{namespace="{{ .Release.Namespace }}"}[{{ .Values.map.live.alert.lookback }}]) > 0
              )
            ) > {{ include "map.liveStaleSeconds" . }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map's live players and mobs have stopped updating
            description: >-
              The map last accepted a position record from the game server
              {{ "{{ $value | humanizeDuration }}" }} ago; the pack sends one every second
              even with nobody online, and a server restart is over well inside
              {{ .Values.map.live.alert.staleAfter }}. The page shows no markers
              meanwhile and nothing else is affected. Work down the path:
              mcmap_live_frames_total and mcmap_live_polls_total by result on the map,
              mc_console_bridge_script_records_total on the bridge, then the server
              log for [Scripting] lines. charts/minecraft-fwb/README.md, "Live layer".
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#live-layer"
        - alert: JdwillmsenMinecraftMapLiveNeverStarted
          # The other half, as JdwillmsenMinecraftMapNeverRendered is to the
          # tile alert, with one difference that matters: this gauge is never
          # absent while the map is up. It is registered at start and reads
          # zero until the first record, so a bare absent() would stay quiet
          # through exactly the case of a pack that never installed. What is
          # absent is a timestamp above zero.
          #
          # This is the alert the installer's fail-open design leans on: an
          # init step that could not write the pack lets the server start and
          # says so only in its own log, and this is where that surfaces.
          #
          # The `for` is safe here in a way it is not on a flapping gauge:
          # the condition is "no record in the lookback window", which one
          # record makes false for the whole window, so it cannot oscillate.
          # It is also what keeps a rollout quiet. The rule is applied in the
          # same sync that restarts the server with the pack, when no record
          # exists yet, and the first one is minutes away.
          expr: |
            absent(
              max_over_time(mcmap_live_last_frame_timestamp_seconds{namespace="{{ .Release.Namespace }}"}[{{ .Values.map.live.alert.lookback }}]) > 0
            )
          for: {{ .Values.map.live.alert.staleAfter }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map's live layer has no data
            description: >-
              The map has not accepted a single position record from the game server
              in the last {{ .Values.map.live.alert.lookback }}, or is not being
              scraped. Either the script pack is not running in the world or its
              records are not reaching the map. The server pod's logs say which: the
              init container install-map-pack logs why it skipped, the server's pack
              stack line names "mcmap live positions" when the pack loaded, and
              [Scripting] MCMAP1 lines are the records themselves. The pack only loads
              when the server starts. charts/minecraft-fwb/README.md, "Live layer".
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#live-layer"
{{- end }}
{{- end }}
