{{- if .Values.agent.database.credentials.create }}
# The prd Postgres credentials the agent's Stage 3 work will use.
#
# Rendered before anything consumes it, deliberately. That ordering is the
# whole lesson of docs/incidents/2026-09-06-fwb-console-bridge-secret.md: a
# secret was wired into a workload in the same change that first asked for it,
# the source did not exist, and the server would not start for 40 hours. A
# credential object that nothing reads is inert -- if it fails, it fails alone
# and visibly, and the code that needs it can be written against something
# already observed working.
#
# Not the Vault store the console bridge uses: CloudNativePG generates these
# credentials itself into the database namespace, so the k8s-secret-store
# mirrors that secret rather than duplicating it into Vault, where it would go
# stale the first time the cluster rotated it. Same store and same remote key
# the jdwlabs tenant already reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "agent.dbSecret.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # A minute, matching the other Postgres consumers. CNPG can rotate the app
  # role's password, and an hour of staleness is an hour of a workload holding
  # a password the database has stopped accepting.
  refreshInterval: 1m
  secretStoreRef:
    name: k8s-secret-store
    kind: ClusterSecretStore
  target:
    name: {{ include "agent.dbSecret.name" . }}
    creationPolicy: Owner
  data:
    - secretKey: PG_USERNAME
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: platform-postgresql-cluster-prd-app
        property: username
    - secretKey: PG_PASSWORD
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: platform-postgresql-cluster-prd-app
        property: password
{{- end }}
