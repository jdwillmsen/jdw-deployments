{{- if .Values.census.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "census.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "census.name" . }}
  namespace: {{ .Release.Namespace }}
rules:
  # The census drives the server's own save protocol over its console to take
  # a consistent copy, so it needs to exec into the pod and read back what
  # `save query` printed. Scoped to this namespace; nothing here is
  # cluster-wide.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # get and list stay unscoped because a list request cannot be
  # constrained by resourceNames; exec and log below are pinned to the one
  # pod this job has any business touching.
  - apiGroups: [""]
    resources: ["pods/exec"]
    resourceNames: ["{{ include "backup.serverPod" . }}"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    resourceNames: ["{{ include "backup.serverPod" . }}"]
    verbs: ["get"]
{{- if .Values.census.metrics.enabled }}
  # The metrics sidecar publishes the census counts into a ConfigMap the
  # exporter serves. create cannot be scoped by resourceName, which is the
  # same deliberately-broader grant the backup job carries for the same
  # `kubectl create --dry-run | kubectl apply` idiom; get and patch, which are
  # what an apply over an existing object needs, stay pinned to the one name.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "census.metricsConfigMap" . }}"]
    verbs: ["get", "patch", "update"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "census.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "census.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "census.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
