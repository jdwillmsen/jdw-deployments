{{- if .Values.volumeRecovery.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recovery.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "recovery.name" . }}
  namespace: {{ .Release.Namespace }}
rules:
  # Reads pod status to find the failure and the pod log to confirm which
  # failure it is, then deletes the pod. Delete is the whole point: a container
  # restart re-runs the entrypoint against the same mount, so only recreating
  # the pod gets the volume unpublished and published again.
  #
  # Namespaced, and the only thing in here worth deleting is the server pod.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "recovery.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "recovery.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "recovery.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
