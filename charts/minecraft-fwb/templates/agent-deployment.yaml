{{- if and .Values.agent.enabled .Values.global.consoleBridge.enabled }}
# Both flags, not just agent.enabled: this Deployment's only reason to
# exist is to call the console bridge, so enabling it against a chart
# rendering no bridge would produce a workload that can only fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "agent.name" . }}
spec:
  replicas: {{ .Values.agent.replicas }}
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: same reason as the AFK bots — the token
  # cache is ReadWriteOnce, and two agents signed in as the same account
  # would fight over both the volume and the server session.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "agent.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "agent.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "bot.serverHost" . }}
            - name: MC_PORT
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: MC_USERNAME
              value: {{ .Values.agent.username | quote }}
            - name: CONSOLE_BRIDGE_URL
              value: "http://{{ include "consoleBridge.host" . }}:{{ .Values.consoleBridge.service.port }}"
            - name: CONSOLE_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.consoleBridge.secret.name }}
                  key: console_bridge_token
            - name: CONSOLE_BRIDGE_TIMEOUT_MS
              value: {{ .Values.agent.bridge.timeoutMs | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.agent.metrics.port }}"
            # !online, !version and !backup read these two exporters directly.
            # Full paths, not hosts: the backup exporter serves /metrics.txt
            # while mc-monitor serves /metrics, and assembling that in code
            # would bake one exporter's quirk into the agent.
            - name: MC_MONITOR_URL
              value: "http://{{ include "mcMonitor.host" . }}:8080/metrics"
            - name: BACKUP_EXPORTER_URL
              value: "http://{{ include "backup.exporter.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:9101/metrics.txt"
            {{- if .Values.agent.database.enabled }}
            - name: PG_HOST
              value: {{ .Values.agent.database.host | quote }}
            - name: PG_PORT
              value: {{ .Values.agent.database.port | quote }}
            - name: PG_DATABASE
              value: {{ .Values.agent.database.name | quote }}
            # Username and password come from the ExternalSecret rather than
            # from values: a DSN in plain env would put the password in the
            # Deployment object, readable by anything that can get it.
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.dbSecret.name" . }}
                  key: PG_USERNAME
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.dbSecret.name" . }}
                  key: PG_PASSWORD
            {{- end }}
            {{- if .Values.agent.llm.enabled }}
            - name: LLM_BASE_URL
              value: {{ .Values.agent.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.agent.llm.model | quote }}
            - name: LLM_MAX_TOKENS
              value: {{ .Values.agent.llm.maxTokens | quote }}
            - name: LLM_TIMEOUT_MS
              value: {{ .Values.agent.llm.timeoutMs | quote }}
            - name: LLM_TOTAL_TIMEOUT_MS
              value: {{ .Values.agent.llm.totalTimeoutMs | quote }}
            - name: ANSWER_MAX_PER_MINUTE
              value: {{ .Values.agent.llm.maxPerMinute | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metrics.port }}
          # /healthz is process-liveness only; /readyz reflects the actual
          # Bedrock session state, so a stuck reconnect loop shows as
          # not-ready without the pod being killed and restarted into the
          # same stuck state.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: auth
              mountPath: /data
            # The root filesystem is read-only, matching the AFK bots.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: {{ include "agent.name" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
