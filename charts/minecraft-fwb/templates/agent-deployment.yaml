{{- if and .Values.agent.enabled .Values.global.consoleBridge.enabled }}
# Both flags, not just agent.enabled: this Deployment's only reason to
# exist is to call the console bridge, so enabling it against a chart
# rendering no bridge would produce a workload that can only fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "agent.name" . }}
spec:
  replicas: {{ .Values.agent.replicas }}
  revisionHistoryLimit: 0
  # RollingUpdate now that the token lives in Postgres rather than on a
  # ReadWriteOnce volume: a replacement can start, authenticate and be ready
  # before the incumbent leaves, so a release costs a handover rather than an
  # absence. Only the advisory lock decides which of the two is in the game --
  # the standby holds a token but never rotates it, so the two cannot fight
  # over the account the way two mounts of one claim would have.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: {{ include "agent.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "agent.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "bot.serverHost" . }}
            - name: MC_PORT
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: MC_USERNAME
              value: {{ .Values.agent.username | quote }}
            - name: CONSOLE_BRIDGE_URL
              value: "http://{{ include "consoleBridge.host" . }}:{{ .Values.consoleBridge.service.port }}"
            - name: CONSOLE_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.consoleBridge.secret.name }}
                  key: console_bridge_token
            - name: CONSOLE_BRIDGE_TIMEOUT_MS
              value: {{ .Values.agent.bridge.timeoutMs | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.agent.metrics.port }}"
            # Drops and re-establishes the Bedrock session on this interval, so
            # that "a real account can still join" is measured rather than
            # assumed between incidents. The agent leaves chat for the length
            # of a reconnect each time -- the same gap a deployment causes.
            #
            # Set unconditionally, zero included: a values file that says 0
            # means off, and omitting the variable would instead leave the
            # binary's own default in charge. Those agree today and there is
            # no reason to build a chart whose "off" depends on that.
            # int64 before quote, because Helm decodes every values number as
            # a float64 and Go renders one at or above a million in scientific
            # notation -- 3600000 becomes "3.6e+06", which the agent rejects as
            # not an integer. Under a million it happens to look fine, which is
            # how this would have shipped unnoticed at a smaller default.
            - name: SESSION_RECYCLE_MS
              value: {{ .Values.agent.sessionRecycleMs | int64 | quote }}
            # !online, !version and !backup read these two exporters directly.
            # Full paths, not hosts: the backup exporter serves /metrics.txt
            # while mc-monitor serves /metrics, and assembling that in code
            # would bake one exporter's quirk into the agent.
            - name: MC_MONITOR_URL
              value: "http://{{ include "mcMonitor.host" . }}:8080/metrics"
            - name: BACKUP_EXPORTER_URL
              value: "http://{{ include "backup.exporter.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:9101/metrics.txt"
            {{- if .Values.agent.database.enabled }}
            - name: PG_HOST
              value: {{ .Values.agent.database.host | quote }}
            - name: PG_PORT
              value: {{ .Values.agent.database.port | quote }}
            - name: PG_DATABASE
              value: {{ .Values.agent.database.name | quote }}
            # Username and password come from the ExternalSecret rather than
            # from values: a DSN in plain env would put the password in the
            # Deployment object, readable by anything that can get it.
            - name: PG_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.dbSecret.name" . }}
                  key: PG_USERNAME
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent.dbSecret.name" . }}
                  key: PG_PASSWORD
            {{- end }}
            {{- if .Values.agent.llm.enabled }}
            - name: LLM_BASE_URL
              value: {{ .Values.agent.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.agent.llm.model | quote }}
            - name: LLM_MAX_TOKENS
              value: {{ .Values.agent.llm.maxTokens | quote }}
            - name: LLM_TIMEOUT_MS
              value: {{ .Values.agent.llm.timeoutMs | quote }}
            - name: LLM_TOTAL_TIMEOUT_MS
              value: {{ .Values.agent.llm.totalTimeoutMs | quote }}
            - name: ANSWER_MAX_PER_MINUTE
              value: {{ .Values.agent.llm.maxPerMinute | quote }}
            {{- end }}
            {{- with .Values.agent.moderation.terms }}
            - name: MODERATION_TERMS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.agent.announceApi.existingSecret }}
            - name: ANNOUNCE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: {{ $.Values.agent.announceApi.secretKey | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metrics.port }}
          # /healthz is process-liveness only; /readyz reflects the actual
          # Bedrock session state, so a stuck reconnect loop shows as
          # not-ready without the pod being killed and restarted into the
          # same stuck state.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            # No auth volume: the Xbox token is a row in minecraft.auth_tokens,
            # which every replica can read at once. The file cache it replaced
            # was ReadWriteOnce, and that single-attach claim is what made a
            # warm standby impossible.
            #
            # The root filesystem is read-only, matching the AFK bots.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
