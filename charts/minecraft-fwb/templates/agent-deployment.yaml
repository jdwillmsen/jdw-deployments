{{- if .Values.agent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "agent.name" . }}
spec:
  replicas: {{ .Values.agent.replicas }}
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: same reason as the AFK bots — the token
  # cache is ReadWriteOnce, and two agents signed in as the same account
  # would fight over both the volume and the server session.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "agent.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "agent.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "bot.serverHost" . }}
            - name: MC_PORT
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: MC_USERNAME
              value: {{ .Values.agent.username | quote }}
            - name: CONSOLE_BRIDGE_URL
              value: "http://{{ include "consoleBridge.host" . }}:{{ .Values.consoleBridge.service.port }}"
            - name: CONSOLE_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.consoleBridge.secret.name }}
                  key: console_bridge_token
            - name: CONSOLE_BRIDGE_TIMEOUT_MS
              value: {{ .Values.agent.bridge.timeoutMs | quote }}
            - name: HTTP_ADDR
              value: ":{{ .Values.agent.metrics.port }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metrics.port }}
          # /healthz is process-liveness only; /readyz reflects the actual
          # Bedrock session state, so a stuck reconnect loop shows as
          # not-ready without the pod being killed and restarted into the
          # same stuck state.
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: auth
              mountPath: /data
            # The root filesystem is read-only, matching the AFK bots.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: {{ include "agent.name" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
