{{- if .Values.tickRateAlert.enabled }}
# Notices a server that is up, joinable and running at two thirds speed.
#
# Nothing did on 2026-09-16: tick rate fell 38% over two days and the first
# report of it was a player saying the world felt slow. Every check this repo
# runs passed throughout, because all of them ask whether the server answers,
# not how fast it is running.
#
# The agent has measured TPS from the server's own game clock for weeks, once
# a minute; the series was there the whole time with nothing reading it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tickRateAlert.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: minecraft-fwb-tick-rate
      rules:
        - alert: JdwillmsenMinecraftTickRateDegraded
          # The staleness clause is what makes the threshold mean anything.
          # mc_agent_server_tps is deliberately never reset on a failed
          # measurement -- it holds the last good reading -- so a console
          # bridge outage, an agent restart or the nightly restart itself
          # leaves a number that no longer describes the server. Paired with
          # the freshness timestamp, a stale reading stops matching, which
          # also resets the `for` rather than letting a frozen value age into
          # a page.
          #
          # Plain `and` rather than `and on(...)`: both series come from the
          # agent's one metrics endpoint and carry identical labels, so the
          # exact match is free and says so.
          #
          # The window lives in avg_over_time rather than in `for`, and that is
          # the whole difference between an alert and a decoration. An
          # instantaneous comparison held by `for` needs *every* evaluation
          # under the threshold, and this server's tick rate oscillates: over
          # the twelve hours to 2026-09-19 05:25 it was under 17 for 171
          # minutes, in 51 separate spans, not one of which lasted the 30 the
          # `for` required. It never fired, with the server sitting at 12-15
          # TPS. The same window as an average produced two spans over 30
          # minutes, which is what a degraded server should look like to a
          # rule.
          expr: |
            avg_over_time(mc_agent_server_tps{namespace="{{ .Release.Namespace }}"}[{{ .Values.tickRateAlert.window }}])
              < {{ .Values.tickRateAlert.threshold }}
              and
            (time() - mc_agent_tps_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}"}) < {{ .Values.tickRateAlert.freshnessSeconds }}
          # Short, because the averaging window above is already the patience.
          # This only stops a single evaluation at the boundary from paging.
          for: {{ .Values.tickRateAlert.for }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: Minecraft FWB is running below {{ .Values.tickRateAlert.threshold }} TPS
            description: >-
              Server tick rate has averaged under {{ .Values.tickRateAlert.threshold }}
              of 20 across {{ .Values.tickRateAlert.window }}, so mobs, redstone and
              farms are all running slow. A restart is the known remedy for the decay this
              server shows on Bedrock 1.26.51.1; the scheduled restart does it nightly,
              and doing it early is `send-command stop` through the server console --
              never a pod delete.
        # The measurement stopping is its own failure, and a silent one: a
        # comparison never matches a series that is no longer produced, and
        # the freshness clause above turns a stale reading into no alert at
        # all rather than into a page.
        - alert: JdwillmsenMinecraftTickRateUnmeasured
          #
          # The staleness bound is the same freshnessSeconds the rule above
          # requires, which is what leaves no band between them: any reading
          # old enough to stop the degradation alert matching is old enough to
          # start this one counting. Split values would leave a window where a
          # measurement that keeps limping back is covered by neither.
          expr: |
            absent(mc_agent_server_tps{namespace="{{ .Release.Namespace }}"})
              or
            (time() - mc_agent_tps_last_success_timestamp_seconds{namespace="{{ .Release.Namespace }}"}) > {{ .Values.tickRateAlert.freshnessSeconds }}
          for: 15m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: Minecraft FWB tick rate is not being measured
            description: >-
              Every TPS reading for the last 15 minutes has been older than
              {{ .Values.tickRateAlert.freshnessSeconds }}s, or the metric is gone
              entirely, so the degradation alert above cannot fire whatever the
              server is doing. The measurement runs over the console bridge, so
              this usually means the agent or the bridge is down rather than the
              server.
{{- end }}
