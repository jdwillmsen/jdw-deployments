{{- if .Values.census.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "census.name" . }}-snapshot
  namespace: {{ .Release.Namespace }}
data:
  # A reduction of the same sequence backup-cronjob.yaml runs, not a fork of
  # it. What is shared is hold/query/truncate; what is dropped is everything
  # that exists to produce a restorable archive.
  #
  # There is deliberately no cold-copy fallback. Where the backup prefers a
  # possibly-imperfect archive to no archive, the census prefers no snapshot
  # to a torn one: a cold copy of a live world reads cleanly and reports
  # numbers that are simply wrong, and the census then falls back to the
  # nightly archive, which is stale but true.
  #
  # Keep this in step with backup-cronjob.yaml's hold_copy(). If you change
  # the manifest parsing or the truncation here, look there too. Two things
  # here deliberately do NOT match it: every call into the server pod names
  # its container, and every copy is checked against the length the server
  # committed. Both are noted where they happen.
  snapshot.sh: |
    #!/usr/bin/env bash
    # Exits 0 when no snapshot could be taken: a failed init container stops
    # the census container ever running, which would make the archive
    # fallback unreachable. A missed snapshot is signalled by the absence of
    # snapshot-taken-at, not by an exit code.
    set -uo pipefail

    NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
    OUT=/snapshot

    # Clears the tree on the way out. A half-copied world with no marker is
    # already unreadable to the census, which keys off the marker alone -- but
    # leaving it there makes "the directory has files in it" look like a usable
    # signal to whoever reads this next, and that reading is the one the
    # marker ordering exists to rule out.
    give_up() {
      echo "census-snapshot: $1; the census will read the newest archive instead" >&2
      rm -rf "${OUT:?}/"* "${OUT:?}/".snapshot-taken-at.tmp 2>/dev/null || true
      exit 0
    }

    # Always resume, even if the copy fails partway. Leaving the server held
    # would silently stop it persisting anything at all.
    resume() { timeout 15s kubectl exec -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" -- send-command save resume >/dev/null 2>&1 || true; }

    [[ -w "$OUT" ]] || { echo "census-snapshot: $OUT is not writable" >&2; exit 1; }

    phase="$(kubectl get pod -n "$NS" "$SERVER_POD" -o jsonpath='{.status.phase}' 2>/dev/null)" || true
    ready="$(kubectl get pod -n "$NS" "$SERVER_POD" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" || true
    [[ "$phase" == "Running" && "$ready" == "True" ]] || give_up "server pod is not ready (phase=${phase:-none})"

    # EXIT alone covers every way out of this script: it is executed
    # directly rather than sourced, and every failure path leaves through
    # give_up's exit. The backup job pairs this with a RETURN trap because
    # its copy lives in a function left via return; here that trap would
    # never fire, and a line that reads as a safety net but is not is worse
    # than no line.
    trap resume EXIT
    timeout 15s kubectl exec -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" -- send-command save hold || give_up "save hold was refused"

    # The world is as of the hold, not as of whenever the copy happened to
    # finish, and the provenance line in the report describes the state that
    # was captured.
    stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

    # save query reports "ready to be copied" followed by a comma-separated
    # file:length manifest. Poll until it does.
    manifest=""
    for _ in $(seq 1 30); do
      sleep 3
      timeout 15s kubectl exec -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" -- send-command save query >/dev/null || give_up "save query failed"
      sleep 2
      # Bounded like every exec around it, and for a worse reason: a kubelet
      # that stops answering log proxies blocks this read *after* save hold
      # succeeded. Bash defers traps until the foreground child returns, so
      # the resume trap would not run when activeDeadlineSeconds SIGTERMs the
      # shell -- leaving the server held, persisting nothing, until the next
      # morning's backup fails its own hold and resumes it.
      #
      # --tail=200 because this is the game server's console and chat shares
      # it (values-console-bridge.yaml sets CONTENT_LOG_CONSOLE_OUTPUT_ENABLED),
      # so a busy evening can push the manifest out of a 20-line window.
      # grep -a because that console carries binary bytes, which otherwise
      # make grep refuse the whole stream.
      manifest="$(timeout 10s kubectl logs -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" --tail=200 | grep -a -A1 'ready to be copied' | tail -1 | tr -d '\r')" || true
      [[ "$manifest" == *":"* ]] && break
      manifest=""
    done
    [[ -n "$manifest" ]] || give_up "the save manifest never arrived"

    # Each entry is path:length. The length is the number of bytes actually
    # committed -- LevelDB keeps appending, so a file on disk can be longer
    # than its valid contents, and copying the whole file is what produces a
    # world that will not open.
    count=0
    while read -r entry; do
      entry="$(echo "$entry" | xargs)"
      [[ -z "$entry" ]] && continue
      f="${entry%%:*}"
      len="${entry##*:}"
      mkdir -p "$OUT/$(dirname "$f")" || give_up "could not create $OUT/$(dirname "$f")"
      head -c "$len" "/data/worlds/$f" > "$OUT/$f" || give_up "could not copy $f"
      # head exits 0 on a source shorter than the length save query committed,
      # writing whatever it found. Nothing downstream compares the two, and a
      # short journal is byte-for-byte what a journal copied mid-write looks
      # like -- so this is refused here or it is not refused at all. The
      # backup job has the same gap and keeps it: a slightly short archive is
      # merely a little further behind, while a short census is a published
      # population count for a world that never existed.
      [[ "$(stat -c %s "$OUT/$f")" == "$len" ]] || give_up "$f copied short of the $len bytes save query committed"
      count=$((count + 1))
    done < <(echo "$manifest" | tr ',' '\n')

    [[ "$count" -ge 3 ]] || give_up "the manifest named only $count files"

    # Written last and only on success: its presence is what tells the census
    # a usable snapshot exists, and its contents are the only record of when
    # the world was captured. The census refuses to invent that timestamp.
    #
    # Written to a temporary name and renamed because a marker created under
    # its final name exists while it is still empty. The census container
    # cannot see that window -- it does not start until this container has
    # terminated -- but a failed write can leave it behind: the emptyDir has
    # a sizeLimit, and a marker that is present and empty is a parse failure
    # that fails the run instead of falling back to the archive.
    printf '%s\n' "$stamp" > "$OUT/.snapshot-taken-at.tmp" || give_up "could not write the capture stamp"
    mv "$OUT/.snapshot-taken-at.tmp" "$OUT/snapshot-taken-at" || give_up "could not publish the snapshot marker"
    echo "census-snapshot: copied $count files under hold, taken at $stamp"
{{- end }}
