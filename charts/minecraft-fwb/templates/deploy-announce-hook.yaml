{{- if .Values.deployAnnounce.enabled }}
# Warns players before a sync that might restart the server, as part of the
# sync itself.
#
# Every restart on 2026-09-07/08 reached players either with no warning or with
# one that was wrong, and the reason was structural rather than careless: this
# Application auto-syncs with selfHeal, so merging *is* deploying, and the only
# gap between the two is however long Argo takes to notice. Nothing an operator
# sends by hand can be reliably timed into that gap -- one attempt fired three
# minutes early, the next had no window at all because Argo went from
# regenerating the Application to deleting the pod inside a single poll.
#
# A PreSync hook is the only place the warning can sit and still be ahead of
# the change every time: Argo runs it to completion before applying anything,
# so the countdown finishes before the StatefulSet is touched, whoever or
# whatever triggered the sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "deployAnnounce.name" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Replace rather than accumulate: one object per sync, named the same, so a
    # failed run is visible until the next sync instead of leaving a pile of
    # completed Jobs behind.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # Bounded well above the countdown itself. A hook that hangs blocks every
  # sync for this Application -- including the sync that would fix it -- so it
  # has to fail rather than wait.
  activeDeadlineSeconds: {{ add .Values.deployAnnounce.leadSeconds 120 }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "deployAnnounce.name" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: announce
          image: {{ .Values.deployAnnounce.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 200m
          env:
            - name: SERVER_POD
              value: {{ include "backup.serverPod" . }}
            - name: SERVER_CONTAINER
              value: {{ .Release.Name }}-minecraft-bedrock
            - name: LEAD_SECONDS
              value: {{ .Values.deployAnnounce.leadSeconds | quote }}
            - name: EXPECTED_SPEC_HASH
              value: {{ include "deployAnnounce.serverSpecHash" . | quote }}
            - name: EXPECTED_AGENT_HASH
              value: {{ include "deployAnnounce.agentSpecHash" . | quote }}
            - name: EXPECTED_MAP_HASH
              value: {{ include "deployAnnounce.mapSpecHash" . | quote }}
            # Off is expressed here rather than by blanking the digest above,
            # so the ConfigMap keeps recording the map's and switching the
            # notice on later compares against the right previous state.
            - name: MAP_ANNOUNCE
              value: {{ .Values.deployAnnounce.map.enabled | quote }}
            - name: MAP_MESSAGE
              value: {{ .Values.deployAnnounce.map.message | quote }}
            # Who counts as nobody: the agent and the AFK bots are always
            # connected, so a count above zero is not by itself an audience.
            - name: ACTOR_NAMES
              value: {{ include "actors.kickable" . | quote }}
            - name: SPEC_HASH_CONFIGMAP
              value: {{ include "deployAnnounce.hashConfigMap" . }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"

              emit() { echo "{\"event\":\"$1\",\"detail\":\"${2:-}\"}"; }

              say() {
                local text="$1" json
                # Encoded by json.dumps, never by string interpolation. A
                # message containing a quote silently produced malformed
                # rawtext and the server rejected it -- which is how a joke
                # about broken deployments went out missing its punchline.
                json="$(MSG="$text" python3 -c 'import json,os; print(json.dumps({"rawtext":[{"text":os.environ["MSG"]}]}))')"
                timeout 15s kubectl exec -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" \
                  -- send-command tellraw @a "$json" >/dev/null 2>&1
              }

              # Ask the server who is on. `grep -a` because the console log
              # carries binary bytes and grep otherwise refuses the whole
              # stream -- the same defect that makes `tools/mc players` report
              # zero while four people are playing. A window of time rather
              # than of lines, because the map's live layer buries the reply
              # under its own lines within seconds.
              #
              # Sets ONLINE (empty when unreadable) and NAMES, the line the
              # server prints under the count.
              read_players() {
                local console
                timeout 15s kubectl exec -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" \
                  -- send-command list >/dev/null 2>&1
                sleep 2
                console="$(timeout 15s kubectl logs -n "$NS" "$SERVER_POD" -c "$SERVER_CONTAINER" --since=20s 2>/dev/null | tr -d '\000')"
                ONLINE="$(grep -a -oE 'There are [0-9]+/[0-9]+ players online' <<<"$console" | tail -1 \
                  | grep -oE '^There are [0-9]+' | grep -oE '[0-9]+')"
                NAMES="$(grep -a -A1 'players online' <<<"$console" | tail -1 | tr -d '\r')"
              }

              # True only when the count is positive, the names line was read,
              # it lists exactly that many, and every one is an actor. Anything
              # less certain is false: a missed announcement to a real player
              # is the worse error, a spurious line to nobody costs nothing.
              only_actors_online() {
                local count=0 name actor known actors
                [[ -n "$NAMES" && "$NAMES" != *"players online"* ]] || return 1
                while IFS= read -r name; do
                  name="${name#"${name%%[![:space:]]*}"}"
                  name="${name%"${name##*[![:space:]]}"}"
                  [[ -n "$name" ]] || continue
                  known=false
                  IFS=',' read -ra actors <<<"$ACTOR_NAMES"
                  for actor in "${actors[@]}"; do
                    [[ "${name,,}" == "${actor,,}" ]] && known=true
                  done
                  [[ "$known" == "true" ]] || return 1
                  count=$((count + 1))
                done < <(tr ',' '\n' <<<"$NAMES")
                [[ "$count" -eq "$ONLINE" ]]
              }

              # Never block a sync. Every failure below reports and exits 0:
              # the server being unreachable is a reason to skip the courtesy,
              # never a reason to stop the deployment that might be fixing it.
              if ! kubectl get pod -n "$NS" "$SERVER_POD" >/dev/null 2>&1; then
                emit skipped "server pod absent, nothing to warn"
                exit 0
              fi

              READY="$(kubectl get pod -n "$NS" "$SERVER_POD" \
                -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null || echo "")"
              if [[ "$READY" != "true" ]]; then
                emit skipped "server not ready, nobody is connected to warn"
                exit 0
              fi

              # Warn only when this sync will actually restart the server.
              #
              # Without this the hook fired on every sync, including ones that
              # only scaled a bot or changed a CronJob, and players were told a
              # restart was coming that never came. Twice in fifteen minutes on
              # 2026-09-08, which is how a warning system teaches people to
              # ignore it. It also held every unrelated deployment for the full
              # countdown, delaying changes that could not have disturbed
              # anyone.
              #
              # The ConfigMap still holds the previous sync's digest at this
              # point -- Argo applies hooks before manifests -- so a difference
              # means the server's own values changed in the manifests about to
              # be applied.
              LIVE_HASH="$(kubectl get configmap -n "$NS" "$SPEC_HASH_CONFIGMAP" \
                -o jsonpath='{.data.hash}' 2>/dev/null || echo "")"
              LIVE_AGENT_HASH="$(kubectl get configmap -n "$NS" "$SPEC_HASH_CONFIGMAP" \
                -o jsonpath='{.data.agentHash}' 2>/dev/null || echo "")"
              LIVE_MAP_HASH="$(kubectl get configmap -n "$NS" "$SPEC_HASH_CONFIGMAP" \
                -o jsonpath='{.data.mapHash}' 2>/dev/null || echo "")"
              if [[ -z "$LIVE_HASH" ]]; then
                # First sync after this was introduced, or someone deleted it.
                # Warn: an unknown previous state is not evidence of no change,
                # and a spurious warning is cheaper than a silent restart.
                emit unknown "no previous spec digest; warning rather than assuming no restart"
              elif [[ "$LIVE_HASH" == "$EXPECTED_SPEC_HASH" ]]; then
                # The server is not restarting. The chat agent might be, and
                # that is worth one line: it leaves chat for the length of a
                # fresh Xbox Live login, which looks exactly like a crash to
                # everyone watching. No countdown and no hold -- nobody is
                # being disconnected, so there is nothing to save.
                #
                # A missing previous agent digest stays silent, the opposite of
                # the unknown-server case above, because the costs are not
                # symmetric: an unannounced server restart throws players out,
                # while an unannounced agent release costs a few seconds of
                # confusion. On the first sync after this shipped there is no
                # agent digest to compare, and a notice then would be a guess.
                AGENT_CHANGING=false
                if [[ -n "$EXPECTED_AGENT_HASH" && -n "$LIVE_AGENT_HASH" \
                      && "$LIVE_AGENT_HASH" != "$EXPECTED_AGENT_HASH" ]]; then
                  AGENT_CHANGING=true
                fi

                # The map pod gets the same treatment, and the same asymmetry:
                # a missing previous digest is silent. The ConfigMap written by
                # the release before this existed has none, and announcing a
                # restart that is not happening is the one thing worse than
                # missing one that is. This sync records it, so the next
                # comparison is real. Renovate merges map image bumps
                # unattended, which is the whole reason this line exists.
                MAP_CHANGING=false
                if [[ "$MAP_ANNOUNCE" == "true" && -n "$EXPECTED_MAP_HASH" && -n "$LIVE_MAP_HASH" \
                      && "$LIVE_MAP_HASH" != "$EXPECTED_MAP_HASH" ]]; then
                  MAP_CHANGING=true
                fi

                if [[ "$AGENT_CHANGING" == "true" ]]; then
                  emit agent "agent spec changing ($LIVE_AGENT_HASH -> $EXPECTED_AGENT_HASH); one notice, no countdown"
                  say "§b§lChat assistant updating.§r§7 It will drop out of chat for a few seconds and come straight back. The server is not restarting."
                fi

                if [[ "$MAP_CHANGING" == "true" ]]; then
                  # The settle inside read_players is the only wait on this
                  # path, and it is not a countdown: the map restarting
                  # disconnects nobody, so nothing here holds the sync.
                  read_players
                  if [[ -z "$ONLINE" ]]; then
                    emit map "map spec changing ($LIVE_MAP_HASH -> $EXPECTED_MAP_HASH); could not read the player count, announcing anyway"
                    say "$MAP_MESSAGE"
                  elif [[ "$ONLINE" -eq 0 ]]; then
                    emit skipped "map spec changing ($LIVE_MAP_HASH -> $EXPECTED_MAP_HASH); not announced, nobody online"
                  elif only_actors_online; then
                    emit skipped "map spec changing ($LIVE_MAP_HASH -> $EXPECTED_MAP_HASH); not announced, only the server's own actors are online ($ONLINE)"
                  else
                    emit map "map spec changing ($LIVE_MAP_HASH -> $EXPECTED_MAP_HASH); one notice, no countdown"
                    say "$MAP_MESSAGE"
                  fi
                fi

                if [[ "$AGENT_CHANGING" == "true" || "$MAP_CHANGING" == "true" ]]; then
                  exit 0
                fi
                emit skipped "server spec unchanged ($EXPECTED_SPEC_HASH); this sync does not restart the server"
                exit 0
              else
                emit warning "server spec changing ($LIVE_HASH -> $EXPECTED_SPEC_HASH)"
              fi

              read_players

              if [[ -z "$ONLINE" ]]; then
                emit unknown "could not read the player count; warning anyway"
                ONLINE=1
              fi

              if [[ "$ONLINE" -eq 0 ]]; then
                emit skipped "nobody online, syncing immediately"
                exit 0
              fi

              emit warning "$ONLINE player(s) online, holding the sync for ${LEAD_SECONDS}s"

              say "§6§lServer update incoming.§r§e A short restart may follow in ${LEAD_SECONDS} seconds."
              say "§7Your world and inventory are safe. You will be able to rejoin straight after."

              # Milestones, not a tick per second: a message every second is
              # what buried the explanation last time and is why players could
              # not tell a countdown from a fault.
              REMAINING="$LEAD_SECONDS"
              for milestone in 60 30 10; do
                if [[ "$REMAINING" -gt "$milestone" ]]; then
                  sleep $((REMAINING - milestone))
                  REMAINING="$milestone"
                  say "§e${milestone} seconds until the update."
                fi
              done
              sleep "$REMAINING"

              say "§c§lUpdating now.§r§c If you are disconnected, rejoin in about a minute."
              emit done "countdown complete, releasing the sync"
{{- end }}
