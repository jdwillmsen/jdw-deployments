{{- if .Values.bot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bot.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "bot.name" . }}
spec:
  # Overridable so scaling to 0 for a manual account takeover — see README's
  # "Relocating a bot" — goes through git rather than a raw `kubectl scale`,
  # which selfHeal would revert on its next resync. Only this Deployment is
  # gated on replicas; the PVC stays gated on `enabled` alone so the token
  # cache survives a scale-to-0.
  #
  # No `| default 1` here deliberately: Sprig's `default` treats 0 as unset
  # and would silently coerce a real 0 back to 1, defeating the override it
  # exists for. values.yaml sets replicas: 1 explicitly instead.
  replicas: {{ .Values.bot.replicas }}
  # No rollback history worth keeping for a single-container bot image — the
  # chart pins the tag anyway, so a prior ReplicaSet buys nothing.
  revisionHistoryLimit: 0
  # Recreate, not RollingUpdate: the token cache is ReadWriteOnce, and two bots
  # signed in as the same account would fight over both the volume and the
  # server session.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "bot.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "bot.name" . }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          image: "{{ .Values.bot.image.repository }}:{{ .Values.bot.image.tag }}"
          imagePullPolicy: {{ .Values.bot.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: MC_HOST
              value: {{ include "bot.serverHost" . }}
            # The in-cluster Service publishes the server on its own port
            # rather than 19132, and the chart keeps serverPort and nodePort
            # equal so clients display a ping time.
            - name: MC_PORT
              value: {{ index .Values "minecraft-bedrock" "minecraftServer" "serverPort" | quote }}
            - name: MC_USERNAME
              value: {{ .Values.bot.username | quote }}
            - name: MC_VIEW_DISTANCE
              value: {{ .Values.bot.viewDistance | quote }}
            - name: MC_ANSWER_ENABLED
              value: {{ .Values.bot.answer.enabled | quote }}
            # `max ... 1` floors each of these at 1: the bot's own config.ts
            # loads them with a positive-int validator that throws on 0,
            # unconditionally — before MC_ANSWER_ENABLED is even checked — so
            # an 0 override here would crash-loop the whole pod, not just the
            # answer feature (same class of footgun replicas' `default`
            # comment above already documents for a different field).
            - name: MC_ANSWER_COOLDOWN_MS
              value: {{ mul (max .Values.bot.answer.cooldownSeconds 1) 1000 | quote }}
            - name: MC_ANSWER_MAX_PER_MINUTE
              value: {{ max .Values.bot.answer.maxPerMinute 1 | quote }}
            - name: MC_LLM_BASE_URL
              value: {{ .Values.bot.llm.baseUrl | quote }}
            - name: MC_LLM_MODEL
              value: {{ .Values.bot.llm.model | quote }}
            - name: MC_LLM_TIMEOUT_MS
              value: {{ max .Values.bot.llm.timeoutMs 1 | quote }}
            - name: MC_LLM_MAX_TOKENS
              value: {{ max .Values.bot.llm.maxTokens 1 | quote }}
            - name: MC_BOT_NAMES
              value: {{ join "," .Values.bot.botNames | quote }}
            {{- if .Values.bot.llm.apiKeySecret.create }}
            - name: MC_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bot.llm.apiKeySecret.name }}
                  key: {{ .Values.bot.llm.apiKeySecret.key }}
            {{- end }}
          resources:
            {{- toYaml .Values.bot.resources | nindent 12 }}
          volumeMounts:
            - name: auth
              mountPath: /data
            # The root filesystem is read-only, and node writes to a temp dir
            # on paths that are not obvious from the source.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: auth
          persistentVolumeClaim:
            claimName: {{ include "bot.name" . }}
        - name: tmp
          emptyDir: {}
{{- end }}
