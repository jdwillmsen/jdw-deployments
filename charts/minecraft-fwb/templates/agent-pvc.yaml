{{- if .Values.agent.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # Same reasoning as bot-pvc.yaml: a few small JSON files (the Xbox Live
  # token cache), not a database. On a volume at all because losing it costs
  # an interactive device-code login at a terminal.
  storageClassName: {{ .Values.agent.persistence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.agent.persistence.size }}
{{- end }}
