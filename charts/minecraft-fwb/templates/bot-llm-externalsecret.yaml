# Gated off by default (values.yaml: bot.llm.apiKeySecret.create) — the
# default local-vLLM backend needs no auth, so this renders nothing until a
# hosted backend (Groq/Gemini/LiteLLM) is actually wired up. Shape mirrors
# platform/tenants/platform/services/ai-sre-relay/postInstall/externalsecret.yaml.
{{- if and .Values.bot.enabled .Values.bot.llm.apiKeySecret.create }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.bot.llm.apiKeySecret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.bot.llm.apiKeySecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.bot.llm.apiKeySecret.key }}
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: minecraft-fwb
        property: llm_api_key
{{- end }}
