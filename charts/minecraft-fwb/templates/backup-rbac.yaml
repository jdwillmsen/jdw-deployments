{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
rules:
  # The backup drives the server's own save protocol over its console, so it
  # needs to exec into the pod and read back what `save query` printed. Scoped
  # to this namespace; nothing here is cluster-wide.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # An absent server has two meanings and only the desired replica count tells
  # them apart: scaled to zero is somebody's decision, one-or-more-but-absent
  # is a fault. Read-only, and scoped to the one workload it asks about.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["{{ include "backup.serverStatefulSet" . }}"]
    verbs: ["get"]
  # The job publishes its own freshness numbers into a ConfigMap, which is how
  # they reach the exporter without a shared volume. Scoped to the one name it
  # writes, so this cannot become a general write capability in the namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "backup.metricsConfigMap" . }}"]
    verbs: ["get", "update", "patch"]
  # An operator's acknowledgement and backfilled chunk counts for retention,
  # read-only: the job decides from it and never writes it.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "backup.retentionAckConfigMap" . }}"]
    verbs: ["get"]
{{- if .Values.map.enabled }}
  # The chunk count each archive is recorded with comes from the map's census
  # metrics, read through the API server so the job needs no route to the
  # map's cluster-only port. One service port, one verb. The resource name the
  # API server authorises is the whole path segment, "<service>:<port>", so a
  # grant on the bare service name matches nothing.
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["{{ include "map.name" . }}:internal"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
