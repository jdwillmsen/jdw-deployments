{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
rules:
  # The backup drives the server's own save protocol over its console, so it
  # needs to exec into the pod and read back what `save query` printed. Scoped
  # to this namespace; nothing here is cluster-wide.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # The job publishes its own freshness numbers into a ConfigMap, which is how
  # they reach the exporter without a shared volume. Scoped to the one name it
  # writes, so this cannot become a general write capability in the namespace.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ include "backup.metricsConfigMap" . }}"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "backup.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "backup.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "backup.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
