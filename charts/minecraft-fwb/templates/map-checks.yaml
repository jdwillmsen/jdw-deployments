{{- if include "map.checks.on" . }}
# Looks at the live map the way a player does, in a real browser, and says
# whether it works.
#
# Every feature of the page shipped having been checked only against a
# made-up world, because the only way into the map is a player typing a code
# in the game. Follow failed whenever a player's head was listed; pictures
# changed size during a zoom; both were found by a player. This runs the
# map's own browser checks against production on a schedule, with a session
# that is nobody's and can only read.
#
# The session is had here in the cluster, on the map's internal port, which
# the route does not publish. Everything after that is asked of the public
# hostname, through the gateway, because the gateway is part of what has to
# work: it cuts a connection idle for 30 s, and the live stream is a
# connection that is often idle.
{{- if .Values.map.checks.evidence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "map.checks.evidence.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  # Only with evidence on. A failed check's screenshot is worth taking only
  # if someone can fetch it in the morning, and the job's pod is gone minutes
  # after it ran, so it is a volume and not an emptyDir.
  #
  # ReadWriteOnce: the job writes it and the reader below reads it, and the
  # job is made to run on the reader's node so that one attachment serves
  # both. Nothing needs it from two nodes at once.
  storageClassName: {{ .Values.map.checks.evidence.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.map.checks.evidence.size }}
---
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "map.checks.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.checks.name" . }}
spec:
  # Kept off the hours when the map is not expected to be itself: the nightly
  # backup and census, through which the map's own snapshots are paused
  # (map.quietUTC), and the daily restart. tools/tests/test-map.sh fails if
  # the schedule wanders into either.
  schedule: {{ .Values.map.checks.schedule | quote }}
  timeZone: Etc/UTC
  # A run that has not finished is still holding a browser open on the same
  # nodes as the game server; a second beside it buys nothing.
  concurrencyPolicy: Forbid
  # A run that could not start on time is skipped, not run late into a
  # window the schedule was written to avoid.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry: a second attempt is a second exchange and a second two
      # minutes of browser, and a check that fails once and passes on retry
      # is a finding that would never be seen.
      backoffLimit: 0
      ttlSecondsAfterFinished: {{ .Values.map.checks.ttlSecondsAfterFinished }}
      # A run is about two and a half minutes and its session ends at
      # map.checks.sessionTTL whatever happens here; past this the run is
      # wedged, and with Forbid a wedged run would block every one after it.
      activeDeadlineSeconds: {{ .Values.map.checks.timeoutSeconds }}
      template:
        metadata:
          labels:
            app: {{ include "map.checks.name" . }}
          annotations:
            # Which secret this run presents, written where it shows: the
            # same name is on the map's pods, and the two have to agree.
            minecraft-fwb/map-checks-secret: {{ include "map.checks.secret.name" . | quote }}
        spec:
          restartPolicy: Never
          # The job asks nothing of the cluster. Its secret is a file, the
          # map is an address, and its results are its log and its exit
          # status, so it carries no token: a browser that has just loaded a page from the internet
          # is the last process that should hold one.
          automountServiceAccountToken: false
          # Nor the address of every Service in the namespace in its
          # environment.
          enableServiceLinks: false
          # The image's own unprivileged user, pwuser. Its Chromium runs
          # without the browser's own sandbox, as it must in a container
          # that may not make user namespaces, so everything from here to
          # the network policy below is what contains it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 2000
            seccompProfile:
              type: RuntimeDefault
          # Preferred, not required: on a cluster with one schedulable node
          # the checks still run, inside the limits below. Where there is a
          # choice the browser is put somewhere the game server is not.
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        app: {{ include "backup.serverStatefulSet" . }}
{{- if .Values.map.checks.evidence.enabled }}
            # Required: the evidence volume attaches to one node, and the
            # reader already holds it there.
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app: {{ include "map.checks.evidence.name" . }}
{{- end }}
          containers:
            - name: checks
              image: {{ include "map.checks.image" . | quote }}
              imagePullPolicy: IfNotPresent
              args:
                # The hostname players use, so that the gateway, its
                # certificate and its timeouts are all in the path.
                - "--public-url"
                - "https://{{ .Values.map.host }}"
                # The exchange and nothing else goes here.
                - "--internal-url"
                - "http://{{ include "map.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.map.internalPort }}"
                # Read by the runner from the file and held in its memory.
                # Not an environment variable: those are printed by
                # `kubectl describe`, by crash dumps and by anything that
                # logs its environment.
                - "--secret-file"
                - "/var/run/mcmap-e2e/secret"
{{- if .Values.map.checks.evidence.enabled }}
                # A failed check leaves a screenshot here: a picture of the
                # live map, with real coordinates and gamertags, and nothing
                # else. No trace, no request, no cookie. See "Browser
                # checks" in the chart README for how it is fetched and why
                # it is never attached to anything.
                - "--evidence-dir"
                - "/var/lib/mcmap-e2e/evidence"
                - "--evidence-keep"
                - {{ .Values.map.checks.evidence.keepRuns | quote }}
                - "--evidence-days"
                - {{ .Values.map.checks.evidence.keepDays | quote }}
                - "--evidence-max-mb"
                - {{ .Values.map.checks.evidence.maxMegabytesPerRun | quote }}
{{- if .Values.map.checks.evidence.pages }}
                # And the page's HTML and the fault's text beside it.
                - "--evidence-pages"
{{- end }}
{{- end }}
                - "--stream-seconds"
                - {{ .Values.map.checks.streamSeconds | quote }}
                - "--api-budget-ms"
                - {{ .Values.map.checks.apiBudgetMs | quote }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
{{- toYaml .Values.map.checks.resources | nindent 16 }}
              volumeMounts:
                - name: secret
                  mountPath: /var/run/mcmap-e2e
                  readOnly: true
{{- if .Values.map.checks.evidence.enabled }}
                - name: evidence
                  mountPath: /var/lib/mcmap-e2e
{{- end }}
                # The browser's profile and scratch for one run, which the
                # read-only root leaves nowhere else to put.
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: secret
              secret:
                secretName: {{ include "map.checks.secret.name" . }}
                # Group-readable and no more: the volume is given to the
                # pod's fsGroup, and the runner is not its owner.
                defaultMode: 0440
                items:
                  - key: {{ include "map.checks.secret.key" . }}
                    path: secret
{{- if .Values.map.checks.evidence.enabled }}
            - name: evidence
              persistentVolumeClaim:
                claimName: {{ include "map.checks.evidence.name" . }}
{{- end }}
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.map.checks.tmpSizeLimit }}
---
# What the job's pod may talk to: the name server, the map's internal port
# for the exchange, and the gateway that serves the public hostname. Nothing
# reaches it, and it reaches nothing else: not the game server, not the
# console bridge, not the cluster's API, not the internet. A browser is the
# largest thing this chart runs and the only one that executes whatever a
# page hands it.
#
# The map's public port is deliberately not here. A run that could reach the
# pod directly could pass while the gateway was down.
#
# It restricts nothing unless the platform enforces network policy in this
# namespace. A tenant namespace that is not enforced is given allow-all
# policies by the platform, and policies only ever add, so this one would
# render, apply and change nothing. That is why the chart will not render the
# checks at all until map.checks.networkPolicyEnforced says the namespace is
# enforced: this policy is what stands in for the browser's own sandbox.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "map.checks.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "map.checks.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: {{ include "map.name" . }}
      ports:
        - protocol: TCP
          port: {{ .Values.map.internalPort }}
    # No port: a connection to the gateway's address is rewritten to one of
    # its pods before the policy sees it, and the port it arrives on there
    # is the gateway's own business.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.map.checks.networkPolicy.gatewayNamespace }}
{{- with .Values.map.checks.networkPolicy.publicCIDRs }}
    # For a network plugin that judges the address the browser dialled and
    # not the pod behind it.
    - to:
{{- range . }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
{{- if .Values.map.checks.evidence.enabled }}
---
# Holds the evidence volume so that it can be read. It does nothing: the
# job's pod is gone minutes after a run, and fetching a screenshot needs a
# pod that is there, with the volume mounted, read-only. Without it the only
# way to the evidence would be a pod made by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "map.checks.evidence.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "map.checks.evidence.name" . }}
spec:
  replicas: 1
  revisionHistoryLimit: 0
  # The claim attaches once, so the old pod lets go before the new one asks.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "map.checks.evidence.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "map.checks.evidence.name" . }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reader
          image: {{ .Values.map.checks.evidence.reader.image | quote }}
          command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 8Mi
              cpu: 5m
            limits:
              memory: 32Mi
              cpu: 50m
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/mcmap-e2e
              readOnly: true
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: {{ include "map.checks.evidence.name" . }}
{{- end }}
{{- if .Values.map.checks.evidence.enabled }}
---
# The reader holds pictures of the live map and has no reason to speak to
# anything or be spoken to: evidence is copied out of it through the
# cluster's API, by whoever is allowed to, which is not a connection to the
# pod's network. Nothing in, nothing out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "map.checks.evidence.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "map.checks.evidence.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
{{- end }}
---
# Whether a run passed is whether its Job succeeded: the runner exits 0 when
# every check passed or had nothing to look at, and non-zero when one failed
# or the run broke. So the rules about runs read the Job's and the CronJob's
# own state from kube-state-metrics, which is there whatever became of the
# run: a pod killed for memory, or at its deadline, wrote nothing and is a
# failed Job all the same. What each check measured is in the run's log.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "map.checks.name" . }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: minecraft-fwb-map-checks
      rules:
        - alert: JdwillmsenMinecraftMapChecksFailing
          # The newest failed Job of this CronJob began after the CronJob
          # last succeeded: the last run failed. It stays so until a run
          # passes, and is not held by a failed Job from yesterday that
          # later runs have put behind them.
          #
          # A failed Job is any of: a check failed, the run broke, the pod
          # was killed, or the run was still going at its deadline and
          # never finished. Ownership is read from kube_job_owner and not
          # guessed from the Job's name.
          #
          # A CronJob that has never succeeded has no last success to
          # compare with, so it is given zero.
          #
          # No `for`: the condition is already the state of the last run
          # and not a reading that could flap.
          expr: |
            max by (namespace) (
              max by (namespace, job_name) (kube_job_status_start_time{namespace="{{ .Release.Namespace }}"})
              and on (namespace, job_name)
                (max by (namespace, job_name) (kube_job_status_failed{namespace="{{ .Release.Namespace }}"}) > 0)
              and on (namespace, job_name)
                kube_job_owner{namespace="{{ .Release.Namespace }}", owner_kind="CronJob", owner_name="{{ include "map.checks.name" . }}"}
            )
            > on (namespace)
            (
              max by (namespace) (kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "map.checks.name" . }}"})
              or on (namespace)
              max by (namespace) (kube_cronjob_spec_suspend{namespace="{{ .Release.Namespace }}", cronjob="{{ include "map.checks.name" . }}"} * 0)
            )
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map failed its browser checks
            description: >-
              The last run of the map's browser checks failed: a check did, or the
              run was killed or did not finish by its deadline. The Job's log has
              one line of JSON a check, with a verdict, a reason from the suite's
              own list and what it measured; a run that was killed has no last
              line saying how it ended. charts/minecraft-fwb/README.md, "Browser
              checks".
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
        - alert: JdwillmsenMinecraftMapChecksStale
          # The other way to have no failing checks: no checks. This is
          # the controller not having started a run, whatever became of the
          # runs before: a CronJob suspended, or one that cannot be
          # scheduled.
          #
          # The limit is the longest gap the schedule leaves on purpose,
          # the five hours of the night, and one run skipped beside it,
          # with room. The `for` is over that again, so a controller
          # restart that reports nothing for a few minutes is not a page.
          expr: |
            (time() - max by (namespace) (kube_cronjob_status_last_schedule_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "map.checks.name" . }}"}))
              > {{ include "map.checks.staleSeconds" . }}
          for: {{ .Values.map.checks.alert.staleFor }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map's browser checks have stopped running
            description: >-
              No run of the map's browser checks has been started for
              {{ "{{ $value | humanizeDuration }}" }}, which is longer than the
              schedule ever leaves. Nothing is watching the page meanwhile. Check
              that the {{ include "map.checks.name" . }} CronJob is not suspended
              and that its pods can be scheduled.
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
        - alert: JdwillmsenMinecraftMapChecksNeverRan
          # A CronJob that has never started a run has no schedule time at
          # all, and the rule above has nothing to subtract.
          expr: |
            absent(kube_cronjob_status_last_schedule_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "map.checks.name" . }}"})
          for: {{ .Values.map.checks.alert.staleAfter }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map's browser checks have never run
            description: >-
              The checks are switched on and the
              {{ include "map.checks.name" . }} CronJob has never started a run,
              or kube-state-metrics is not reporting it.
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
        - alert: JdwillmsenMinecraftMapServiceExchangeRefused
          # Nothing that holds the secret ever presents a wrong one, and the
          # job presents it once a run. So any refusal is one of two things:
          # the job and the map disagree about the secret, which is a broken
          # rotation, or something in the cluster is guessing.
          expr: |
            sum by (namespace) (increase(mcmap_service_exchanges_total{namespace="{{ .Release.Namespace }}", result!="ok"}[15m])) > 0
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: The Minecraft FWB map refused an exchange for a service session
            description: >-
              The map's internal port was asked for a service session and said no.
              mcmap_service_exchanges_total by result says how: denied is a wrong
              secret, limited is a wrong one past the few judged each minute,
              malformed is a secret put in an address. The map logs each as "map
              service session refused" with the caller's address. If the checks are failing too, the map and the job
              are not reading the same Secret.
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
        - alert: JdwillmsenMinecraftMapServiceExchangeFromOutside
          # The job's exchange comes from a pod address and is counted as
          # private. loopback is a port-forward: a person or an agent
          # running the checks from outside the cluster, which needs the
          # owner's say-so each time. other is an address that should not be
          # able to reach the internal port at all. Either is told, whether
          # it was let in or not.
          expr: |
            sum by (namespace, source) (increase(mcmap_service_exchanges_total{namespace="{{ .Release.Namespace }}", source!="private"}[15m])) > 0
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: A service session for the Minecraft FWB map was asked for from outside the cluster
            description: >-
              An exchange reached the map's internal port from {{ "{{ $labels.source }}" }}:
              loopback is a kubectl port-forward, other is an address with no
              business there. A run of the checks from a developer's or an agent's
              machine looks like this, and is meant to: it is expected only when the
              owner allowed that run. The map's log line for it carries the caller's
              user agent, which names who said they were allowed.
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
        - alert: JdwillmsenMinecraftMapServiceExchangeRate
          # The schedule is the only caller inside the cluster there should
          # be. More sessions than it accounts for means something else has
          # the secret.
          #
          # From inside only. A run from outside is told by the rule above,
          # each one, and is the owner's to have allowed; counted here as
          # well, an allowed run before and after a rollout would end in
          # advice to rotate a secret nobody has stolen.
          expr: |
            sum by (namespace) (increase(mcmap_service_exchanges_total{namespace="{{ .Release.Namespace }}", result="ok", source="private"}[1h])) > {{ .Values.map.checks.alert.maxExchangesPerHour }}
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
          annotations:
            summary: More service sessions for the Minecraft FWB map are being issued than its checks ask for
            description: >-
              More than {{ .Values.map.checks.alert.maxExchangesPerHour }} service
              sessions were issued in an hour, and the schedule asks for fewer. Each
              is a "map service session issued" line in the map's log with the
              caller's address. If the callers are not the checks' own pods, rotate
              the Secret by raising map.checks.secret.generation.
            runbook_url: "https://github.com/jdwillmsen/jdw-deployments/blob/main/charts/minecraft-fwb/README.md#browser-checks"
{{- end }}
