# Shape mirrors bot-llm-externalsecret.yaml / platform/tenants/platform/
# services/ai-sre-relay/postInstall/externalsecret.yaml. Both properties come
# from the same Vault kv document (key: minecraft-fwb) the bot LLM secret
# already uses — this is additive to that document, not a new one. Unlike
# bot-llm-externalsecret.yaml this is not gated: the console-bridge sidecar
# and minecraft-bedrock's WEBSOCKET_PASSWORD both hard-depend on it existing,
# so there is no "off" state for it to render nothing for.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.consoleBridge.secret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.global.consoleBridge.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: console_websocket_password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: minecraft-fwb
        property: console_websocket_password
    - secretKey: console_bridge_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: minecraft-fwb
        property: console_bridge_token
