# Shape mirrors bot-llm-externalsecret.yaml / platform/tenants/platform/
# services/ai-sre-relay/postInstall/externalsecret.yaml.
#
# Gated on its own flag, separate from the sidecar's, and on by default. That
# split is the point: this renders while nothing consumes what it produces, so
# the Vault document can be created and this object observed Synced before any
# workload is wired to it. An ExternalSecret failing on its own is inert — it
# holds a secret that nothing reads. The 40-hour outage on 2026-09-06 came
# from the opposite order: the sidecar and the game server were wired to this
# secret in the same commit that first asked Vault for it, and the document
# did not exist (docs/incidents/2026-09-06-fwb-console-bridge-secret.md).
{{- if .Values.global.consoleBridge.secret.create }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.consoleBridge.secret.name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: {{ .Values.global.consoleBridge.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: console_websocket_password
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: minecraft-fwb
        property: console_websocket_password
    - secretKey: console_bridge_token
      remoteRef:
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        key: minecraft-fwb
        property: console_bridge_token
{{- end }}
